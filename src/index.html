/* ---------- Mock draft: draft against computer teams, any format, any time ---------- */
const mock = {cfg: null, st: null, filter: "ALL", q: ""};
function mockCfg(){
  if (mock.cfg) return mock.cfg;
  calcDefaults();
  let c = null; try { c = JSON.parse(localStorage.getItem(KEY + ".mock") || "null"); } catch(e){}
  mock.cfg = c || {teams: Number(calc.teams) || 12, slot: 0, rounds: 15, dyn: !!calc.dyn, qbs: calc.qbs || 1, ppr: calc.ppr || "1", names: true};
  return mock.cfg;
}
function saveMockCfg(){ try { localStorage.setItem(KEY + ".mock", JSON.stringify(mock.cfg)); } catch(e){} }
const MOCK_CAP = qbs => ({QB: qbs === 2 ? 4 : 2, RB: 7, WR: 8, TE: 2});
function mockNeed(team, pos, cfg, round){
  const c = {QB: 0, RB: 0, WR: 0, TE: 0}; team.forEach(p => c[p.pos] = (c[p.pos] || 0) + 1);
  const start = {QB: cfg.qbs === 2 ? 2 : 1, RB: 2, WR: 3, TE: 1};
  if (c[pos] >= MOCK_CAP(cfg.qbs)[pos]) return 0.15;
  let f = c[pos] < start[pos] ? 1.12 : c[pos] < start[pos] + 1 ? 1 : 0.86;
  if (pos === "QB" && cfg.qbs === 1 && c.QB >= 1) f *= 0.6;
  if (pos === "TE" && c.TE >= 1) f *= 0.65;
  if (round >= Math.ceil(cfg.rounds * 0.6) && c[pos] === 0) f *= 1.35; // fill an empty position late
  return f;
}
function mockOrder(cfg){ const out = []; for (let r = 0; r < cfg.rounds; r++) for (let k = 0; k < cfg.teams; k++) out.push(r % 2 === 0 ? k : cfg.teams - 1 - k); return out; }
async function startMock(v){
  const cfg = mockCfg();
  if (cfg.dyn && cfg.kind === "rookie") { try { return await startRookieMock(v, cfg); } catch(e){ v.querySelector("#mockBox").innerHTML = '<div class="err">Couldn’t set up the rookie draft: ' + esc(e.message) + "</div>"; return; } }
  v.querySelector("#mockBox").innerHTML = '<p class="spin">Setting up the draft room…</p>';
  const pack = await loadValues(cfg.ppr, cfg.teams, cfg.qbs, cfg.dyn);
  const prem = qbPremium(cfg.teams, cfg.qbs);
  const seen = new Set(), pool = [];
  Object.keys(pack.v).forEach(k => {
    if (k[0] === "f" || k.startsWith("pick:")) return; const r = pack.v[k]; if (!r || !["QB", "RB", "WR", "TE"].includes(r[5]) || seen.has(r[4] + r[5])) return; seen.add(r[4] + r[5]);
    pool.push({id: k, name: r[4], pos: r[5], team: r[15] || "", age: r[6], v: (r[0] || 0) * (r[5] === "QB" ? prem : 1)});
  });
  pool.sort((a, b) => b.v - a.v);
  pool.forEach((p, i) => p.adp = i + 1);
  const L = leagues.find(x => x.detail && x.detail.teams.some(t => t.mine) && x.detail.teams.length === cfg.teams);
  const names = Array.from({length: cfg.teams}, (_, i) => "Team " + (i + 1));
  const slot = cfg.slot ? cfg.slot - 1 : Math.floor(Math.random() * cfg.teams);
  if (L && cfg.names) { const others = L.detail.teams.filter(t => !t.mine).sort(() => Math.random() - 0.5); let j = 0; for (let i = 0; i < cfg.teams; i++) if (i !== slot) names[i] = (others[j++] || {}).name || names[i]; names[slot] = L.detail.teams.find(t => t.mine).name; }
  else names[slot] = "You";
  mock.st = {pool: pool.slice(0, Math.ceil(cfg.teams * cfg.rounds * 1.6) + 40), order: mockOrder(cfg), at: 0, slot, names, teams: names.map(() => []), log: [], cfg: Object.assign({}, cfg)};
  mock.filter = "ALL"; mock.q = "";
  mockAdvance(v);
}
function mockAiPick(st){
  const t = st.order[st.at], round = Math.floor(st.at / st.cfg.teams) + 1, cand = st.pool.slice(0, st.kind === "rookie" ? 8 : 14);
  if (st.kind === "rookie") { let best = null, bs = -1; cand.forEach(p => { const sc = p.v * rookieNeed(st, t, p.pos) * Math.exp(0.15 * (Math.random() * 2 - 1)); if (sc > bs) { bs = sc; best = p; } }); return best || st.pool[0]; }
  let best = null, bs = -1;
  cand.forEach(p => { const noise = Math.exp(0.16 * (Math.random() * 2 - 1) * 1.7); const sc = p.v * mockNeed(st.teams[t], p.pos, st.cfg, round) * noise; if (sc > bs) { bs = sc; best = p; } });
  return best || st.pool[0];
}
function mockSuggest(st){
  const round = Math.floor(st.at / st.cfg.teams) + 1;
  if (st.kind === "rookie") return st.pool.slice(0, 10).map(p => ({p, s: p.v * rookieNeed(st, st.slot, p.pos)})).sort((a, b) => b.s - a.s)[0].p;
  return st.pool.slice(0, 20).map(p => ({p, s: p.v * mockNeed(st.teams[st.slot], p.pos, st.cfg, round)})).sort((a, b) => b.s - a.s)[0].p;
}
function mockTake(st, p){
  const t = st.order[st.at]; st.pool = st.pool.filter(x => x !== p);
  const slotV = st.kind === "rookie" ? (st.slotVals[st.at] || p.v) : null;
  st.teams[t].push(Object.assign({}, p, {pick: st.at + 1, round: Math.floor(st.at / st.cfg.teams) + 1, slotV}));
  st.log.unshift({at: st.at, t, p}); st.at++;
}
function mockAdvance(v, autoMe){
  const st = mock.st;
  while (st.at < st.order.length && (st.order[st.at] !== st.slot || autoMe)) mockTake(st, st.order[st.at] === st.slot ? mockSuggest(st) : mockAiPick(st));
  drawMock(v);
}
function pickLabel(st, at){ if (st.labels) return st.labels[at].split(" (")[0]; const r = Math.floor(at / st.cfg.teams) + 1, k = at % st.cfg.teams + 1; return r + "." + String(k).padStart(2, "0"); }
function mockGrades(st){
  if (st.kind === "rookie") {
    const sc = st.teams.map((tm, i) => { const exp = tm.reduce((s, p) => s + p.slotV, 0), got = tm.reduce((s, p) => s + p.v, 0); return tm.length ? got / Math.max(1, exp) : 0; });
    const ord = sc.map((x, i) => i).filter(i => st.teams[i].length).sort((a, b) => sc[b] - sc[a]), G = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D", "F"];
    return st.teams.map((tm, i) => { const r = ord.indexOf(i); return r < 0 ? {rank: null, grade: "–", tot: 0} : {rank: r + 1, grade: G[Math.min(G.length - 1, Math.floor(r / ord.length * G.length))], tot: sc[i]}; });
  }
  const slots = ["QB", "RB", "RB", "WR", "WR", "WR", "TE", "FLEX"].concat(st.cfg.qbs === 2 ? ["SUPER_FLEX"] : []);
  const tot = st.teams.map(tm => { const lu = bestLineup(tm, slots, p => p.v); return lu.total + 0.25 * (tm.reduce((s, p) => s + p.v, 0) - lu.total); });
  const order = tot.map((x, i) => i).sort((a, b) => tot[b] - tot[a]);
  const G = ["A+", "A", "A-", "B+", "B", "B-", "C+", "C", "C-", "D", "F"];
  return st.teams.map((_, i) => { const r = order.indexOf(i), g = G[Math.min(G.length - 1, Math.floor(r / st.cfg.teams * G.length))]; return {rank: r + 1, grade: g, tot: tot[i]}; });

let prospectsP = null;
function getProspects(){ if (!prospectsP) prospectsP = api("/api/prospects").catch(e => { prospectsP = null; throw e; }); return prospectsP; }
// Rookie order: NFL draft analysts' boards set each prospect's projected draft slot (draft capital
// drives rookie value), weighted by position for this format; dynasty rookie boards add a smaller say.
function prospectBoard(P, sf){
  const key = n => norm(String(n).replace(/\b(jr|sr|ii|iii|iv)\.?$/i, "")), all = {};
  const get = (n, pos, school) => { const k = key(n) + "|" + pos; return all[k] = all[k] || {name: n, pos, school, an: [], fa: []}; };
  (P.analysts || []).forEach(src => {
    (src.list || []).forEach(([r, n, pos, school]) => get(n, pos, school).an.push({src, r, est: false}));
    (src.beyond || []).forEach(([n, pos, school, r]) => get(n, pos, school).an.push({src, r, est: true}));
  });
  const fl = (P.fantasy || []).filter(x => x.format === "any" || x.format === (sf ? "sf" : "1qb"));
  fl.forEach(src => src.list.forEach(([n, pos, school], i) => get(n, pos, school).fa.push({src, r: i + 1})));
  const W = sf ? {QB: 1.0, WR: 1.0, RB: 0.95, TE: 0.62} : {QB: 0.55, WR: 1.0, RB: 0.95, TE: 0.62};
  const out = Object.values(all).map(x => {
    // Average of the boards that rank him (recent boards count more), plus a small penalty for each board that leaves him off.
    let num = 0, den = 0, miss = 0;
    (P.analysts || []).forEach(src => { const h = x.an.find(y => y.src === src); if (h) { num += src.w * h.r; den += src.w; } else miss++; });
    x.nfl = den ? num / den + 5 * miss : null;
    let fn = 0, fd = 0; fl.forEach(src => { const h = x.fa.find(y => y.src === src); fn += h ? h.r : src.list.length + 10; fd++; });
    x.fan = fd && x.fa.length ? fn / fd : null;
    const capital = x.nfl != null ? 100 * Math.exp(-x.nfl / 45) * (W[x.pos] || 0.8) : 0;
    const fantasy = x.fan != null ? 100 * Math.exp(-x.fan / 14) : 0;
    x.score = x.nfl != null && x.fan != null ? 0.75 * capital + 0.25 * fantasy : x.nfl != null ? capital * 0.92 : fantasy * 0.5;
    x.analysts = x.an.filter(y => !y.est).sort((a, b) => (b.src.date > a.src.date) - (b.src.date < a.src.date)).map(y => (y.src.short || y.src.name) + " #" + y.r);
    return x;
  }).filter(x => x.an.length || x.fa.length >= 2);
  return out.sort((a, b) => b.score - a.score).map((x, i) => Object.assign(x, {rank: i + 1}));
}
async function projectDraft(L){
  const d = L.detail, [sched, picks] = await Promise.all([getSchedule(L), loadPicks(L)]);
  const N = d.teams.length, S = simDetail(d, sched, 1500);
  const owner = {}; let season = null, rounds = 0;
  Object.keys(picks).forEach(oid => (picks[oid] || []).forEach(pk => { const [, sy, rd, orig] = pk.id.split(":"); owner[sy + ":" + rd + ":" + orig] = oid; if (season == null || Number(sy) < season) season = Number(sy); }));
  Object.keys(owner).forEach(k => { const [sy, rd] = k.split(":"); if (Number(sy) === season) rounds = Math.max(rounds, Number(rd)); });
  if (!season) { season = (Number(d.season) || new Date().getFullYear()) + 1; rounds = 4; }
  const exp = d.teams.map((t, i) => ({t, i, avg: S.slotDist[i].reduce((s, c, k) => s + c * (k + 1), 0) / S.n})).sort((a, b) => a.avg - b.avg);
  const order = [];
  for (let rd = 1; rd <= rounds; rd++) exp.forEach((x, k) => { const own = owner[season + ":" + rd + ":" + x.t.id] || x.t.id; order.push({rd, slot: k + 1, orig: x.t, owner: d.teams.find(t => t.id === own) || x.t}); });
  return {season, rounds, order};
}

function rookieNeed(st, t, pos){
  const ro = st.rosters ? st.rosters[t] : [], drafted = st.teams[t];

function negoCtx(ctx, me, them, give, get){

    "YOU ARE: " + them.name + (them.owner ? " (" + them.owner + ")" : "") + ", record " + them.w + "-" + them.l + ", " + ORDN(rank) + " of " + N + ", " + mode + ". Your weakest positions: " + needs.slice(0, 2).map(x => x.pos).join(" and ") + ".\n" +

    "THE USER'S ROSTER (what you could ask for): " + me.roster.concat(ctx.myPicks).slice().sort((a, b) => val(b) - val(a)).slice(0, 18).map(line).join("; ") + ".";

/* ---------- power rankings with schedule luck (all-play record) ---------- */
function powerTable(games, upto){
  const T = {}, wk = {};
  games.filter(g => !g.po && !g.cons && g.as != null && g.hs != null && g.wk <= upto).forEach(g => {
    [[g.a, g.as, g.hs], [g.h, g.hs, g.as]].forEach(([t, pf, pa]) => { const x = T[t.id] = T[t.id] || {id: t.id, name: t.name, logo: t.logo, w: 0, l: 0, t: 0, pf: 0, g: 0, scores: [], aw: 0, al: 0}; x.g++; x.pf += pf; x.scores.push({wk: g.wk, pf}); if (pf > pa) x.w++; else if (pf < pa) x.l++; else x.t++; (wk[g.wk] = wk[g.wk] || []).push({id: t.id, pf}); });
  });
  // All-play: how you'd do against every team every week.
  Object.values(wk).forEach(arr => arr.forEach(a => arr.forEach(b => { if (a === b) return; if (a.pf > b.pf) T[a.id].aw++; else if (a.pf < b.pf) T[a.id].al++; })));
  const xs = Object.values(T); if (!xs.length) return [];
  xs.forEach(x => { x.ppg = x.pf / x.g; x.last3 = x.scores.slice().sort((a, b) => b.wk - a.wk).slice(0, 3).reduce((s, y, _, a) => s + y.pf / a.length, 0); x.ap = x.aw + x.al ? x.aw / (x.aw + x.al) : 0; x.luck = (x.w + x.t / 2) - x.ap * x.g; });
  const z = k => { const m = xs.reduce((s, x) => s + x[k], 0) / xs.length, sd = Math.sqrt(xs.reduce((s, x) => s + (x[k] - m) ** 2, 0) / xs.length) || 1; xs.forEach(x => x["z" + k] = (x[k] - m) / sd); };
  ["ppg", "last3", "ap"].forEach(z);
  xs.forEach(x => x.power = 0.45 * x.zppg + 0.3 * x.zlast3 + 0.25 * x.zap);
  return xs.sort((a, b) => b.power - a.power);
}

/* ---------- schedule swap: your record with every other team's schedule ---------- */
function swapTable(games){
  const sc = {}, op = {}, info = {}, weeks = new Set();
  games.filter(g => !g.po && !g.cons && g.as != null && g.hs != null).forEach(g => {
    weeks.add(g.wk); (sc[g.wk] = sc[g.wk] || {}); (op[g.wk] = op[g.wk] || {});
    sc[g.wk][g.a.id] = g.as; sc[g.wk][g.h.id] = g.hs; op[g.wk][g.a.id] = g.h.id; op[g.wk][g.h.id] = g.a.id;
    [g.a, g.h].forEach(t => { if (!info[t.id]) info[t.id] = {id: t.id, name: t.name, logo: t.logo}; });
  });
  const ids = Object.keys(info), wks = [...weeks].sort((a, b) => a - b);
  // A plays whoever B played that week; if that was A itself, A plays B instead (the usual schedule-swap rule).
  const rec = (a, b) => { const r = {w: 0, l: 0, t: 0, pa: 0}; wks.forEach(wk => { const S = sc[wk]; if (S[a] == null || S[b] == null) return; let o = op[wk][b]; if (o === a) o = b; if (S[o] == null) return; r.pa += S[o]; if (S[a] > S[o]) r.w++; else if (S[a] < S[o]) r.l++; else r.t++; }); return r; };
  const M = {}; ids.forEach(a => { M[a] = {}; ids.forEach(b => M[a][b] = rec(a, b)); });
  const wins = r => r.w + r.t / 2;
  const teams = ids.map(a => {
    const own = M[a][a], all = ids.map(b => ({b, r: M[a][b]})), avg = all.reduce((s, x) => s + wins(x.r), 0) / all.length;
    const best = all.slice().sort((x, y) => wins(y.r) - wins(x.r) || x.r.pa - y.r.pa)[0], worst = all.slice().sort((x, y) => wins(x.r) - wins(y.r) || y.r.pa - x.r.pa)[0];
    const beats = all.filter(x => x.b !== a && wins(x.r) > wins(own)).length;
    return Object.assign({}, info[a], {own, avg, best, worst, luck: wins(own) - avg, beats});
  });
  // How hard each schedule is: average wins the whole league would get with it.
  const scheds = ids.map(b => Object.assign({}, info[b], {avg: ids.reduce((s, a) => s + wins(M[a][b]), 0) / ids.length, pa: M[b][b].pa}));
  return {M, ids, info, teams, scheds, weeks: wks.length, last: wks[wks.length - 1] || 0, wins};
}

/* ---------- Bye-week & injury planner: lineup holes for the next 4 weeks in every league ---------- */
const LONG_OUT = /^(ir|injured reserve|pup|nfi|sus|suspended|na|ir-r|ir-nfi|out for season)$/i;
function planOut(p, k){ // k = index of the planned week (0 = first)
  const s = String(p.inj || "").trim();
  if (LONG_OUT.test(s)) return /sus/i.test(s) ? "suspended" : /pup|nfi/i.test(s) ? "on PUP list" : "on injured reserve";
  if (k === 0 && /^(out|o)$/i.test(s)) return "ruled out";
  if (k === 0 && /^(doubtful|d)$/i.test(s)) return "doubtful";
  return null;
}
function planVal(L, p){
  if (p.avg != null && p.avg > 0) return p.avg;
  const id = sleeperKey(L, p), s = id && seasonPts(id, L.detail.scoring || "ppr");
  if (s && s.gp && s.pts > 0) return s.pts / s.gp;
  const pr = projFor(L, p); return pr > 0 ? pr : 0;
}
function planFill(pool, slots, v){
  const used = new Set(), order = slots.filter(s => !FLEX[s]).concat(slots.filter(s => FLEX[s])), list = [];
  const sorted = pool.slice().sort((a, b) => v(b) - v(a));
  for (const slot of order) { const pick = sorted.find(p => !used.has(p) && slotOk(slot, p.pos)); if (pick) used.add(pick); list.push({slot, p: pick || null, v: pick ? v(pick) : 0}); }
  return {list, total: list.reduce((s, x) => s + x.v, 0)};
}
async function planLeague(L, weeks, sch){
  const d = L.detail, me = d.teams.find(t => t.mine);
  await rosterFor(L, me);
  const v = p => planVal(L, p), slots = edgeSlots(L);
  const plays = (p, w) => { const wk = (sch.weeks || {})[w]; if (!wk || !Object.keys(wk).length) return true; return !!(p.team && wk[teamAbbr(tnorm(p.team))]); };
  const why = (p, w, k) => !p.team ? "has no NFL team" : !plays(p, w) ? "on bye" : planOut(p, k);
  const pool = me.roster.filter(p => p.slot !== "ir");

/* ---------- league history and rivalries ---------- */
const lh = {};
async function histSeasons(L, onProgress){
  const k = L.meta.platform + ":" + L.meta.id;
  if (lh[k]) return lh[k];
  const out = [];
  if (L.meta.platform === "flea") {
    const now = new Date(), cur = now.getMonth() < 2 ? now.getFullYear() - 1 : now.getFullYear();
    for (let y = cur; y > cur - 20; y -= 4) {
      const batch = await Promise.all([0, 1, 2, 3].map(i => api("/api/flea-history?league_id=" + L.meta.id + "&season=" + (y - i)).catch(() => ({missing: true}))));
      let stop = false;
      batch.forEach(b => { if (b.missing || !b.games) stop = true; else out.push(b); });
      if (onProgress) onProgress(out.length);
      if (stop) break;
    }
  } else if (L.meta.platform === "sleeper") {
    let lid = L.meta.id;
    for (let i = 0; i < 12 && lid && lid !== "0"; i++) {
      const lg = await api("/api/sleeper/league/" + lid).catch(() => null); if (!lg) break;
      const [users, rosters, bracket] = await Promise.all([api("/api/sleeper/league/" + lid + "/users").catch(() => []), api("/api/sleeper/league/" + lid + "/rosters").catch(() => []), api("/api/sleeper/league/" + lid + "/winners_bracket").catch(() => [])]);
      const po = Number((lg.settings || {}).playoff_week_start) || 15, last = Math.min(18, po + 3);
      const weeks = await Promise.all(Array.from({length: last}, (_, w) => api("/api/sleeper/league/" + lid + "/matchups/" + (w + 1)).catch(() => [])));
      const uById = {}; (users || []).forEach(u => uById[u.user_id] = u);
      const owner = {}; (rosters || []).forEach(r => owner[r.roster_id] = r.owner_id || ("r" + r.roster_id));
      const tm = rid => { const u = uById[owner[rid]] || {}; return {id: "o:" + owner[rid], name: (u.metadata && u.metadata.team_name) || u.display_name || "Team " + rid, logo: u.avatar ? "https://sleepercdn.com/avatars/thumbs/" + u.avatar : ""}; };
      const finalM = (bracket || []).find(m => m.p === 1), champRid = finalM ? finalM.w : null;
      const games = [];
      weeks.forEach((ms, i) => {
        const wk = i + 1, g = {}; (ms || []).forEach(m => { if (m.matchup_id) (g[m.matchup_id] = g[m.matchup_id] || []).push(m); });
        Object.values(g).forEach(p => { if (p.length !== 2 || (!p[0].points && !p[1].points)) return; const isPo = wk >= po;
          // Playoff weeks: only count games in the winners bracket.
          if (isPo && !(bracket || []).some(m => [m.t1, m.t2].includes(p[0].roster_id) && [m.t1, m.t2].includes(p[1].roster_id))) return;
          games.push({wk, a: tm(p[0].roster_id), h: tm(p[1].roster_id), as: p[0].points, hs: p[1].points, po: isPo, ch: isPo && finalM && [finalM.t1, finalM.t2].includes(p[0].roster_id) && [finalM.t1, finalM.t2].includes(p[1].roster_id) && wk === Math.max(...weeks.map((x, j) => (x || []).some(m => m.points) ? j + 1 : 0)), cons: false}); });
      });
      if (games.length || i === 0) out.push({season: Number(lg.season), teams: (rosters || []).map(r => tm(r.roster_id)), games, champ: champRid ? tm(champRid).id : null, live: lg.status !== "complete"});

}
function histCrunch(L, seasons){

  if (L.meta.platform === "flea") L.detail.teams.forEach(t => { name[t.id] = t.name; if (t.logo) logo[t.id] = t.logo; });
  const T = id => (T[id] = T[id] || {id, w: 0, l: 0, t: 0, pf: 0, pa: 0, g: 0, pw: 0, pl: 0, titles: [], finals: 0, seasons: new Set()});
  const H = {}, h2 = (a, b) => ((H[a] = H[a] || {})[b] = H[a][b] || {w: 0, l: 0, t: 0, pf: 0, pa: 0, g: 0, po: 0, last: null});
  const recs = [], champs = [];
  seasons.forEach(s => {
    let champ = s.champ || null;
    s.games.forEach(g => {
      if (g.cons || g.as == null || g.hs == null) return;
      const A = T(g.a.id), B = T(g.h.id); A.seasons.add(s.season); B.seasons.add(s.season);
      const res = g.as > g.hs ? 1 : g.as < g.hs ? -1 : 0;
      if (g.po) { if (res > 0) { A.pw++; B.pl++; } else if (res < 0) { B.pw++; A.pl++; } if (g.ch) { A.finals++; B.finals++; if (!s.champ && res) champ = res > 0 ? g.a.id : g.h.id; } }
      else { A.g++; B.g++; A.pf += g.as; A.pa += g.hs; B.pf += g.hs; B.pa += g.as; if (res > 0) { A.w++; B.l++; } else if (res < 0) { B.w++; A.l++; } else { A.t++; B.t++; } }
      [[g.a.id, g.h.id, g.as, g.hs], [g.h.id, g.a.id, g.hs, g.as]].forEach(([x, y, px, py]) => { const r = h2(x, y); r.g++; r.pf += px; r.pa += py; if (px > py) r.w++; else if (px < py) r.l++; else r.t++; if (g.po) r.po++; if (!r.last || s.season > r.last.season || (s.season === r.last.season && g.wk > r.last.wk)) r.last = {season: s.season, wk: g.wk, pf: px, pa: py, po: g.po}; });

    });

  return {teams, H, recs, champs, name, logo};
}

async function ltLoad(L, S, until){
  if (S.loading) return; S.loading = true;
  try {
    if (L.meta.platform === "sleeper") return await ltLoadSleeper(L, S, until);
    while (S.next != null) {
      const offs = []; for (let i = 0; i < 6 && S.next != null && (S.total == null || S.next + i * 10 < S.total); i++) offs.push(S.next + i * 10);
      if (!offs.length) { S.next = null; break; }
      const pages = await Promise.all(offs.map(o => ltFleaPage(L, S, o).catch(() => null)));
      let stop = false;
      for (const pg of pages) {
        if (!pg) { stop = true; break; }
        const seen = new Set(S.trades.map(t => t.id));
        pg.trades.forEach(t => { if (!seen.has(t.id)) S.trades.push(t); });
        if (!pg.trades.length || pg.next == null) { S.next = null; S.total = S.trades.length; stop = true; break; }
        S.next = pg.next;
      }
      if (S.onProgress) S.onProgress();
      if (stop) { if (S.next != null && pages.some(p => !p)) S.err = "Fleaflicker stopped answering partway through. Try again in a minute."; break; }
      const oldest = Math.min(...S.trades.map(t => t.t || Infinity));
      if (until !== "all" && oldest && new Date(oldest).getFullYear() < until) break;
    }
  } finally { S.loading = false; }
}
async function ltLoadSleeper(L, S, until){

  S.sl = S.sl || {lid: L.meta.id, done: []};
  for (let guard = 0; guard < 8 && S.sl.lid; guard++) {
    const lg = await api("/api/sleeper/league/" + S.sl.lid).catch(() => null);
    if (!lg) { S.sl.lid = null; break; }
    const season = Number(lg.season) || 0;
    if (S.sl.done.includes(S.sl.lid)) { S.sl.lid = lg.previous_league_id && lg.previous_league_id !== "0" ? lg.previous_league_id : null; continue; }
    const weeks = await Promise.all(Array.from({length: 19}, (_, w) => api("/api/sleeper/league/" + S.sl.lid + "/transactions/" + w).catch(() => [])));
    const rosters = await api("/api/sleeper/league/" + S.sl.lid + "/rosters").catch(() => []), users = await api("/api/sleeper/league/" + S.sl.lid + "/users").catch(() => []);
    const uById = {}; (users || []).forEach(u => uById[u.user_id] = u);
    const tname = rid => { const ro = (rosters || []).find(r => r.roster_id === rid) || {}, u = uById[ro.owner_id] || {}; const cur = L.detail.teams.find(t => t.id === String(rid)); return {name: (u.metadata && u.metadata.team_name) || u.display_name || (cur && cur.name) || "Team " + rid, logo: u.avatar ? "https://sleepercdn.com/avatars/thumbs/" + u.avatar : (cur && cur.logo) || ""}; };
    weeks.flat().filter(x => x && x.type === "trade" && x.status === "complete").forEach(x => {
      if (S.trades.some(t => t.id === String(x.transaction_id))) return;
      S.trades.push({id: String(x.transaction_id), t: Number(x.status_updated || x.created || 0), sides: (x.roster_ids || []).map(rid => Object.assign({id: String(rid)}, tname(rid), {
        players: Object.entries(x.adds || {}).filter(([, r]) => r === rid).map(([pid]) => { const p = players[pid] || [pid, "", ""]; return {id: pid, name: p[0], pos: p[1], team: p[2]}; }),
        picks: (x.draft_picks || []).filter(pk => pk.owner_id === rid).map(pk => ({season: Number(pk.season), round: pk.round, slot: 0, overall: 0, from: tname(pk.roster_id).name}))
      }))});
    });
    S.sl.done.push(S.sl.lid);
    S.sl.lid = lg.previous_league_id && lg.previous_league_id !== "0" ? lg.previous_league_id : null;
    S.total = S.sl.lid ? null : S.trades.length;
    if (S.onProgress) S.onProgress();
    if (until !== "all" && season <= until) break;
  }
  if (!S.sl.lid) S.next = null;
  S.loading = false;
}

// What a traded pick is worth today: the player it became, or the market price of that pick.
async function ltBoards(L, S, seasons){
  if (L.meta.platform !== "flea") return;
  const need = [...new Set(seasons)].filter(y => y && y <= new Date().getFullYear() && !(y in S.boards));
  await Promise.all(need.map(async y => {
    try { const b = await draftBoard(L, y); const m = {byTeam: {}}; b.forEach(s => { if (!s.player) return; const x = Object.assign({}, s.player, {round: s.round, slot: s.slot}); m[s.overall] = x; const k = s.team.id + ":" + s.round; (m.byTeam[k] = m.byTeam[k] || []).push(x); }); S.boards[y] = m; }
    catch(e){ S.boards[y] = {}; }
  }));
}
function ltValuer(L, S, V, flea, prem, nTeams){
  const pv = p => { const k = L.meta.platform === "sleeper" ? String(p.id) : flea ? "f" + p.id : sleeperKey(L, p); return ((V[k] || [0])[0] || 0) * (p.pos === "QB" ? prem : 1); };
  const pickSeasons = Object.keys(V).filter(k => /^pick:\d{4} 1st$/.test(k)).map(k => Number(k.slice(5, 9))).sort();
  const pk = (x, owner) => {
    const bd = S.boards[x.season];
    // Older picks often have no slot; if the team that got it made exactly one pick in that round, that's the player.
    const byTeam = !x.overall && bd && owner && bd.byTeam && bd.byTeam[owner + ":" + x.round];
    const drafted = (x.overall && bd && bd[x.overall]) || (byTeam && byTeam.length === 1 ? byTeam[0] : null);
    if (drafted && !x.overall) return {v: pv(drafted), label: x.season + " " + drafted.round + "." + String(drafted.slot).padStart(2, "0") + " → " + drafted.name, drafted};
    if (drafted) { const v = pv(drafted); return {v, label: x.season + " " + x.round + "." + String(x.slot).padStart(2, "0") + " → " + drafted.name, drafted}; }
    const yr = pickSeasons.length ? Math.min(Math.max(x.season, pickSeasons[0]), pickSeasons[pickSeasons.length - 1]) : x.season;
    const rd = Math.min(4, x.round || 4), tier = x.slot && nTeams ? (x.slot <= nTeams / 3 ? " (Early)" : x.slot <= nTeams * 2 / 3 ? " (Mid)" : " (Late)") : "";
    let v = ((V["pick:" + yr + " " + ORD[rd] + tier] || V["pick:" + yr + " " + ORD[rd]] || [0])[0]) || 0;
    if ((x.round || 0) > 4) v *= Math.pow(0.6, x.round - 4);
    return {v, label: x.season + " " + (x.slot ? x.round + "." + String(x.slot).padStart(2, "0") : ORDN(x.round) + " round") + (x.from ? " (" + x.from + ")" : "")};
  };

}
const trEff = vals => vals.slice().sort((a, b) => b - a).reduce((s, v, i) => s + v * Math.max(0.4, 1 - 0.15 * i), 0);
function ltGrade(t, val){
  const sides = t.sides.map(s => {
    const items = s.players.map(p => ({name: p.name, pos: p.pos, team: p.team, v: val.pv(p), p})).concat(s.picks.map(x => { const r = val.pk(x, s.id); return {name: r.label, pos: "PICK", v: r.v}; })).sort((a, b) => b.v - a.v);
    return {s, items, raw: items.reduce((a, b) => a + b.v, 0), eff: trEff(items.map(i => i.v))};
  });
  const n = sides.length;
  sides.forEach(sd => {
    const given = n === 2 ? sides.find(x => x !== sd) : null;
    const gEff = given ? given.eff : sides.filter(x => x !== sd).reduce((a, b) => a + b.eff, 0) / Math.max(1, n - 1);
    sd.gaveRaw = given ? given.raw : sides.filter(x => x !== sd).reduce((a, b) => a + b.raw, 0) / Math.max(1, n - 1);
    // Small trades can't be a fleecing: shrink the gap when little value changed hands.
    const m = Math.max(0.25, Math.min(1, Math.max(sd.eff, gEff) / 3000));
    sd.ratio = Math.exp(Math.log((sd.eff + 300) / (gEff + 300)) * m);
    sd.letter = trLetter(sd.ratio); sd.net = sd.raw - sd.gaveRaw;
  });
  if (sides.every(sd => sd.raw < 250)) { sides.forEach(sd => sd.letter = "–"); return {t, sides, verdict: "Both sides have faded", gap: 1, top: null, tone: "", faded: true}; }

  const top = sides.flatMap(sd => sd.items.map(i => Object.assign({side: sd}, i))).sort((a, b) => b.v - a.v)[0];
  const swing = Math.max(0, best.net);
  const lvl = gap < 1.06 ? 0 : gap < 1.3 || swing < 1200 ? 1 : gap < 1.6 || swing < 2500 ? 2 : 3;
  const verdict = [ "Fair trade", best.s.name + " wins", best.s.name + " won big", "Fleeced: " + best.s.name + " robbed " + (n === 2 ? sides.find(x => x !== best).s.name : "the others")][lvl];
  return {t, sides, verdict, gap, swing, top, tone: ["", "", "mid", "bad"][lvl]};
}

/* paste a trade email to grade it */
function parseTradeText(text, d, me){
  const lines = String(text || "").split(/\n/).map(x => x.replace(/^[\s*•\-]+/, "").trim()).filter(x => / gets:/.test(x));
  const sides = lines.map(x => { const i = x.indexOf(" gets:"); return {team: x.slice(0, i).trim(), items: x.slice(i + 6).split(/[;,]\s*/).map(s => s.trim()).filter(Boolean)}; });
  const nm = s => norm(String(s).replace(/[’]/g, "'"));
  const findTeam = name => d.teams.find(t => nm(t.name) === nm(name)) || d.teams.find(t => nm(t.name).startsWith(nm(name).slice(0, 8)));
  const res = sides.map(s => ({s, t: findTeam(s.team)}));
  if (res.length !== 2) return {error: res.length > 2 ? "Only two-team trades can be graded." : "Paste the lines that say “Team gets: …” from the trade email."};
  if (res.some(r => !r.t)) return {error: "Couldn’t match a team name: " + res.filter(r => !r.t).map(r => r.s.team).join(", ")};
  const mine = res.find(r => r.t === me); if (!mine) return {error: "This trade doesn’t include your team."};
  const other = res.find(r => r !== mine);
  return {other: other.t, myGets: mine.s.items, theyGet: other.s.items};
}
function matchItems(items, roster, picks){
  const ids = [], miss = [];
  items.forEach(it => {
    const pk = it.match(/^(\d{4})\s+(\d)(?:st|nd|rd|th)\s+round/i);
    if (pk) {
      const orig = (it.match(/\(([^)]+)\)/) || [])[1];
      const cands = picks.filter(p => p.id.split(":")[1] === pk[1] && String(p.round) === pk[2]);
      const hit = (orig && cands.find(p => norm(p.name).includes(norm(orig.replace(/\.\.$/, ""))))) || cands[0];
      if (hit) ids.push(hit.id); else miss.push(it);
      return;
    }
    const m = it.replace(/\s+(jr|sr|ii|iii|iv)\.?$/i, "").match(/^([A-Za-z])\.?\s+(.+)$/);
    const last = m ? norm(m[2]) : norm(it), first = m ? m[1].toLowerCase() : null;
    const hit = roster.find(p => { const parts = String(p.name).replace(/\s+(Jr\.?|Sr\.?|II|III|IV)$/i, "").split(" "); return norm(parts.slice(1).join(" ")) === last && (!first || parts[0].toLowerCase().startsWith(first)); }) || roster.find(p => norm(p.name) === norm(it));
    if (hit) ids.push(hit.id); else miss.push(it);
  });
  return {ids, miss};
}

    const top = t.roster.map(p => ({p, v: VV.val(p), a: (VV.row(p) || [])[6]})).sort((a, b) => b.v - a.v).slice(0, 12);

/* ===================== 3. Breakout detector ===================== */
async function openBreakouts(){
  const body = openSheetShell("Breakouts");
  try {
    const st = await getState(); await getPlayers(); ensureSidIndex();
    const wk = st.display_week || st.week, season = st.league_season || st.season;
    const r = await api("/api/roles?season=" + season + "&week=" + wk);
    const rows = [];
    for (const id in r.players || {}) {
      const x = r.players[id], pl = players[id]; if (!pl || !["QB", "RB", "WR", "TE"].includes(pl[1])) continue;
      const [snap, snapP, tgt, tgtP, car, carP] = x;
      if (snapP == null) continue;
      const ds = snap - snapP, dt = tgt - (tgtP || 0), dc = car - (carP || 0);
      const score = Math.max(0, ds) + 2.2 * Math.max(0, dt) + 1.3 * Math.max(0, dc);
      if (!((ds >= 15 && snap >= 45) || (dt >= 4 && tgt >= 6) || (dc >= 6 && car >= 10))) continue;
      rows.push({id, name: pl[0], pos: pl[1], team: pl[2], inj: pl[3], snap, snapP, tgt, tgtP, car, carP, score});
    }
    rows.sort((a, b) => b.score - a.score);
    // Where each one is in your leagues.
    const tags = row => {
      const out = [];
      leagues.forEach(L => {
        const d = L.detail; if (!d) return; const me = d.teams.find(t => t.mine); if (!me) return;
        const hit = t => t.roster.find(p => L.meta.platform === "sleeper" ? String(p.id) === row.id : norm(p.name) === norm(row.name) && (p.pos === row.pos || !p.pos));
        const owner = d.teams.find(hit);
        if (!owner) out.push({k: 0, t: "Free agent in " + L.meta.name, L});
        else if (owner === me) { const p = hit(me); out.push({k: p.slot === "start" ? 3 : 1, t: (p.slot === "start" ? "Starting for you" : "On your bench") + " in " + L.meta.name, L}); }
        else out.push({k: 2, t: "Owned by " + owner.name + (leagues.length > 1 ? " (" + L.meta.name + ")" : ""), L});
      });
      return out.sort((a, b) => a.k - b.k);
    };
    rows.forEach(x => { x.where = tags(x); x.pri = x.where.length ? x.where[0].k : 9; });
    rows.sort((a, b) => (a.pri === 0 ? 0 : a.pri === 1 ? 1 : 2) - (b.pri === 0 ? 0 : b.pri === 1 ? 1 : 2) || b.score - a.score);
    const lines = x => [x.snap - x.snapP >= 10 ? "Snaps " + x.snapP + "% → " + x.snap + "%" : "", x.tgt - (x.tgtP || 0) >= 3 ? "Targets " + (x.tgtP || 0) + " → " + x.tgt : "", x.car - (x.carP || 0) >= 4 ? "Carries " + (x.carP || 0) + " → " + x.car : ""].filter(Boolean).join(" · ");
    body.innerHTML = '<p class="muted" style="margin:-6px 2px 12px">Players whose role jumped in week ' + r.week + " compared with the weeks before. Free agents in your leagues come first.</p>" +
      (rows.length ? '<div class="card brk">' + rows.slice(0, 30).map(x => '<div class="brow">' + posTag(x) + '<div class="sn"><b>' + esc(x.name) + "</b> <small style='display:inline'>" + esc(x.team || "FA") + (x.inj ? " · " + esc(x.inj) : "") + '</small><span class="bl">' + esc(lines(x)) + "</span>" +
        x.where.slice(0, 2).map(w => '<span class="bw k' + w.k + '">' + esc(w.t) + "</span>").join("") + "</div>" +
        (x.pri === 0 ? '<a class="btn sm" href="' + esc(waiverUrl(x.where[0].L)) + '" target="_blank" rel="noopener">Add</a>' : "") + "</div>").join("") + "</div>" : '<div class="card"><p style="margin:0">No big role changes yet this week. Check back after the games.</p></div>') +
      '<p class="small muted" style="margin:10px 4px 0">Snap share, targets and carries from Sleeper’s weekly stats: last week against the average of the two before it.</p>';
  } catch(e){ body.innerHTML = '<div class="err">Couldn’t load roles: ' + esc(e.message) + "</div>"; }
}

/* ===================== 4. Title window planner ===================== */
function ageCurveC(pos, age){ if (!age) return 1; const peak = {QB: 30, RB: 25, WR: 27, TE: 28}[pos] || 27, drop = {QB: 0.04, RB: 0.12, WR: 0.07, TE: 0.07}[pos] || 0.07; return age <= peak ? 1 + Math.min(0.15, (peak - age) * 0.03) : Math.max(0.3, 1 - (age - peak) * drop); }
async function openWindow(L){
  const body = openSheetShell("Title window");
  try {
    const d = L.detail, VV = await leagueVals(L), slots = leagueSlots(L), me = d.teams.find(t => t.mine), N = d.teams.length;
    const yr = Number(d.season) || new Date().getFullYear();
    const vAt = (p, y) => { const r = VV.row(p); if (!r) return 0; const prem = p.pos === "QB" ? VV.prem : 1; if (y === 0) return (r[7] || r[0]) * prem; const a = r[6]; return r[0] * prem * ageCurveC(p.pos, a ? a + y : null) / ageCurveC(p.pos, a); };
    const strength = d.teams.map(t => [0, 1, 2].map(y => { const ro = y > 0 ? t.roster.map(p => Object.assign({}, p, {inj: null})) : t.roster; const lu = bestLineup(ro, slots, p => vAt(p, y)); return lu.total + 0.15 * (t.roster.reduce((s, p) => s + vAt(p, y), 0) - lu.total); }));
    const rank = (i, y) => 1 + strength.filter(s => s[y] > strength[i][y]).length;
    const mi = d.teams.indexOf(me), R = [0, 1, 2].map(y => rank(mi, y));
    const best = [0, 1, 2].map(y => Math.max(...strength.map(s => s[y])));
    let verdict, tone;
    if (R[0] <= Math.ceil(N / 4)) { verdict = "Your window is open now. Push: trade future picks and young bench players for starters."; tone = "good"; }
    else if (R[2] <= Math.ceil(N / 4) || R[2] < R[0] - 3) { verdict = "Your window opens in " + (yr + (R[1] < R[0] - 2 ? 1 : 2)) + ". Build: sell veterans who won’t be good then, buy young players and picks."; tone = "mid"; }
    else if (R[0] > N * 2 / 3 && R[2] > N * 2 / 3) { verdict = "You’re not close now or later. Rebuild: turn every veteran into picks and players 24 or younger."; tone = "bad"; }
    else { verdict = "You’re in the middle now and later. Pick a direction: one or two moves at your weakest position could make you a contender, or sell veterans to build."; tone = "mid"; }
    const decl = me.roster.map(p => ({p, now: vAt(p, 1) ? VV.val(p) : 0, later: vAt(p, 2)})).filter(x => x.now >= 800).map(x => Object.assign(x, {drop: 1 - x.later / Math.max(1, x.now)})).filter(x => x.drop >= 0.18).sort((a, b) => b.now * b.drop - a.now * a.drop).slice(0, 4);
    const rise = me.roster.map(p => ({p, now: VV.val(p), later: vAt(p, 2)})).filter(x => x.now >= 500 && x.later > x.now * 1.08).sort((a, b) => (b.later - b.now) - (a.later - a.now)).slice(0, 4);
    const bar = (y, lab) => '<div class="wbar"><span class="wl">' + lab + '</span><div class="wtrack"><span style="width:' + Math.round(strength[mi][y] / best[y] * 100) + '%"></span></div><b>#' + R[y] + "</b></div>";
    const top = y => d.teams.map((t, i) => ({t, s: strength[i][y]})).sort((a, b) => b.s - a.s).slice(0, 5);
    body.innerHTML = '<div class="card grade ' + tone + '"><b class="glabel">' + esc(verdict) + "</b>" +
      '<div class="wbars">' + bar(0, String(yr)) + bar(1, String(yr + 1)) + bar(2, String(yr + 2)) + "</div>" +
      '<p class="small muted" style="margin:8px 0 0">Bars compare your projected lineup strength with the league’s best that season; the number is your rank of ' + N + ".</p></div>" +
      (decl.length ? "<h3>Sell before they drop</h3><div class=\"card\">" + decl.map(x => '<div class="mrow" style="grid-template-columns:auto minmax(0,1fr) auto">' + posTag(x.p) + '<span class="sn">' + esc(x.p.name) + "<small>" + ((VV.row(x.p) || [])[6] ? "age " + (VV.row(x.p) || [])[6] + " · " : "") + "about " + Math.round(x.drop * 100) + "% less valuable by " + (yr + 2) + '</small></span><span class="tv">' + fmtV(x.now) + "</span></div>").join("") + "</div>" : "") +
      (rise.length ? "<h3>Your risers</h3><div class=\"card\">" + rise.map(x => '<div class="mrow" style="grid-template-columns:auto minmax(0,1fr) auto">' + posTag(x.p) + '<span class="sn">' + esc(x.p.name) + "<small>Projected to gain value as he enters his prime</small></span><span class=\"tv\">" + fmtV(x.now) + "</span></div>").join("") + "</div>" : "") +
      "<h3>Strongest teams by season</h3>" + [0, 1, 2].map(y => '<div class="card" style="margin-bottom:8px"><b>' + (yr + y) + "</b>" + top(y).map((x, k) => '<div class="seedrow' + (x.t.mine ? " me" : "") + '"><span class="seed">' + (k + 1) + "</span>" + teamLogo(x.t) + '<span class="sn">' + esc(x.t.name) + "</span><span></span></div>").join("") + "</div>").join("") +
      '<p class="small muted" style="margin:10px 4px 0">This season uses current-season values; later seasons age each player along his position’s typical curve (running backs fall fastest after 25). Picks and future rookies aren’t counted.</p>';
  } catch(e){ body.innerHTML = '<div class="err">Couldn’t project the window: ' + esc(e.message) + "</div>"; }

/* ===================== 7. Season Wrapped ===================== */
async function seasonWeeks(L){
  const d = L.detail, st = await getState(), last = Math.max(0, (d.week || st.week || 1) - (anyLive() ? 1 : 0));
  const weeks = [];
  for (let w = 1; w <= Math.min(17, last); w++) {
    try {
      if (L.meta.platform === "flea") {
        const r = await api(fq("FetchLeagueScoreboard", {league_id: L.meta.id, scoring_period: w}));
        const games = (r.games || []).map(g => ({a: String((g.away || {}).id), b: String((g.home || {}).id), as: val((g.awayScore || {}).score) || 0, bs: val((g.homeScore || {}).score) || 0, done: !!g.isFinalScore || w < last})).filter(g => g.as || g.bs);
        if (games.length) weeks.push({w, games});
      } else if (L.meta.platform === "sleeper") {
        const r = await api("/api/sleeper/league/" + L.meta.id + "/matchups/" + w); const by = {};
        (r || []).forEach(m => { if (m.matchup_id) (by[m.matchup_id] = by[m.matchup_id] || []).push(m); });
        const games = Object.values(by).filter(x => x.length === 2).map(([x, y]) => ({a: String(x.roster_id), b: String(y.roster_id), as: x.points || 0, bs: y.points || 0, done: w < (st.week || d.week || 99)})).filter(g => g.as || g.bs);
        if (games.length) weeks.push({w, games});
      }
    } catch(e){}
  }
  return weeks;
}

const SYNC_KEYS = () => Object.keys(localStorage).filter(k => k === KEY || (k.startsWith(KEY + ".") && !/\.(sync|syncAt|syncHash|hookId)$/.test(k)));

  const k = syncKey();
  if (k) { try { const r = await fetch("/api/sync?k=" + k + "&meta=1"); const j = await r.json(); if (j.at && j.at > Number(localStorage.getItem(KEY + ".syncAt") || 0) + 5000) { await syncPull(k); location.reload(); return true; } } catch(e){} }

  [/calf/i, "Calf strain", [7, 28], 0.92], [/concussion|head/i, "Concussion", [7, 14], 0.97], [/ankle/i, "Ankle injury", [7, 28], 0.92], [/knee/i, "Knee injury", [7, 35], 0.9],
  [/shoulder|ac joint|collarbone|clavicle/i, "Shoulder injury", [7, 42], 0.92], [/foot/i, "Foot injury", [14, 56], 0.88], [/toe/i, "Toe injury", [7, 28], 0.9],
  [/thumb|hand|finger|wrist/i, "Hand/wrist injury", [7, 28], 0.95], [/rib|chest/i, "Rib injury", [7, 28], 0.93], [/back|neck/i, "Back injury", [7, 28], 0.92],
  [/quad|thigh/i, "Quad strain", [7, 21], 0.92], [/hip/i, "Hip injury", [7, 28], 0.92], [/elbow|forearm|arm|bicep|tricep/i, "Arm injury", [7, 35], 0.95], [/illness|personal/i, "Illness/personal", [0, 7], 1]];
function injuryOutlook(p){
  const n = injFor(p); const status = String((n && n.status) || p.inj || ""); if (!status || /^active$/i.test(status)) return null;
  const txt = [status, n && n.part, n && n.long, n && n.short, p.injPart].filter(Boolean).join(" ");
  const rule = INJ_RULES.find(r => r[0].test(txt)) || [null, "Injury", [7, 21], 0.94];
  const since = n && n.date ? new Date(n.date) : new Date(), daysIn = Math.max(0, (Date.now() - since) / 864e5);
  let lo = rule[2][0] - daysIn, hi = rule[2][1] - daysIn;
  if (n && n.ret) { const r = (new Date(n.ret) - Date.now()) / 864e5; if (!isNaN(r)) { lo = Math.max(0, r - 3); hi = r + 7; } }
  if (/questionable/i.test(status)) { lo = 0; hi = Math.min(hi, 7); }
  if (/doubtful/i.test(status)) { lo = Math.max(lo, 4); hi = Math.max(hi, 10); }
  lo = Math.max(0, lo); hi = Math.max(lo, hi);
  const season = /season/i.test(txt) || hi > 120;
  const wk = days => Math.round(days / 7);
  let level = rule[3]; if (p.pos === "QB" && /hand|thumb|wrist/i.test(txt)) level = Math.min(level, 0.88); if (p.pos === "RB" && /achilles|acl/i.test(txt)) level -= 0.05;
  const backText = season ? "Likely out for the season" : lo < 4 && hi <= 7 ? "Could play this week" : "Back in about " + (wk(lo) === wk(hi) ? wk(hi) : Math.max(1, wk(lo)) + "–" + Math.max(1, wk(hi))) + " week" + (wk(hi) > 1 ? "s" : "");
  const advice = season ? "Dynasty: hold and use an IR spot if you have one; his long-term value barely moves. Redraft: he can be cut or traded to a contender’s IR." : hi <= 10 ? "Hold. Short absence; don’t sell low." : hi <= 42 ? "Stash him on IR if you can. If you’re contending and need points now, he’s a fair trade chip to a team out of the race." : "Long absence: stash on IR in dynasty; in redraft, he’s worth more to someone else.";

}

// Player news repeats itself: a fresh blurb for every practice report, and the same story told twice.
// Group it: practice and injury-status notes from the same week become one (the latest), and stories whose
// words mostly overlap within a few days become one. Each group shows its newest item, older ones folded.
const NEWS_STOP = new Set("the a an and or of to in on for at with is was be has had have his her he it as by from that this will after this week sunday monday thursday saturday friday tuesday wednesday game games season fantasy nfl".split(" "));
function newsWords(n){ return new Set(String((n.title || "") + " " + (n.body || "")).toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w.length > 2 && !NEWS_STOP.has(w))); }
const isStatus = n => /\b(practice|practiced|limited|full participant|did not participate|dnp|questionable|doubtful|ruled out|injury report|listed as|status|game-time|estimated)\b/i.test((n.title || "") + " " + (n.body || ""));
const isGameLine = n => /^[A-Z][\w'.-]+ (rushed|completed|caught|carried|brought in|hauled in|recorded|secured|was held|finished with|totaled|had \d|threw for|ran for|played|reeled in|went \d)\b/.test(String(n.title || n.body || ""));
const isRoundup = n => /winners and losers|pickups|waiver wire|start\/sit|starts and sits|sleepers|rankings|odds,|props|betting|dfs|trade targets|buy low|sell high|overreactions|takeaways|biggest questions|week \d+ (preview|recap|lessons)/i.test(String(n.title || ""));
function groupNews(items){
  const list = items.filter(n => n.title || n.body).slice().sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));
  const groups = [];
  for (const n of list) {
    const t = Date.parse(n.date) || 0, w = newsWords(n), st = isStatus(n);
    // Weekly stat lines ("Robinson rushed 19 times…") and multi-player roundups read the same every week:
    // keep the newest of each in view and fold the rest underneath it.
    const kind = st ? "status" : isGameLine(n) ? "game" : isRoundup(n) ? "roundup" : "story";
    if (kind === "game" || kind === "roundup") { const g0 = groups.find(g => g.kind === kind); if (g0) { g0.rest.push(n); continue; } groups.push({top: n, rest: [], words: w, kind}); continue; }
    const g = groups.find(g => {
      if (g.kind === "game" || g.kind === "roundup") return false;
      const gt = Date.parse(g.top.date) || 0, days = Math.abs(gt - t) / 864e5;
      if (st && g.kind === "status" && days <= 7) return true;
      if (days > 4) return false;
      const gw = g.words; let inter = 0; w.forEach(x => { if (gw.has(x)) inter++; });
      return inter / Math.max(1, Math.min(w.size, gw.size)) >= 0.55;
    });
    if (g) g.rest.push(n); else groups.push({top: n, rest: [], words: w, kind});
  }
  return groups;
}

}

/* ---------- rest-of-season strength of schedule ---------- */
let allowedP = null;
async function allowedTable(season, upto){
  if (!allowedP) allowedP = (async () => {
    const weeks = []; for (let w = Math.max(1, upto - 8); w < upto; w++) weeks.push(w);
    const res = await Promise.all(weeks.map(w => api("/api/allowed?season=" + season + "&week=" + w).catch(() => null)));
    const sum = {}, n = {};
    res.forEach(r => { if (!r) return; for (const t in r.teams) for (const pos in r.teams[t]) { const k = t + "|" + pos; sum[k] = (sum[k] || [0, 0, 0]).map((x, i) => x + r.teams[t][pos][i]); n[k] = (n[k] || 0) + 1; } });
    const avg = {}; for (const k in sum) avg[k] = sum[k].map(x => x / n[k]);
    return avg;
  })();
  return allowedP;
}
/* ---------- Playoff path: the record you need, your swing games, who to root for ---------- */

  const left = myGames.filter(Boolean).length - done.length, start = (me.w || 0) + (me.t || 0) / 2 + dw;

}
function pathLines(pp, me){

  else if (pp.odds <= 0.001) out.push({tone: "bad", text: "Out of the race. None of " + pp.n.toLocaleString() + " simulated finishes gets you in."});

  }
  const open = x => !(x.live && (x.live.done || x.win < 0.02 || x.win > 0.98));

  if (now && pp.odds > 0.001 && pp.odds < 0.999) out.push({tone: "", text: (now.wk === pp.week ? "This week" : "Week " + now.wk) + " vs " + (now.opp ? now.opp.name : "your opponent") + ": a win takes you to " + pct(now.ifW) + ", a loss drops you to " + pct(now.ifL) + "."});

}

// How a player's production holds up with age, relative to now (1.0 = same).
function ageFactor(pos, age){
  if (!age) return 0.95;
  if (pos === "RB") return age <= 24 ? 1.05 : age <= 25 ? 1.0 : age <= 26 ? 0.95 : age <= 27 ? 0.88 : age <= 28 ? 0.78 : age <= 29 ? 0.68 : 0.55;
  if (pos === "WR") return age <= 23 ? 1.1 : age <= 25 ? 1.05 : age <= 28 ? 1.0 : age <= 29 ? 0.95 : age <= 30 ? 0.88 : age <= 31 ? 0.8 : 0.7;
  if (pos === "TE") return age <= 24 ? 1.1 : age <= 26 ? 1.05 : age <= 29 ? 1.0 : age <= 30 ? 0.93 : age <= 31 ? 0.85 : 0.75;
  if (pos === "QB") return age <= 24 ? 1.08 : age <= 32 ? 1.0 : age <= 34 ? 0.94 : age <= 36 ? 0.86 : age <= 38 ? 0.76 : 0.65;
  return 0.9;
}
async function keepersFor(L, me){
  if (L.meta.platform === "sleeper") return {max: L.detail.maxKeepers || null, kept: new Set((me.keepers || []).map(String))};
  if (L.meta.platform !== "flea") return {max: L.detail.maxKeepers || null, kept: new Set(me.roster.filter(p => p.keeper).map(p => String(p.id)))};
  try { const r = await api("/api/flea-keepers?league_id=" + L.meta.id + "&team_id=" + me.id); return {max: r.max, kept: new Set((r.kept || []).map(String))}; }
  catch(e){ return {max: null, kept: new Set()}; }
}
function keeperScores(L, roster, V, vkey, prem){
  return roster.map(p => {
    const r = V[vkey(p)] || [], age = r[6], dyn = (r[0] || 0), red = (r[7] || 0);
    const qb = p.pos === "QB" ? prem : 1;
    // Next-season basis: blend this-season and dynasty value; backups and injured players have no this-season value, so use dynasty.
    const basis = red > 0 ? 0.5 * red + 0.5 * dyn : dyn;
    const y1 = basis * ageFactor(p.pos, age ? age + 1 : null) * qb, y2 = basis * ageFactor(p.pos, age ? age + 2 : null) * qb;
    const score = p.pos === "K" || p.pos === "D/ST" || p.pos === "DEF" ? 0 : 0.5 * dyn * qb + 0.3 * y1 + 0.2 * y2;
    return {p, age, dyn: dyn * qb, red: red * qb, basis: basis * qb, y1, y2, score, trend: r[3] || 0};

}
function keeperWhy(x, rank, N){
  const p = x.p, a = x.age;
  if (p.pos === "K" || p.pos === "D/ST" || p.pos === "DEF") return "Kickers and defenses are easy to replace each year, so a keeper spot is better used on a player.";
  if (x.dyn < 300) return "Very little trade value (" + fmtV(x.dyn) + "). A rookie pick or free agent can fill this spot.";
  const bits = [];
  if (p.pos === "QB" && x.qbBoost) bits.push("QBs are scarce in your league, every starting QB is rostered");
  if (a) {
    if (p.pos === "RB" && a >= 27) bits.push("RB turning " + Math.ceil(a + 1) + " next year, when production usually drops");
    else if (a <= 24) bits.push("only " + a + ", with his best years ahead");
    else if ((p.pos === "WR" && a >= 30) || (p.pos === "QB" && a >= 35) || (p.pos === "TE" && a >= 31)) bits.push("age " + a + ", likely past his peak by next season");
  }
  if (x.trend >= 500) bits.push("value up " + fmtV(x.trend) + " in 30 days");
  else if (x.trend <= -500) bits.push("value down " + fmtV(-x.trend) + " in 30 days");
  if (x.y2 < x.basis * 0.8 && x.basis > 1000) bits.push("projected to lose about " + Math.round((1 - x.y2 / x.basis) * 100) + "% of his value over two seasons");
  if (!bits.length) bits.push(rank <= N ? "solid value for the next two seasons" : "low value for a keeper spot");

}

// The show only ever covers the most recent week where every game is final, and it gets the same checked
// box-score facts as Matchup recaps, with the headline facts worked out here so the writer can't get them wrong.
async function showFacts(L){

    const top = s => s.start.slice().sort((a, b) => b.pts - a.pts)[0], dud = s => s.start.filter(p => !["K", "D/ST", "DEF"].includes(p.pos)).sort((a, b) => a.pts - b.pts)[0];

    lines.push("- " + nm(g.win) + " " + n(g.win.act) + " def. " + nm(g.lose) + " " + n(g.lose.act) + " (won by " + n(g.margin) + ")." +
      (g.wTop ? " " + nm(g.win) + " top scorer: " + g.wTop.name + " " + n(g.wTop.pts) + "." : "") + (g.lTop ? " " + nm(g.lose) + " top scorer: " + g.lTop.name + " " + n(g.lTop.pts) + "." : "") +
      (g.lDud ? " " + nm(g.lose) + " worst starter: " + g.lDud.name + " " + n(g.lDud.pts) + "." : "") +
      (g.lose.opt != null ? " " + nm(g.lose) + " left " + n(Math.max(0, g.lose.opt - g.lose.act)) + " points on the bench" + (g.couldWin ? " and WOULD HAVE WON with its best lineup (" + n(g.lose.opt) + ")" : "") + "." : "") +
      (g.bl ? " " + nm(g.lose) + " started " + g.bl.start.name + " (" + n(g.bl.start.pts) + ") over " + g.bl.bench.name + " (" + n(g.bl.bench.pts) + ") on the bench." : ""));
  });
  const all = f.flatMap(g => [g.win, g.lose]), hi = all.slice().sort((a, b) => b.act - a.act)[0], lo = all.slice().sort((a, b) => a.act - b.act)[0];
  const close = f.slice().sort((a, b) => a.margin - b.margin)[0], blow = f.slice().sort((a, b) => b.margin - a.margin)[0];
  const bls = f.flatMap(g => [g.bl && {t: nm(g.lose), b: g.bl, lost: g.couldWin}, g.blW && {t: nm(g.win), b: g.blW, lost: false}]).filter(Boolean).sort((a, b) => (b.lost - a.lost) || (b.b.d - a.b.d));
  lines.push("", "HEADLINES (already worked out, use exactly):",
    "- Closest game: " + nm(close.win) + " " + n(close.win.act) + " to " + nm(close.lose) + " " + n(close.lose.act) + ", decided by " + n(close.margin) + ".",
    "- Biggest blowout: " + nm(blow.win) + " " + n(blow.win.act) + " to " + nm(blow.lose) + " " + n(blow.lose.act) + ", by " + n(blow.margin) + ".",
    "- Highest score of the week: " + nm(hi) + " with " + n(hi.act) + ".", "- Lowest score of the week: " + nm(lo) + " with " + n(lo.act) + ".");
  if (bls[0]) lines.push("- Blunder of the week: " + bls[0].t + " started " + bls[0].b.start.name + " (" + n(bls[0].b.start.pts) + ") while " + bls[0].b.bench.name + " scored " + n(bls[0].b.bench.pts) + " on the bench, a " + n(bls[0].b.d) + "-point swing" + (bls[0].lost ? ", and it cost them the game" : "") + ".");
  lines.push("", "STANDINGS NOW (wins-losses, points for):");
  d.teams.slice().sort((a, b) => b.w - a.w || (b.pf || 0) - (a.pf || 0)).forEach((t, i) => lines.push((i + 1) + ". " + t.name + " " + t.w + "-" + t.l + ", " + n(t.pf || 0) + " points for"));

}

async function openShow(L){
  const body = openSheetShell("The Snap Count Show");
  body.innerHTML = '<p class="spin">Checking the box scores…</p>';
  let F = null; try { F = await showFacts(L); } catch(e){}
  if (!F) { body.innerHTML = '<div class="card empty"><p class="muted" style="margin:0">The show covers the most recent week where every game is final. There isn’t one yet.</p></div>'; return; }
  const d = L.detail, w = F.w, q = "p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id) + "&w=" + w;
  const final = true;
  const NAMES = {DEZ: "Dez", SAM: "Sam"};
  let busy = false, msg = "", show = null, done = 0, sampleUrl = null, sampleBusy = false, sampleErr = "", epUrl = null, epBusy = false, pair = "a", chosen = null, sampleModel = "", eleven = false;
  const draw = () => {
    const PAIRS = [["a", "Upbeat"], ["b", "Gravelly"], ["c", "Deep"]];
    let h = '<div class="card" style="margin-bottom:12px"><b>Pick the hosts’ voices</b><p class="small muted" style="margin:4px 0 8px">Three voice pairs reading the same 20 seconds. Choose the one that sounds most real; every episode after uses it.</p>'
      + (eleven ? '<p class="small muted" style="margin:0">Voices by ElevenLabs (elevenlabs.io).</p>' : '<div class="seg">' + PAIRS.map(([k, l]) => '<button data-pair="' + k + '" aria-pressed="' + (pair === k) + '">' + l + (chosen === k ? " ✓" : "") + '</button>').join("") + '</div>')
      + '<div id="shSample" style="margin-top:8px">' + (sampleUrl ? '<audio controls autoplay style="width:100%" src="' + sampleUrl + '"></audio>' + (sampleModel ? '<p class="small muted" style="margin:4px 0 0">Voice model: ' + esc(sampleModel) + '</p>' : "") + (eleven ? "" : chosen !== pair ? '<button class="btn" id="shUse" style="margin-top:8px">Use ' + esc(PAIRS.find(x => x[0] === pair)[1]) + ' for the show</button>' : '<p class="small" style="margin:6px 0 0">✓ The show uses these voices.</p>') : '<button class="btn ghost" id="shSampleBtn">' + (sampleBusy ? "Recording the sample…" : "Play " + PAIRS.find(x => x[0] === pair)[1]) + '</button>') + '</div>' + (sampleErr ? '<p class="small" style="color:var(--bad);margin:6px 0 0">' + esc(sampleErr) + '</p>' : "") + '</div>';
    h += '<p class="small muted" style="margin:0 0 12px">A weekly podcast about ' + esc(L.meta.name) + ', made by AI from your league’s real results. Hosts Dez and Sam, week ' + w + '.</p>';
    if (!show) h += '<div class="card empty"><h3>Week ' + w + ' isn’t recorded yet</h3><p class="muted">' + "It covers week " + w + ", the latest week with every game final, using the same box scores as Matchup recaps." + '</p><button class="btn" id="shMake"' + (busy ? " disabled" : "") + '>' + (busy ? "Writing the script…" : "Make this week’s show") + '</button></div>';
    else {
      const ready = done >= show.total;
      if (ready) h += '<div class="card">' + (show.engine === "gemini" ? (epUrl ? '<audio controls style="width:100%" src="' + epUrl + '"></audio>' : '<p class="spin" style="margin:0">Loading the episode…</p>') : '<audio controls preload="metadata" style="width:100%" src="/api/show/mp3?' + q + '&t=' + show.at + '"></audio>') + (!show.final ? '<p class="small muted" style="margin:8px 0 0">Made while games were still being played.' + (final && !show.remade ? ' <button class="linkish" id="shRemake">Remake it with final scores</button>' : "") + "</p>" : "") + "</div>";
      else h += '<div class="card"><b>Recording…</b><div class="cbar" style="margin:10px 0 6px"><span style="width:' + Math.round(done / show.total * 100) + '%"></span></div><p class="small muted" style="margin:0">' + done + " of " + show.total + ' parts. Keep this open; it takes about a minute. If you leave, it picks up where it stopped next time anyone opens it.</p></div>';
      h += '<details class="card" style="margin-top:12px"><summary><b>Read the script</b></summary><div class="shscript">' + show.lines.map(l => '<p><b>' + NAMES[l.s] + ':</b> ' + (l.st ? '<i class="muted">(' + esc(l.st) + ')</i> ' : "") + esc(String(l.t).replace(/<[^>]{1,20}>/g, "").replace(/\|/g, "")) + "</p>").join("") + "</div></details>";
    }
    if (msg) h += '<p class="small" style="color:var(--bad);margin-top:10px">' + esc(msg) + "</p>";
    body.innerHTML = h;
    const sb = body.querySelector("#shSampleBtn"); if (sb) sb.addEventListener("click", playSample);
    body.querySelectorAll("[data-pair]").forEach(b => b.addEventListener("click", () => { pair = b.dataset.pair; sampleUrl = null; sampleErr = ""; playSample(); }));
    const su = body.querySelector("#shUse"); if (su) su.addEventListener("click", async () => { try { await post("/api/show/voice", {pair}); chosen = pair; } catch(e){ sampleErr = e.message; } draw(); });
    if (show && done >= show.total && show.engine === "gemini" && !epUrl && !epBusy) loadEpisode();
    const mk = body.querySelector("#shMake"); if (mk) mk.addEventListener("click", make);
    const rm = body.querySelector("#shRemake"); if (rm) rm.addEventListener("click", make);
  };
  async function playSample(){
    if (sampleBusy) return; sampleBusy = true; sampleErr = ""; draw();
    try {
      const r = await fetch("/api/show/sample?v=6&pair=" + pair);
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || "Couldn’t make the sample (" + r.status + ")"); }
      if (/json/.test(r.headers.get("content-type") || "")) { const j = await r.json(); chosen = j.chosen || chosen || "a"; sampleModel = j.x || ""; sampleUrl = await wavFromParts([j]); }
      else { eleven = r.headers.get("x-engine") === "eleven"; sampleUrl = URL.createObjectURL(await r.blob()); }
    } catch(e){ sampleErr = e.message; }
    sampleBusy = false; draw();
  }
  async function loadEpisode(){
    epBusy = true;
    try { const parts = []; for (let i = 0; i < show.total; i++) parts.push(await api("/api/show/part?" + q + "&i=" + i)); epUrl = await wavFromParts(parts); }
    catch(e){ msg = "Couldn’t load the episode: " + e.message; }
    epBusy = false; draw();
  }
  const record = async () => {
    for (let i = 0; i < show.total; i++) {
      if ($("#sheet").hidden) return;
      try { await post("/api/show/line?" + q, {dev: devId(), i}); done = Math.max(done, i + 1); draw(); }
      catch(e){ msg = e.message; draw(); return; }
    }
    done = show.total; draw();
  };
  async function make(){
    busy = true; msg = ""; draw();
    try {
      const r = await post("/api/show/script?" + q, {dev: devId(), ctx: F.ctx, final, league: L.meta.name});
      show = r.show; done = 0; busy = false; draw(); record();
    } catch(e){ busy = false; msg = e.message; draw(); }
  }
  body.innerHTML = '<p class="spin">Checking for this week’s episode…</p>';
  try { const r = await api("/api/show?" + q); show = r.show; done = show ? show.done : 0; } catch(e){ msg = e.message; }
  draw();
  if (show && done < show.total) record();
}

/* ---------- league chat, bridged to the league's GroupMe ---------- */
let chat = null;
function closeChat(){ if (!chat) return; chat.dead = true; clearInterval(chat.poll); clearInterval(chat.ping); try { chat.ws && chat.ws.close(); } catch(e){} chat = null; }
function chatName(L){ let n = ""; try { n = localStorage.getItem(KEY + ".chatName") || ""; } catch(e){} const me = L.detail.teams.find(t => t.mine); return n || (me ? me.name : "Snap Count user"); }
const gmState = {};
async function gmConnected(L){ const k = L.meta.platform + ":" + L.meta.id; if (gmState[k] == null) { try { gmState[k] = !!(await api("/api/chat?p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id) + "&dev=" + devId())).connected; } catch(e){ gmState[k] = false; } } return gmState[k]; }
async function gmPostBtn(after, L, textFn){
  if (!after || !(await gmConnected(L))) return;
  const b = document.createElement("button"); b.type = "button"; b.className = after.className || "btn ghost"; b.textContent = "Post to GroupMe";
  after.after(b);
  b.addEventListener("click", async () => { b.disabled = true; b.textContent = "Posting…"; try { await post("/api/chat/share?p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id), {dev: devId(), text: textFn()}); b.textContent = "Posted to GroupMe"; } catch(e){ b.disabled = false; b.textContent = "Post to GroupMe"; alertMsg(after, e.message); } });
}
function alertMsg(near, m){ const p = document.createElement("p"); p.className = "small"; p.style.color = "var(--bad)"; p.textContent = m; near.parentNode.appendChild(p); }
function chatTime(t){ const d = new Date(t), now = new Date(); return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}) : d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"}) + " " + d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); }
function chatMsgHTML(m, mine){
  let name = m.name, text = m.text || "", via = "";
  if (m.bot) { const x = text.match(/^([^:\n]{1,40}): ([\s\S]*)$/); if (x && !/^(📣|🏈|📰|🔥)/.test(text)) { name = x[1]; text = x[2]; via = " · via Snap Count"; } else via = ""; }
  const me = mine(name);
  const linked = esc(text).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g, "<br>");
  if (m.sys) return '<div class="cmsys">' + linked + "</div>";
  return '<div class="cmsg' + (me ? " me" : "") + (m.bot && !via ? " botmsg" : "") + '">' + (me ? "" : (m.av ? '<img class="cav" src="' + esc(m.av) + '.avatar" alt="" loading="lazy">' : '<span class="cav">' + esc((name || "?").slice(0, 1)) + "</span>")) + '<div class="cbody"><div class="cmeta">' + (me ? "" : "<b>" + esc(name) + "</b> ") + '<span>' + esc(chatTime(m.at)) + esc(via) + '</span></div>' + (text ? '<div class="ctext">' + linked + "</div>" : "") + (m.img ? '<a href="' + esc(m.img) + '" target="_blank" rel="noopener"><img class="cimg" src="' + esc(m.img) + '.600x600" alt="Photo" loading="lazy"></a>' : "") + "</div></div>";
}
// The chat button (top right) opens one league's chat; with several leagues there's a picker on top.
function chatLeagues(){ return leagues.filter(L => L.detail && L.detail.teams.some(t => t.mine)); }
async function renderChatTab(v){
  const list = chatLeagues();
  if (!list.length) { v.innerHTML = '<h2>Chat</h2><div class="card empty"><p class="muted">Add your league first, then your league’s GroupMe can show up here.</p></div>'; return; }
  let pick = null; try { pick = localStorage.getItem(KEY + ".chatL"); } catch(e){}
  if (!list.some(L => L.meta.platform + ":" + L.meta.id === pick)) { await Promise.all(list.map(gmConnected)); const on = list.find(L => gmState[L.meta.platform + ":" + L.meta.id]); pick = (on || list[0]).meta.platform + ":" + (on || list[0]).meta.id; }
  if (cur.tab !== "chat") return;
  const L = list.find(x => x.meta.platform + ":" + x.meta.id === pick);
  v.innerHTML = '<h2>Chat</h2>' + (list.length > 1 ? '<select id="chatPick" aria-label="League" style="width:100%;margin-bottom:10px">' + list.map(x => { const k = x.meta.platform + ":" + x.meta.id; return '<option value="' + esc(k) + '"' + (k === pick ? " selected" : "") + '>' + esc(x.meta.name) + '</option>'; }).join("") + '</select>' : '<p class="small muted" style="margin:-6px 0 10px">' + esc(L.meta.name) + '</p>') + '<div id="chatBox"><p class="spin">Loading chat…</p></div>';
  const sel = v.querySelector("#chatPick"); if (sel) sel.addEventListener("change", () => { try { localStorage.setItem(KEY + ".chatL", sel.value); } catch(e){} renderChatTab(v); });
  openChat(L, v.querySelector("#chatBox"));
}
function chatSeen(k, key){ try { const m = JSON.parse(localStorage.getItem(KEY + ".chatSeen") || "{}"); if (key) { m[k] = key; localStorage.setItem(KEY + ".chatSeen", JSON.stringify(m)); } return m[k] || ""; } catch(e){ return ""; } }
async function checkUnread(){
  if (cur.tab === "chat") return;
  let any = false;
  for (const L of chatLeagues()) {
    const k = L.meta.platform + ":" + L.meta.id;
    if (gmState[k] === false) continue;
    try { const j = await api("/api/chat?p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id) + "&dev=" + devId()); gmState[k] = !!j.connected; const last = (j.list || []).slice(-1)[0]; if (last && last.k > chatSeen(k) && !(last.bot && last.text.startsWith(chatName(L) + ": "))) any = true; } catch(e){}
  }
  const d = $("#chatDot"); if (d) d.hidden = !any;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUnread(); });
async function openChat(L, box){
  closeChat();
  const q = "p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id);
  const st = chat = {L, list: [], keys: new Set(), dead: false};
  let j; try { j = await api("/api/chat?" + q + "&dev=" + devId()); } catch(e){ box.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  if (st.dead) return;
  gmState[L.meta.platform + ":" + L.meta.id] = !!j.connected;
  if (!j.connected) {
    if (!j.isComm) { box.innerHTML = '<div class="card empty"><h3>GroupMe isn’t connected yet</h3><p class="muted">Someone in your league has started connecting it. Once they finish, the group’s messages show up here.</p></div>'; return; }
    const gq = "/api/chat/setup?" + q;
    let cb = j.callback;
    if (!cb) { try { cb = (await post(gq, {dev: devId(), action: "start"})).callback; } catch(e){ box.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; } }
    if (st.dead) return;
    box.innerHTML = '<div class="gmsteps"><p class="muted" style="margin:0 0 12px">Connect your league’s GroupMe once and its messages show up here. Three steps:</p>'
      + '<div class="card"><b>1. Copy this address</b><div class="copyrow" style="margin-top:8px"><input readonly id="gmCb" value="' + esc(cb) + '" aria-label="Callback address"><button class="btn" id="gmCopy">Copy</button></div></div>'
      + '<div class="card"><b>2. Make the bot on GroupMe</b><p class="small">Open <a href="https://dev.groupme.com/bots/new" target="_blank" rel="noopener">dev.groupme.com/bots/new</a> and sign in. Pick your league’s group, type <b>Snap Count</b> for the name, and paste the address into <b>Callback URL</b>. Leave everything else blank and press Submit.</p></div>'
      + '<div class="card stackc" style="gap:8px"><b>3. Paste the Bot ID here</b><p class="small muted" style="margin:0">GroupMe shows it next to your new bot.</p><input id="gmBot" placeholder="Bot ID" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="gmSave">Connect</button><p class="small" id="gmMsg" style="margin:0;color:var(--bad)"></p></div></div>';
    box.querySelector("#gmCopy").addEventListener("click", async () => { const i = box.querySelector("#gmCb"); try { await navigator.clipboard.writeText(i.value); box.querySelector("#gmCopy").textContent = "Copied"; } catch(e){ i.select(); } });
    box.querySelector("#gmSave").addEventListener("click", async () => { const b = box.querySelector("#gmSave"); b.disabled = true; b.textContent = "Connecting…";
      try { await post(gq, {dev: devId(), action: "bot", bot: box.querySelector("#gmBot").value.trim()}); gmState[L.meta.platform + ":" + L.meta.id] = true; openChat(L, box); }
      catch(e){ b.disabled = false; b.textContent = "Connect"; box.querySelector("#gmMsg").textContent = e.message; } });
    return;
  }
  box.innerHTML = '<div class="chatwrap"><div class="chatlog" id="chatLog" aria-live="polite"></div><form class="chatin" id="chatForm"><textarea id="chatText" rows="1" maxlength="900" placeholder="Message the league" aria-label="Message"></textarea><button class="btn" id="chatSend" aria-label="Send">Send</button></form><p class="small muted chatas">Posting as <button type="button" class="linkish" id="chatAs">' + esc(chatName(L)) + '</button> through the Snap Count bot.</p></div>';
  const log = box.querySelector("#chatLog");
  const mine = n => n === chatName(L);
  const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  const ck = L.meta.platform + ":" + L.meta.id;
  const draw = (stick) => { const last = st.list[st.list.length - 1]; if (last && cur.tab === "chat") { chatSeen(ck, last.k); const dd = $("#chatDot"); if (dd) dd.hidden = true; } const keep = stick || atBottom(); log.innerHTML = (st.more ? '<button type="button" class="btn ghost" id="chatMore" style="width:100%;margin-bottom:8px">Earlier messages</button>' : "") + (st.list.length ? st.list.map(m => chatMsgHTML(m, mine)).join("") : '<p class="muted small" style="text-align:center">No messages since Snap Count joined the group. New ones will show up here.</p>'); if (keep) log.scrollTop = log.scrollHeight; const mb = log.querySelector("#chatMore"); if (mb) mb.addEventListener("click", older); };
  const add = (arr, front) => { const fresh = arr.filter(m => { const k = m.k || ("m:" + String(m.at).padStart(15, "0") + ":" + m.id); if (st.keys.has(k)) return false; st.keys.add(k); m.k = k; return true; }); st.list = front ? fresh.concat(st.list) : st.list.concat(fresh); st.list.sort((a, b) => a.k < b.k ? -1 : 1); return fresh.length; };
  const older = async () => { const first = st.list[0]; if (!first) return; const h0 = log.scrollHeight; try { const r = await api("/api/chat?" + q + "&before=" + encodeURIComponent(first.k)); st.more = r.more; add(r.list, true); draw(false); log.scrollTop = log.scrollHeight - h0; } catch(e){} };
  st.more = j.more; add(j.list); draw(true);
  const refresh = async () => { try { const r = await api("/api/chat?" + q); if (st.dead) return; if (add(r.list)) draw(false); } catch(e){} };
  const connect = () => {
    if (st.dead) return;
    try {
      const ws = st.ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/chat/ws?" + q);
      ws.onmessage = e => { if (e.data === "pong") return; try { const d = JSON.parse(e.data); if (d.type === "msg" && add([d.m])) draw(false); } catch(x){} };
      ws.onopen = () => { clearInterval(st.poll); st.poll = null; refresh(); };
      ws.onclose = () => { if (st.dead) return; if (!st.poll) st.poll = setInterval(refresh, 20000); setTimeout(connect, 8000); };
    } catch(e){ if (!st.poll) st.poll = setInterval(refresh, 20000); }
  };
  connect();
  st.ping = setInterval(() => { try { st.ws && st.ws.readyState === 1 && st.ws.send("ping"); } catch(e){} }, 45000);
  const ta = box.querySelector("#chatText");
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(140, ta.scrollHeight) + "px"; });
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && matchMedia("(pointer:fine)").matches) { e.preventDefault(); box.querySelector("#chatForm").requestSubmit(); } });
  box.querySelector("#chatForm").addEventListener("submit", async e => {
    e.preventDefault(); const t = ta.value.trim(); if (!t) return;
    const btn = box.querySelector("#chatSend"); btn.disabled = true;
    try { await post("/api/chat/post?" + q, {dev: devId(), name: chatName(L), text: t}); ta.value = ""; ta.style.height = "auto"; setTimeout(refresh, 2500); }
    catch(x){ alertMsg(ta.parentNode, x.message); }
    btn.disabled = false; ta.focus();
  });
  box.querySelector("#chatAs").addEventListener("click", () => {
    const b = box.querySelector("#chatAs"), i = document.createElement("input");
    i.value = chatName(L); i.maxLength = 40; i.className = "chatname"; i.setAttribute("aria-label", "Name to post as"); b.replaceWith(i); i.focus(); i.select();
    const done = () => { const n = i.value.trim(); try { if (n) localStorage.setItem(KEY + ".chatName", n); else localStorage.removeItem(KEY + ".chatName"); } catch(e){} const nb = document.createElement("button"); nb.type = "button"; nb.className = "linkish"; nb.id = "chatAs"; nb.textContent = chatName(L); i.replaceWith(nb); nb.addEventListener("click", () => box.querySelector("#chatAs") && openChat(L, box)); draw(false); };
    i.addEventListener("blur", done); i.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); i.blur(); } });
  });
}

/* ---------- private usage: one ping per device per day ---------- */
const OWNER_L = {p: "flea", id: "183120", team: "1245245"};
function isOwnerDevice(){ return leagues.some(L => L.meta.platform === OWNER_L.p && String(L.meta.id) === OWNER_L.id && L.detail && L.detail.teams.some(t => t.mine && String(t.id) === OWNER_L.team)); }
function dailyPing(){

    const sites = ["sleeper", "flea", "espn", "mfl"].filter(k => (accts[k] || []).length).join(",");
    fetch("/api/ping?d=" + devId() + "&i=" + (isInstalled() ? 1 : 0) + "&s=" + sites).then(r => { if (r.ok) localStorage.setItem(KEY + ".ping", today); }).catch(() => {});
  } catch(e){}
}
async function openUsage(){
