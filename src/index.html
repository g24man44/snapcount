<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snap Count</title>
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0d13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one 600px column, compact header, matchup hero up top, floating pill tab bar.
   Dark-first: deep slate with a pylon-orange accent; light theme mirrors it. */
:root{
  --bg:#0a0d13; --surface:#131924; --surface2:#1b2230; --surface3:#232c3c; --ink:#f3f6fb; --muted:#8c97aa; --line:#212a39;
  --accent:#ff7a3d; --accent-ink:#1a0b03; --accent-soft:rgba(255,122,61,.15);
  --ok:#34d399; --ok-soft:rgba(52,211,153,.14); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14); --bad:#ff5a52; --bad-soft:rgba(255,90,82,.15);
  --qb:#ff8080; --rb:#34d399; --wr:#6ea8ff; --te:#c792ff; --k:#8c97aa; --def:#a3b1c6;
  --shadow:0 10px 30px rgba(0,0,0,.35); --card-shadow:none;
  --body:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --display:var(--body);
  --r:20px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#eef1f6; --surface3:#e3e8f0; --ink:#0d121b; --muted:#5b6576; --line:#e1e6ee;
  --accent:#a8380a; --accent-ink:#ffffff; --accent-soft:#fff0e6;
  --ok:#05703f; --ok-soft:#e2f6ec; --warn:#7f4a00; --warn-soft:#fff3d9; --bad:#b4231a; --bad-soft:#fde8e6;
  --qb:#9c3306; --rb:#05703f; --wr:#2347ad; --te:#7130ad; --k:#5b6576; --def:#475569;
  --shadow:0 10px 30px rgba(15,23,40,.12); --card-shadow:0 1px 2px rgba(15,23,40,.05),0 6px 18px rgba(15,23,40,.05);
  color-scheme:light}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased;letter-spacing:.005em;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 8px}
.brand{display:flex;align-items:center;gap:10px;margin:0}
.brand .logo{width:36px;height:36px;border-radius:11px}
.brand h1{font:800 22px/1 var(--body);letter-spacing:-.03em;margin:0}
.hright{display:flex;align-items:center;gap:8px}
@media (max-width:430px){#wk{display:none}}
.wk{white-space:nowrap;font:700 12.5px/1 var(--body);color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:8px 11px;border-radius:999px}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.iconbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
/* floating tab bar */
nav.tabbar{position:fixed;z-index:15;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;
  display:flex;justify-content:space-around;padding:6px;border-radius:26px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--shadow)}
nav.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 6px;font:600 11px/1 var(--body);color:var(--muted);border-radius:20px;transition:background .15s,color .15s}
nav.tabbar button svg{width:23px;height:23px}
nav.tabbar button[aria-selected=true]{color:var(--accent);background:var(--accent-soft)}
/* type */
h2{font:800 28px/1.1 var(--body);letter-spacing:-.03em;margin:14px 0 14px;text-wrap:balance}
h3{font:700 12.5px/1.2 var(--body);color:var(--muted);margin:22px 4px 10px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:14px}
.spin{color:var(--muted);padding:20px 2px}
.stack{display:flex;flex-direction:column;gap:14px}
/* surfaces */
.sportbar{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 4px;scrollbar-width:none}.sportbar::-webkit-scrollbar{display:none}
.sportbar .chip{flex:none;white-space:nowrap}
button.chip.on{background:var(--accent);color:var(--accent-ink)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.daynav button{border:0;background:var(--surface2);color:var(--ink);border-radius:12px;padding:8px 14px;font-weight:700}
.gcard{display:block;color:inherit;text-decoration:none;padding:12px 14px}
.gcard .gl{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:3px 0}
.gcard .gl img{width:28px;height:28px;object-fit:contain}
.gcard .gl .nm{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .gl .nm small{color:var(--muted);font-weight:500;margin-left:6px;font-size:12px}
.gcard .gl .sc{font:800 19px var(--display,inherit);font-variant-numeric:tabular-nums}
.gcard .gl.lose .sc,.gcard .gl.lose .nm{color:var(--muted)}
.gcard .gmeta{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.gcard .gmeta .glive{color:var(--bad);font-weight:800}
.gcard .gmine{display:inline-block;margin-top:6px;font-size:12px;color:var(--accent);font-weight:700}
.gcard .sit{font-size:12.5px;margin-top:6px;color:var(--ink)}
.gcard .rz{color:var(--bad);font-weight:800}
.lb{list-style:none;margin:6px 0 0;padding:0;font-size:14px}.lb li{display:flex;justify-content:space-between;padding:3px 0}
.aibtn{background:linear-gradient(135deg,#ff7a3d,#ff3d77 55%,#8b5cf6)!important;color:#fff!important;border:0}
.accbar{margin:12px 0 0;padding:12px 14px;border-radius:16px;background:var(--surface2)}.acchead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.accn{font-size:20px;color:var(--accent)}
.offline{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:30;background:var(--surface3);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.coachfab{display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 14px 9px 12px;font:800 14px var(--body);color:#fff;background:linear-gradient(135deg,#ff7a3d,#ff3d77 55%,#8b5cf6);box-shadow:0 6px 20px rgba(255,90,90,.3);cursor:pointer}
.coachfab .spark,.spark{display:inline-block;animation:twk 2.4s ease-in-out infinite}
@keyframes twk{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.25) rotate(20deg)}}
.coachhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.coachhead .ctitle{font-size:18px}
.coachhead .icon{border:0;background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:16px}
.clog{display:flex;flex-direction:column;gap:10px;margin:12px 0;max-height:52vh;overflow:auto;padding:2px}
.cmsg{padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;max-width:92%}
.cmsg p{margin:0}
.cmsg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px;font-weight:600}
.cmsg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.cb{display:block;position:relative;padding-left:16px;margin:4px 0}.cb::before{content:"";position:absolute;left:3px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.cb.n{padding-left:22px}.cb.n::before{display:none}.cb.n i{position:absolute;left:0;font-style:normal;font-weight:800;color:var(--accent)}
.cq{margin:0 0 10px}.cq .chip{font-size:12.5px;padding:7px 11px}
.cform{display:flex;gap:8px;align-items:center}.cform input{flex:1;margin:0}
.cform .mic{border:0;width:44px;height:44px;border-radius:50%;background:var(--surface2);color:var(--ink);display:grid;place-items:center;flex:none}
.cform .mic.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,80,80,.6)}100%{box-shadow:0 0 0 14px rgba(255,80,80,0)}}
.typing{display:inline-flex;gap:4px;padding:4px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.recap{font-size:15px;line-height:1.55;margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--card-shadow)}
.badge{font:700 11px/1 var(--body);padding:6px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.chip{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--surface2);color:var(--muted);border:0;font-weight:600}
.chip.ok,.chip.free{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
button.chip{cursor:pointer;padding:8px 14px;font-weight:700;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.err{border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft);color:var(--ink);padding:12px 14px;border-radius:14px;font-size:14px}
/* buttons, inputs */
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:12px 16px;font-weight:700;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.6}
.icon{background:var(--surface2);border:0;border-radius:10px;padding:7px 12px;font-weight:700;font-size:13px}
label{font-weight:600;font-size:13.5px;color:var(--muted)}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-weight:500}
.seg{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:16px}
.seg button{flex:1;padding:10px 6px;border:0;border-radius:12px;background:transparent;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;margin:6px 0 10px;font-weight:500;color:var(--ink)}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.actions,.sendrow,.btnrow{display:flex;gap:8px;margin-top:12px}
.actions .btn,.sendrow .btn,.btnrow .btn{flex:1;font-size:14px;padding:11px 10px}
.back{background:none;border:0;padding:6px 0;font:700 15px/1 var(--body);color:var(--accent)}
form.add{display:flex;flex-direction:column;gap:10px}
/* faces and logos */
.av{position:relative;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--surface2);box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--pc,var(--muted)) 70%,transparent);overflow:hidden}
.av i{font:800 14px/1 var(--body);font-style:normal;color:var(--muted)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.av.xl{width:72px;height:72px}
.av[data-pos=QB],.pt[data-pos=QB],.pos[data-pos=QB]{--pc:var(--qb)} .av[data-pos=RB],.pt[data-pos=RB],.pos[data-pos=RB]{--pc:var(--rb)}
.av[data-pos=WR],.pt[data-pos=WR],.pos[data-pos=WR]{--pc:var(--wr)} .av[data-pos=TE],.pt[data-pos=TE],.pos[data-pos=TE]{--pc:var(--te)}
.av[data-pos=K],.pt[data-pos=K]{--pc:var(--k)} .av[data-pos=DEF],.av[data-pos="D/ST"],.pt[data-pos=DEF],.pt[data-pos="D/ST"]{--pc:var(--def)}
.pt{font:800 10.5px/1 var(--body);font-style:normal;color:var(--pc,var(--muted));background:color-mix(in srgb,var(--pc,var(--muted)) 16%,transparent);padding:3px 6px;border-radius:6px;margin-right:6px;vertical-align:1px;letter-spacing:.03em}
.pos{font:800 12px/1 var(--body);text-align:center;padding:9px 0;border-radius:12px;color:var(--pc,var(--muted));background:color-mix(in srgb,var(--pc,var(--muted)) 15%,transparent)}
.pos[data-pos=PICK]{--pc:var(--accent)}
.tl{position:relative;width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;background:var(--surface3);overflow:hidden}
.tl.big{width:56px;height:56px;border-radius:18px}
.tl i{font:800 12px/1 var(--body);font-style:normal;color:var(--muted)} .tl.big i{font-size:16px}
.tl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* matchup hero */
.heroCard{margin-top:14px;padding:18px 14px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface) 70%)}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hteam{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.hteam b{font-size:14px;line-height:1.2;max-width:100%;overflow-wrap:anywhere;hyphens:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hteam small{color:var(--muted);font-size:12px;font-weight:600}
.hmid{text-align:center}
.hscores{display:flex;align-items:baseline;gap:8px;font:800 34px/1 var(--body);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.hscores span{color:var(--muted)} .hscores span.win{color:var(--ink)} .hscores .dash{font-size:20px;color:var(--line)}
.hmid small{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.wp{grid-column:1/-1;margin-top:10px}
.wpbar{height:8px;border-radius:999px;background:var(--surface3);overflow:hidden}
.wpbar span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.wplab{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;font-weight:700;color:var(--muted)}
.wplab span:first-child{color:var(--accent)}
.hero.compact{margin-top:4px}
.hero.compact .hscores{font-size:26px}
.hero.compact .hteam b{font-size:13px}
/* league list */
.league{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.league .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.league .name{font:800 19px/1.2 var(--body);letter-spacing:-.02em;min-width:0;overflow-wrap:anywhere}
.lfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lfoot .go{margin-left:auto;font-weight:700;font-size:14px;color:var(--accent)}
.score{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;align-items:center}
.score .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.score .t.me{color:var(--ink);font-weight:700}
.score .p{font:800 22px/1.1 var(--body);text-align:right;letter-spacing:-.02em}
.lead{color:var(--ok)}
/* player lists */
.plist{list-style:none;margin:0;padding:4px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--card-shadow);overflow:hidden}
.plist li+li{border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:14px;width:100%;background:none;border:0;text-align:left;padding:12px 16px}
.prow:active{background:var(--surface2)}
.pname{min-width:0}
.pname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:16px;letter-spacing:-.01em}
.pname small{color:var(--muted);font-size:13px;line-height:1.5}
.pts{font:800 19px/1 var(--body);font-variant-numeric:tabular-nums;text-align:right;letter-spacing:-.02em}
.avg{display:flex;flex-direction:column;align-items:flex-end;font:700 17px/1 var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.avg small{font:700 10px/1.4 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.inj{display:inline-block;font:800 10.5px/1 var(--body);padding:4px 6px;border-radius:6px;margin-left:6px;vertical-align:2px;color:var(--warn);background:var(--warn-soft)}
.inj.bad{color:var(--bad);background:var(--bad-soft)} .inj.ok{color:var(--ok);background:var(--ok-soft)}
.live{color:#fff;background:#d4302a;font:800 10px/1 var(--body);padding:3px 6px;border-radius:6px;letter-spacing:.04em}
.note{display:block;margin-top:5px;font-size:13px;line-height:1.4;color:var(--ink);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note .inj{margin:0 5px 0 0}
.mine{background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 5px;font-weight:700}
.posf{margin:12px 0 0}
.seg.sub{margin-top:8px}
.cmpwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}.cmpt{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;table-layout:fixed;min-width:320px}
.cmpt th,.cmpt td{padding:8px 6px;text-align:center;vertical-align:middle;border-bottom:1px solid var(--line)}.cmpt td:first-child,.cmpt th:first-child{text-align:left;color:var(--muted);font-size:12.5px;width:92px}
.cmpt th{position:relative;font-weight:600}.cmpt th .av{margin:0 auto 4px;display:flex}.cmpt th b{display:block;font-size:13.5px;line-height:1.2}.cmpt th small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.cmpt td.win{color:var(--ok);font-weight:800}.cmpx{position:absolute;top:0;right:0;border:0;background:var(--surface2);color:var(--muted);width:24px;height:24px;border-radius:50%;font-size:16px;line-height:1}
.sosc{padding:10px 12px}.sosr+.sosr{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.sosn{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:0}.sosn b{display:block;font-size:15px}.sosn small{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;margin-top:2px}
.sosw{display:flex;gap:4px;overflow-x:auto;margin-top:6px;scrollbar-width:none}.sosx{flex:none;min-width:44px;padding:4px 2px;border-radius:8px;font-size:11.5px;font-weight:700;text-align:center;background:var(--surface2);color:var(--muted);display:flex;flex-direction:column;gap:1px;border:1.5px solid transparent}
.sosx small{font-size:9.5px;font-weight:600}.sosx.easy{background:var(--ok-soft);color:var(--ok)}.sosx.hard{background:var(--bad-soft);color:var(--bad)}.sosx.bye{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}.sosx.po{border-color:var(--accent)}
.swbar{display:block;height:4px;border-radius:4px;background:var(--surface3);margin-top:6px;overflow:hidden}.swbar span{display:block;height:100%;border-radius:4px}
.luslot{grid-template-columns:52px 40px 1fr auto}.luslot.on{background:var(--accent-soft)}.lusl{font:800 12px/1 var(--body);color:var(--muted);text-align:center}.lubtn{padding:7px 10px;font-size:13px}.lupick{margin:0 0 6px 18px;border-left:2px solid var(--accent)}
.lucheck{list-style:none;margin:0;padding:0;display:grid;gap:8px}.lucheck label{color:var(--ink);display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;justify-items:start;text-align:left;font-size:15px;margin:0}.lucheck input{width:20px;height:20px;margin:0;padding:0}.lucheck li.done{opacity:.55;text-decoration:line-through}

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n == null || isNaN(n)) ? "–" : Number(n).toFixed(2);
const norm = s => String(s || "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b/g, "").replace(/[^a-z]/g, "");

/* ---------- storage ---------- */
const KEY = "snapcount.v1";
function loadAccts(){ let a; try { a = JSON.parse(localStorage.getItem(KEY)); } catch(e){} a = a || {}; a.sleeper = a.sleeper || []; a.flea = a.flea || []; a.espn = a.espn || []; a.mfl = a.mfl || []; return a; }
function saveAccts(a){ try { localStorage.setItem(KEY, JSON.stringify(a)); } catch(e){} }
let accts = loadAccts();

/* ---------- api ---------- */
let offlineShown = false;
async function api(path){
  const r = await fetch(path);
  if (r.headers.get("x-sc-offline") && !offlineShown) { offlineShown = true; const b = document.createElement("div"); b.className = "offline"; b.textContent = "You’re offline. Showing the last data you saw."; document.body.appendChild(b); window.addEventListener("online", () => location.reload(), {once:true}); }
  if (!r.ok) { let t = ""; try { t = (await r.json()).error; } catch(e){} throw new Error(t || ("Request failed (" + r.status + ")")); }
  return r.json();
}
let nflState = null, players = null, playersP = null;
async function getState(){ if (!nflState) nflState = await api("/api/sleeper/state/nfl"); return nflState; }
function getPlayers(){ if (!playersP) playersP = api("/api/players").then(p => (players = p)); return playersP; }

/* ---------- injury ---------- */
function injChip(code){
  if (!code) return "";
  const c = String(code).toUpperCase();
  const map = {QUESTIONABLE:"Q", DOUBTFUL:"D", OUT:"O", "INJURED RESERVE":"IR", SUSPENDED:"SUS", SUS:"SUS", PUP:"PUP", NA:"NA", COV:"COV"};
  const s = map[c] || c.slice(0,3);
  const cls = (s === "Q" || s === "P") ? "" : "bad";
  return '<span class="inj ' + cls + '" title="' + esc(code) + '">' + esc(s) + "</span>";
}

/* ---------- Sleeper ---------- */
async function sleeperLeagues(username){
  const [st, user] = await Promise.all([getState(), api("/api/sleeper/user/" + encodeURIComponent(username))]);
  if (!user || !user.user_id) throw new Error('No Sleeper user named "' + username + '"');
  const season = st.league_season || st.season;
  const lgs = await api("/api/sleeper/user/" + user.user_id + "/leagues/nfl/" + season) || [];
  return lgs.map(l => ({platform:"sleeper", id:l.league_id, name:l.name, season, uid:user.user_id, acct:username}));
}
async function sleeperDetail(L){
  const st = await getState();
  const week = Math.max(1, st.display_week || st.week || 1);
  const [users, rosters, mus, lg] = await Promise.all([
    api("/api/sleeper/league/" + L.id + "/users"),
    api("/api/sleeper/league/" + L.id + "/rosters"),
    api("/api/sleeper/league/" + L.id + "/matchups/" + week).catch(() => []),
    api("/api/sleeper/league/" + L.id).catch(() => ({}))
  ]);
  await Promise.all([getPlayers(), getSeasonStats(L.season)]);
  const rec = ((lg && lg.scoring_settings) || {}).rec;
  const scoring = rec >= 1 ? "ppr" : rec >= 0.5 ? "half" : rec === 0 ? "std" : "ppr";
  const uById = {}; (users || []).forEach(u => uById[u.user_id] = u);
  const ptsByRoster = {}; (mus || []).forEach(m => ptsByRoster[m.roster_id] = m);
  const teams = (rosters || []).map(r => {
    const u = uById[r.owner_id] || {};
    const s = r.settings || {};
    const m = ptsByRoster[r.roster_id] || {};
    const starters = new Set((r.starters || []).filter(x => x && x !== "0"));
    const reserve = new Set(r.reserve || []);
    const pp = m.players_points || {};
    const roster = (r.players || []).map(pid => {
      const p = players[pid] || [pid, "", "", null, null];
      return {id:pid, name:p[0], pos:p[1] || (/^[A-Z]{2,3}$/.test(pid) ? "DEF" : ""), team:p[2], inj:p[3], injPart:p[4],
        slot: starters.has(pid) ? "start" : reserve.has(pid) ? "ir" : "bench", pts: pp[pid]};
    });
    return {id:String(r.roster_id), name:(u.metadata && u.metadata.team_name) || u.display_name || ("Team " + r.roster_id), logo: u.avatar ? "https://sleepercdn.com/avatars/thumbs/" + u.avatar : "",
      owner:u.display_name || "", div: s.division || null, w:s.wins||0, l:s.losses||0, t:s.ties||0,
      pf:(s.fpts||0) + (s.fpts_decimal||0)/100, roster, mine: r.owner_id === L.uid || (r.co_owners||[]).includes(L.uid),
      matchup:m.matchup_id, wk:m.points, keepers: r.keepers || [], waiver: s.waiver_position || null,
      faab: lg && lg.settings && lg.settings.waiver_type === 2 ? Math.max(0, (lg.settings.waiver_budget || 0) - (s.waiver_budget_used || 0)) : null};
  });
  const groups = {}; teams.forEach(t => { if (t.matchup) (groups[t.matchup] = groups[t.matchup] || []).push(t); });
  const games = Object.values(groups).filter(g => g.length === 2).map(g => ({a:{id:g[0].id, pts:g[0].wk}, b:{id:g[1].id, pts:g[1].wk}}));
  return {week, teams, games, starterSplit:true, scoring, slots: (lg && lg.roster_positions) || null, draftRounds: (lg && lg.settings && lg.settings.draft_rounds) || 4, season: Number((lg && lg.season) || 0),
    maxKeepers: (lg && lg.settings && lg.settings.max_keepers) || null,
    playoffTeams: (lg && lg.settings && lg.settings.playoff_teams) || null, playoffStart: (lg && lg.settings && lg.settings.playoff_week_start) || null};
}

/* ---------- Fleaflicker ---------- */
const fq = (ep, params) => "/api/flea/" + ep + "?" + new URLSearchParams(Object.assign({sport:"NFL"}, params)).toString();
async function fleaLeagues(acct){
  if (acct.type === "league") {
    const st = await api(fq("FetchLeagueStandings", {league_id:acct.value}));
    const name = (st.league && st.league.name) || ("Fleaflicker league " + acct.value);
    return [{platform:"flea", id:String(acct.value), name, myTeam:acct.team || fleaTeamFor(acct.value), acct:acct.value, acctObj:acct}];
  }
  const r = await api(fq("FetchUserLeagues", {email:acct.value}));
  const lgs = r.leagues || [];
  if (!lgs.length) throw new Error("No Fleaflicker leagues found for " + acct.value);
  return lgs.map(l => ({platform:"flea", id:String(l.id), name:l.name, myTeam: l.ownedTeam ? String(l.ownedTeam.id) : fleaTeamFor(String(l.id)), acct:acct.value}));
}
const val = x => {
  if (x == null) return null;
  if (typeof x !== "object") return Number(x);
  if (x.value != null) return Number(x.value);
  if (x.formatted != null && x.formatted !== "" && !isNaN(Number(String(x.formatted).replace(/,/g, "")))) return Number(String(x.formatted).replace(/,/g, ""));
  return null;

function matchupHero(d, me, g, compact){
  const mine = g.a.id === me.id ? g.a : g.b, opp = g.a.id === me.id ? g.b : g.a;
  const ot = d.teams.find(t => t.id === opp.id) || {name:"Opponent"};

  const meT = d.teams.find(t => t.id === mine.id), opT = d.teams.find(t => t.id === opp.id);
  const lpA = teamLive(meT, mine), lpB = teamLive(opT, opp);
  if ((mine.proj == null || mine._lp) && lpA && lpB) { mine.proj = lpA.proj; opp.proj = lpB.proj; mine._lp = opp._lp = true; }
  let wp = null;
  if (mine.proj != null && opp.proj != null) {
    const remA = lpA ? lpA.rem : Math.max(0, mine.proj - (mine.pts || 0)), remB = lpB ? lpB.rem : Math.max(0, opp.proj - (opp.pts || 0));
    const sd = Math.max(1.2, 6 * Math.sqrt((remA + remB) / 10));
    wp = normCdf((mine.proj - opp.proj) / sd);
    wp = Math.min(0.995, Math.max(0.005, wp));
  }
  return '<div class="hero' + (compact ? " compact" : "") + '">' +
    '<div class="hteam">' + teamLogo(me, !compact) + '<b>' + esc(me.name) + "</b><small>" + rec(me) + "</small></div>" +

      ? '<div class="hmid"><div class="hscores"><span class="' + (mine.proj >= opp.proj ? "win" : "") + '">' + fmt(mine.proj) + '</span><span class="dash">–</span><span class="' + (mine.proj < opp.proj ? "win" : "") + '">' + fmt(opp.proj) + "</span></div><small>Projected · Week " + (d.week || "") + "</small></div>"
      : '<div class="hmid"><div class="hscores"><span class="' + (lead >= 0 ? "win" : "") + '">' + fmt(mine.pts) + '</span><span class="dash">–</span><span class="' + (lead < 0 ? "win" : "") + '">' + fmt(opp.pts) + "</span></div>" +

  "</div>";
}

// Live projection: banks points already scored and projects only the part of each game still to play.
function normCdf(z){ const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2), y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z / 2); return z >= 0 ? (1 + y) / 2 : (1 - y) / 2; }
function gameLeft(team){
  const g = nflGames[tnorm(team)]; if (!gamesAt || !g) return gamesAt ? 0 : 1;
  if (g.state === "post") return 0; if (g.state !== "in") return 1;
  const m = String(g.detail || "").match(/(\d+):(\d+)\s*-\s*(\d)/); if (!m) return /half/i.test(g.detail) ? 0.5 : 0.5;
  const q = Math.min(4, Number(m[3])), left = (4 - q) * 15 + Number(m[1]) + Number(m[2]) / 60;
  return Math.max(0, Math.min(1, left / 60));
}
function teamLive(t, side){
  if (!t || !t.roster) return null;
  const st = t.roster.filter(p => p.slot === "start");
  if (!st.length || !st.some(p => p.proj != null)) return null;
  let proj = 0, rem = 0;
  st.forEach(p => { const f = gameLeft(p.team), pr = p.proj || 0, pts = p.pts || 0; const r = pr * f; proj += pts + r; rem += r; });
  return {proj, rem};
}

    for (const id in players) {

/* ---------- trade grader ---------- */
const FLEX = {FLEX:["RB","WR","TE"], SUPER_FLEX:["QB","RB","WR","TE"], REC_FLEX:["WR","TE"], WRRB_FLEX:["WR","RB"]};

async function sleeperIdFor(L, p){

}
function leagueSlots(L){
  const raw = (L.detail && L.detail.slots) || ["QB","RB","RB","WR","WR","TE","FLEX"];
  const keep = raw.filter(x => ["QB","RB","WR","TE"].includes(x) || FLEX[x]);
  return keep.filter(x => !FLEX[x]).concat(keep.filter(x => FLEX[x]));
}
function bestLineup(roster, slots, val){
  const pool = roster.filter(p => !OUTISH_C.test(String(p.inj || ""))).map(p => ({p, v: val(p)})).sort((a, b) => b.v - a.v);
  const used = new Set(), list = [];

}
const fmtV = n => Math.round(n).toLocaleString();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function gradeTrade(ctx){

  const pts = p => ppg.get(p) || 0;
  const give = me.roster.concat(myPicks).filter(p => tr.give.has(p.id)), get = them.roster.concat(theirPicks).filter(p => tr.get.has(p.id));
  const eff = arr => arr.map(val).sort((a, b) => b - a).reduce((s, v, i) => s + v * Math.max(0.4, 1 - 0.15 * i), 0);
  const rawG = give.reduce((s, p) => s + val(p), 0), rawR = get.reduce((s, p) => s + val(p), 0);
  const G = eff(give), R = eff(get), ratio = (R + 50) / (G + 50);
  const valueScore = 5.5 + 4.5 * clamp(Math.log(ratio) / Math.log(1.6), -1, 1);
  const slots = leagueSlots(L);
  const before = bestLineup(me.roster, slots, pts);
  const afterRoster = me.roster.filter(p => !tr.give.has(p.id)).concat(get.filter(p => p.pos !== "PICK"));
  const after = bestLineup(afterRoster, slots, pts);
  const delta = after.total - before.total;
  const pct = before.total ? delta / before.total : 0;
  const holes = after.list.filter((s, i) => !s.p && !FLEX[s.slot] && before.list[i].p);
  const lineupAdj = clamp(delta / 5, -2, 2) - 3 * holes.length;
  const hurtIn = get.filter(p => OUTISH_C.test(String(p.inj || ""))), hurtOut = give.filter(p => OUTISH_C.test(String(p.inj || "")));
  const injAdj = clamp(-0.6 * hurtIn.length, -1.2, 0) + clamp(0.3 * hurtOut.length, 0, 0.6);
  let ageAdj = 0, ageNote = null;
  if (ctx.dyn) {
    const ageOf = p => p.pos === "PICK" ? null : (V[sid.get(p)] || [])[6];
    const wAge = arr => { const xs = arr.map(p => ({a: ageOf(p), v: val(p)})).filter(x => x.a && x.v); const tv = xs.reduce((s, x) => s + x.v, 0); return tv ? xs.reduce((s, x) => s + x.a * x.v, 0) / tv : null; };
    const ga = wAge(give), ra = wAge(get);
    if (ga && ra && ra - ga >= 2.5) { ageAdj = -1.5; ageNote = ({tone: "bad", text: "You’d get older: the value you receive averages age " + ra.toFixed(1) + " vs " + ga.toFixed(1) + " for what you give. In dynasty that value fades faster."}); }
    else if (ga && ra && ga - ra >= 2.5) { ageAdj = 0.5; ageNote = ({tone: "good", text: "You’d get younger: " + ra.toFixed(1) + " vs " + ga.toFixed(1) + " average age, value that should hold up."}); }
  }
  let score = clamp(Math.round(valueScore + lineupAdj + injAdj + ageAdj), 1, 10);
  if (holes.length) score = Math.min(score, 5);
  const reasons = [];

  const diff = rawG ? Math.round((rawR - rawG) / rawG * 100) : 100;
  reasons.push({tone: diff >= 5 ? "good" : diff <= -5 ? "bad" : "", text: "Trade value: you get " + fmtV(rawR) + " and give " + fmtV(rawG) + (rawG ? " (" + (diff > 0 ? "+" : "") + diff + "%)" : "") + "."});
  const all = give.filter(p => p.pos !== "PICK").map(p => ({p, side:"give"})).concat(get.filter(p => p.pos !== "PICK").map(p => ({p, side:"get"}))).sort((a, b) => val(b.p) - val(a.p));
  if (all.length && val(all[0].p)) {
    const top = all[0], rk = (V[sid.get(top.p)] || [])[2];
    reasons.push({tone: top.side === "get" ? "good" : "bad", text: "Best player in the deal: " + top.p.name + (rk ? " (" + top.p.pos + rk + ")" : "") + (top.side === "get" ? ". You'd be getting him." : ". You'd be giving him up.")});
  }
  const gp = give.filter(p => p.pos !== "PICK").length, rp = get.filter(p => p.pos !== "PICK").length;
  if (gp !== rp) {
    const n = gp - rp;
    reasons.push({tone: "", text: n > 0 ? "You send " + gp + " player" + (gp > 1 ? "s" : "") + " for " + rp + " and open " + n + " roster spot" + (n > 1 ? "s" : "") + " for a waiver pickup." : "You take on " + (-n) + " extra player" + (n < -1 ? "s" : "") + ", so you'd need to drop someone."});
  }
  if (prem > 1.001 && give.concat(get).some(p => p.pos === "QB")) reasons.push({tone: "", text: "QBs are valued " + Math.round((prem - 1) * 100) + "% above the chart because every starting QB is rostered in a " + ctx.teams + "-team " + (ctx.qbs === 2 ? "superflex" : "") + " league."});
  const changes = [];
  const bIds = new Set(before.list.filter(x => x.p).map(x => x.p.id)), aIds = new Set(after.list.filter(x => x.p).map(x => x.p.id));
  const ins = after.list.filter(x => x.p && !bIds.has(x.p.id)).map(x => x.p.name), outs = before.list.filter(x => x.p && !aIds.has(x.p.id)).map(x => x.p.name);
  if (ins.length) changes.push("Into your lineup: " + ins.join(", "));
  if (outs.length) changes.push("out: " + outs.join(", "));
  if (Math.abs(delta) < 1) reasons.push({tone: "", text: "Your starting lineup barely changes this season."});
  else reasons.push({tone: delta > 0 ? "good" : "bad", text: "Your starting lineup " + (delta > 0 ? "gains" : "loses") + " about " + Math.abs(delta).toFixed(1) + " projected points a week" + (changes.length ? ". " + changes.slice(0, 3).join("; ") + "." : ".")});
  holes.forEach(s => reasons.push({tone: "bad", text: "You'd have no healthy starting " + s.slot + " left."}));
  hurtIn.forEach(p => reasons.push({tone: "bad", text: p.name + " is " + p.inj + (p.injPart ? " (" + p.injPart + ")" : "") + ". You'd be buying an injured player."}));
  hurtOut.forEach(p => reasons.push({tone: "good", text: p.name + " is " + p.inj + ", so you'd be selling an injured player."}));
  give.concat(get).filter(p => p.pos !== "PICK").forEach(p => {
    const t = (V[sid.get(p)] || [])[3] || 0;
    if (Math.abs(t) >= 300) reasons.push({tone: "", text: p.name + (/s$/i.test(p.name) ? "’" : "’s") + " value is " + (t > 0 ? "up " : "down ") + fmtV(Math.abs(t)) + " over the last 30 days" + (tr.give.has(p.id) ? (t > 0 ? ", so you'd be selling high." : ", so you may be selling low.") : (t > 0 ? ", so you'd be buying high." : ", so you'd be buying low.")) });

      results.push(Object.assign({best, g, T: res.T}, c));

    }

    let out = h;
    if (!results.length) out += '<div class="card" style="margin-top:12px"><p style="margin:0">' + (cands.length ? "Found " + pos + "s who would help, but no fair package fits. Try a stronger offer, include your own " + pos + "s, or unlock players below." : "No healthy " + pos + " on another roster would start for you right now.") + "</p></div>";

        '<ul class="reasons">' + why.map(w => '<li class="' + w.tone + '">' + esc(w.text) + "</li>").join("") + "</ul>" +
        '<h3 style="margin:16px 0 4px">Suggested offer</h3><ul class="offlist">' + r.best.combo.map(a => '<li>' + (a.p.pos === "PICK" ? '<span class="pos" data-pos="PICK">PK</span>' : avatar(a.p)) + "<b>" + esc(a.p.name) + "</b><span class='muted'>" + fmtV(a.v) + "</span></li>").join("") + "</ul>" +
        '<p class="small" style="margin:10px 0 0">Package value <b>' + fmtV(r.best.eff) + "</b> (" + (r.best.over >= 0 ? "+" : "") + Math.round(r.best.over * 100) + "%). After the trade your lineup " + (Math.abs(r.best.delta) < 0.5 ? "stays about the same" : (r.best.delta > 0 ? "gains " : "loses ") + Math.abs(r.best.delta).toFixed(1) + " points a week") + ".</p>" +

function drawTrade(ctx){

    if (pr.error) tr.pasteMsg = pr.error;
    else {
      const g1 = matchItems(pr.myGets, them.roster, ctx.theirPicks), g2 = matchItems(pr.theyGet, me.roster, ctx.myPicks);
      tr.get = new Set(g1.ids); tr.give = new Set(g2.ids);
      const miss = g1.miss.concat(g2.miss);
      tr.pasteMsg = miss.length ? "Couldn’t find: " + miss.join(", ") + ". Tap them below to add them." : "Loaded the trade from your email.";
    }

  }

  let h = "";

      (both && g.accept != null ? '<div class="accbar"><div class="acchead"><b>Chance ' + esc(them.name) + ' says yes</b><b class="accn">' + g.accept + '%</b></div><div class="wpbar"><span style="width:' + g.accept + '%"></span></div><p class="small muted" style="margin:6px 0 0">' + esc(g.acceptWhy.charAt(0).toUpperCase() + g.acceptWhy.slice(1)) + ".</p></div>" : "") +
      (g.ask ? '<p class="small" style="margin:10px 0 0">To even it out, ask them to add <b>' + esc(g.ask.name) + "</b>.</p>" : "") +
      (both ? '<button type="button" class="btn aibtn" id="negoBtn" style="width:100%;margin-top:12px">🤝 Practice the pitch with ' + esc(them.name) + "</button>" : "") +
      (both ? '<button type="button" class="btn ghost" id="shareGrade" style="width:100%;margin-top:10px">Share this grade as an image</button>' : "") +
      (both ? sendBlock(ctx.L, me, them, me.roster.concat(ctx.myPicks).filter(p => tr.give.has(p.id)), them.roster.concat(ctx.theirPicks).filter(p => tr.get.has(p.id))) : "") +
      '<p class="small muted" style="margin:10px 0 0">Values: ' + esc(ctx.src) + ", " + (ctx.dyn ? "dynasty" : "redraft") + (ctx.qbs === 2 ? " superflex" : "") + ", " + ctx.teams + "-team " + ({"1":"PPR","0.5":"half PPR","0":"standard"}[tr.ppr]) + ".</p></div>";
  } else {
    h += '<div class="card"><p style="margin:0" class="small">Tap players below. Your grade shows up here.</p></div>';
  }
  const pk = (arr, side) => arr.length ? '<h3>' + (side === "give" ? "Your" : "Their") + ' draft picks</h3><ul class="plist">' + arr.map(p => draftRow(p, side, V, (side === "give" ? tr.give : tr.get).has(p.id))).join("") + "</ul>" : "";
  h += '<h3>You give</h3><ul class="plist">' + me.roster.slice().sort(byVal).map(p => pickRow(p, "give", V, sid, tr.give.has(p.id), ctx.prem)).join("") + "</ul>" + pk(ctx.myPicks, "give");
  h += "<h3>You get from " + esc(them.name) + '</h3><ul class="plist">' + (them.roster.length ? them.roster.slice().sort(byVal).map(p => pickRow(p, "get", V, sid, tr.get.has(p.id), ctx.prem)).join("") : '<li><p class="muted small" style="margin:12px 14px">Their roster isn’t available.</p></li>') + "</ul>" + pk(ctx.theirPicks, "get");
  el.innerHTML = h;
  const nb = el.querySelector("#negoBtn");
  if (nb) nb.addEventListener("click", () => openNegotiate(ctx, me, them, me.roster.concat(ctx.myPicks).filter(p => tr.give.has(p.id)), them.roster.concat(ctx.theirPicks).filter(p => tr.get.has(p.id))));
  const sgb = el.querySelector("#shareGrade");
  if (sgb) sgb.addEventListener("click", async () => {
    const g = gradeTrade(ctx), [label, tone] = GRADE_LABEL(g.score);
    const gv = me.roster.concat(ctx.myPicks).filter(p => tr.give.has(p.id)).map(p => p.name), gt = them.roster.concat(ctx.theirPicks).filter(p => tr.get.has(p.id)).map(p => p.name);
    sgb.textContent = "Making image…";
    const r = await shareCard({kicker: ctx.L.meta.name + " · trade grade", big: String(g.score), bigSuffix: "/10", color: tone === "good" ? "#3ddc97" : tone === "bad" ? "#ff6b6b" : "#ffb020", title: label,
      lines: [{text: "Give: " + gv.join(", ")}, {text: "Get: " + gt.join(", ")}].concat(g.accept != null ? [{text: g.accept + "% chance " + them.name + " accepts"}] : []).concat(g.reasons.slice(0, 3))});
    sgb.textContent = r === "saved" ? "Image saved" : "Share this grade as an image";

  wireSend(el, ctx.L, me, them);
  el.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => {
    const set = b.dataset.side === "give" ? tr.give : tr.get, id = b.dataset.pid;
    if (set.has(id)) set.delete(id); else set.add(id);
    const y = window.scrollY; drawTrade(ctx); window.scrollTo(0, y);
  }));
}

/* ======================= FLEAFLICKER EXTRAS ======================= */
const slugify = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['’.]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const fleaPlayerUrl = p => "https://www.fleaflicker.com/nfl/leagues/" + p.lg + "/players/" + slugify(p.name) + "-" + p.id;
function fleaExtras(lp, p, lid){
  const n = (p.news || [])[0], l3 = ((lp && lp.lastX) || []).find(x => x.duration === 3);
  const rk = lp && lp.rankFantasy && (lp.rankFantasy.positions || [])[0];
  return {fl: true, lg: String(lid), fnews: n ? {title: n.title || "", text: n.contents || "", t: Number(n.timeEpochMilli) || 0} : null,
    last3: l3 ? val(l3.value) : null, frank: rk && rk.position ? rk.position.label + rk.formatted : null, keeper: !!(lp && lp.isKeeper)};
}
function fleaNoteCard(pl){
  if (!pl.fl || !pl.fnews || !pl.fnews.text) return "";
  return '<h3>Fleaflicker note</h3><div class="card injcard">' + (pl.fnews.title ? "<b>" + esc(pl.fnews.title) + "</b>" : "") + "<p>" + esc(pl.fnews.text) + '</p><small class="muted">' + (pl.fnews.t ? ago(pl.fnews.t) + " · " : "") + '<a href="' + esc(fleaPlayerUrl(pl)) + '" target="_blank" rel="noopener" style="color:var(--accent)">More on Fleaflicker</a></small></div>';

/* activity feed */
async function fleaActivity(L, pages){
  const d = L.detail;
  if (d.act && Date.now() - d.act.at < 120000 && d.act.pages >= (pages || 1)) return d.act.items;
  const items = []; let off = 0;
  for (let i = 0; i < (pages || 1); i++) {
    try { const r = await api(fq("FetchLeagueActivity", {league_id: L.meta.id, result_offset: off})); (r.items || []).forEach(x => items.push(x)); if (!r.resultOffsetNext) break; off = r.resultOffsetNext; } catch(e){ break; }
  }
  d.act = {at: Date.now(), items, pages: pages || 1};
  return items;
}
async function tradeBlock(L){
  if (L.meta.platform !== "flea") return {};
  const items = await fleaActivity(L, 3), out = {}, cutoff = Date.now() - 28 * 86400000;
  items.forEach(it => { const tb = it.tradeBlock; if (!tb || !tb.player || Number(it.timeEpochMilli) < cutoff) return; const id = String(tb.player.proPlayer.id); if (!out[id]) out[id] = {team: tb.team && tb.team.name, t: Number(it.timeEpochMilli)}; });
  return out;
}
const ORDN = r => r + (r === 1 ? "st" : r === 2 ? "nd" : r === 3 ? "rd" : "th");
function groupActivity(items){
  const out = [], trades = {};
  items.forEach(it => {
    const t = Number(it.timeEpochMilli) || 0;
    if (it.transaction) {
      const x = it.transaction, pp = x.player && x.player.proPlayer, team = x.team || {};
      if (x.type === "TRANSACTION_TRADE") {
        const g = trades[x.tradeId] = trades[x.tradeId] || {kind: "trade", t, sides: {}, id: x.tradeId};
        const s = g.sides[team.name] = g.sides[team.name] || [];
        s.push(pp ? pp.nameFull : x.draftPick ? x.draftPick.season + " " + ORDN(x.draftPick.round) : "?");
        if (!out.includes(g)) out.push(g);
      } else if (pp) out.push({kind: x.type === "TRANSACTION_DROP" ? "drop" : "add", t, team: team.name, p: pp});
    } else if (it.tradeBlock && it.tradeBlock.player) out.push({kind: "block", t, team: (it.tradeBlock.team || {}).name, p: it.tradeBlock.player.proPlayer});
    else if (it.reserveChange && it.reserveChange.player) out.push({kind: "ir", t, team: ((it.reserveChange.team || {}).name) || "", p: it.reserveChange.player.proPlayer});
  });
  return out.sort((a, b) => b.t - a.t);
}
async function renderActivity(L, el, me){
  const [items, review] = await Promise.all([fleaActivity(L, 2), api(fq("FetchTrades", {league_id: L.meta.id, filter: "TRADES_UNDER_REVIEW"})).catch(() => ({}))]);
  const rows = groupActivity(items);
  let h = "";
  const rv = (review.trades || []);
  if (rv.length) h += "<h3>Trades under review</h3>" + rv.map(t => '<div class="card" style="margin-bottom:10px">' + (t.teams || []).map(s => "<p class='small' style='margin:0 0 6px'><b>" + esc((s.team || {}).name) + "</b> gets " + esc((s.playersObtained || []).map(x => x.proPlayer.nameFull).concat((s.picksObtained || []).map(x => { const pk = x.draftPick || x; return pk.season + " " + ORDN((pk.slot || {}).round || pk.round); })).join(", ") || "nothing") + "</p>").join("") +
    (t.tentativeExecutionTime ? '<p class="small muted" style="margin:0">Goes through ' + new Date(Number(t.tentativeExecutionTime)).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}) + " unless " + (t.numVetoesRequired || "enough") + " owners veto.</p>" : "") +
    '<div class="actions">' + extBtn("https://www.fleaflicker.com/nfl/leagues/" + L.meta.id + "/trades/" + t.id, "Review or veto") + "</div></div>").join("");
  h += "<h3>League activity</h3>";
  const icon = {add: ["Added", "ok"], drop: ["Dropped", ""], block: ["Trade block", "warn"], ir: ["IR move", ""], trade: ["Trade", "ok"]};
  h += rows.length ? '<ul class="plist">' + rows.slice(0, 40).map(r => {
    if (r.kind === "trade") return '<li><div class="prow" style="grid-template-columns:46px 1fr"><span class="pos" data-pos="PICK">⇄</span><span class="pname" style="white-space:normal"><b>Trade</b>' + Object.entries(r.sides).map(([tm, got]) => "<small style='display:block'>" + esc(tm) + " gets " + esc(got.join(", ")) + "</small>").join("") + "<small>" + ago(r.t) + "</small></span></div></li>";
    const p = Object.assign({id: String(r.p.id), name: r.p.nameFull, pos: r.p.position, team: r.p.proTeamAbbreviation, img: r.p.headshotUrl || ""}, fleaExtras(null, r.p, L.meta.id));
    const [lab, tone] = icon[r.kind];
    return miniRow(p, '<span class="chip ' + tone + '" style="padding:4px 8px">' + lab + "</span>", posTag(p) + esc(r.team || "") + " · " + ago(r.t) + (r.kind === "block" && me && r.team !== me.name ? " · <b>shopping him</b>" : ""));
  }).join("") + "</ul>" : '<div class="card"><p class="small" style="margin:0">No recent activity.</p></div>';
  el.innerHTML = h;
  wireRows(el);
}

function negoCtx(ctx, me, them, give, get){

    "YOU ARE: " + them.name + (them.owner ? " (" + them.owner + ")" : "") + ", record " + them.w + "-" + them.l + ", " + ORDN(rank) + " of " + N + ", " + mode + ". Your weakest positions: " + needs.slice(0, 2).map(x => x.pos).join(" and ") + ".\n" +
    "THE USER: " + me.name + ", record " + me.w + "-" + me.l + ".\n" +

/* ---------- power rankings with schedule luck (all-play record) ---------- */
function powerTable(games, upto){
  const T = {}, wk = {};
  games.filter(g => !g.po && !g.cons && g.as != null && g.hs != null && g.wk <= upto).forEach(g => {
    [[g.a, g.as, g.hs], [g.h, g.hs, g.as]].forEach(([t, pf, pa]) => { const x = T[t.id] = T[t.id] || {id: t.id, name: t.name, logo: t.logo, w: 0, l: 0, t: 0, pf: 0, g: 0, scores: [], aw: 0, al: 0}; x.g++; x.pf += pf; x.scores.push({wk: g.wk, pf}); if (pf > pa) x.w++; else if (pf < pa) x.l++; else x.t++; (wk[g.wk] = wk[g.wk] || []).push({id: t.id, pf}); });
  });
  // All-play: how you'd do against every team every week.
  Object.values(wk).forEach(arr => arr.forEach(a => arr.forEach(b => { if (a === b) return; if (a.pf > b.pf) T[a.id].aw++; else if (a.pf < b.pf) T[a.id].al++; })));
  const xs = Object.values(T); if (!xs.length) return [];
  xs.forEach(x => { x.ppg = x.pf / x.g; x.last3 = x.scores.slice().sort((a, b) => b.wk - a.wk).slice(0, 3).reduce((s, y, _, a) => s + y.pf / a.length, 0); x.ap = x.aw + x.al ? x.aw / (x.aw + x.al) : 0; x.luck = (x.w + x.t / 2) - x.ap * x.g; });
  const z = k => { const m = xs.reduce((s, x) => s + x[k], 0) / xs.length, sd = Math.sqrt(xs.reduce((s, x) => s + (x[k] - m) ** 2, 0) / xs.length) || 1; xs.forEach(x => x["z" + k] = (x[k] - m) / sd); };
  ["ppg", "last3", "ap"].forEach(z);
  xs.forEach(x => x.power = 0.45 * x.zppg + 0.3 * x.zlast3 + 0.25 * x.zap);
  return xs.sort((a, b) => b.power - a.power);
}

/* ---------- league trade report card: every trade in the league, graded ---------- */
const lt = {};   // per-league state: {trades, total, next, loading, boards, year, team, sort}
const TR_LETTERS = [[1.5, "A+"], [1.3, "A"], [1.15, "A-"], [1.06, "B+"], [0.94, "B"], [0.87, "B-"], [0.77, "C"], [0.67, "D"], [0, "F"]];
const trLetter = r => TR_LETTERS.find(x => r >= x[0])[1];
const trTone = g => /^A/.test(g) ? "good" : /^[DF]/.test(g) ? "bad" : /^C/.test(g) ? "mid" : "";
const GP = {"A+": 4.3, A: 4, "A-": 3.7, "B+": 3.3, B: 3, "B-": 2.7, "C+": 2.3, C: 2, "C-": 1.7, D: 1, F: 0};
const gpaLetter = x => x >= 4.15 ? "A+" : x >= 3.85 ? "A" : x >= 3.5 ? "A-" : x >= 3.15 ? "B+" : x >= 2.85 ? "B" : x >= 2.5 ? "B-" : x >= 2.15 ? "C+" : x >= 1.85 ? "C" : x >= 1.5 ? "C-" : x >= 0.5 ? "D" : "F";
function ltState(L){ const k = L.meta.platform + ":" + L.meta.id; return lt[k] = lt[k] || {trades: [], total: null, next: 0, loading: false, boards: {}, team: "", sort: "new", year: null}; }

async function ltFleaPage(L, S, off){
  const r = await api("/api/flea-trades?league_id=" + L.meta.id + "&offset=" + off);
  if (S.total == null) S.total = r.total;
  return r;
}
// Load trades until we have everything from `year` (or `all`), a few pages at a time.
async function ltLoad(L, S, until){
  if (S.loading) return; S.loading = true;
  try {
    if (L.meta.platform === "sleeper") return await ltLoadSleeper(L, S, until);
    while (S.next != null) {
      const offs = []; for (let i = 0; i < 6 && S.next != null && (S.total == null || S.next + i * 10 < S.total); i++) offs.push(S.next + i * 10);
      if (!offs.length) { S.next = null; break; }
      const pages = await Promise.all(offs.map(o => ltFleaPage(L, S, o).catch(() => null)));
      let stop = false;
      for (const pg of pages) {
        if (!pg) { stop = true; break; }
        const seen = new Set(S.trades.map(t => t.id));
        pg.trades.forEach(t => { if (!seen.has(t.id)) S.trades.push(t); });
        if (!pg.trades.length || pg.next == null) { S.next = null; S.total = S.trades.length; stop = true; break; }
        S.next = pg.next;
      }
      if (S.onProgress) S.onProgress();
      if (stop) { if (S.next != null && pages.some(p => !p)) S.err = "Fleaflicker stopped answering partway through. Try again in a minute."; break; }
      const oldest = Math.min(...S.trades.map(t => t.t || Infinity));
      if (until !== "all" && oldest && new Date(oldest).getFullYear() < until) break;
    }
  } finally { S.loading = false; }
}
async function ltLoadSleeper(L, S, until){
  // Sleeper keeps one league per season; walk back through previous seasons as needed.
  S.sl = S.sl || {lid: L.meta.id, done: []};
  for (let guard = 0; guard < 8 && S.sl.lid; guard++) {
    const lg = await api("/api/sleeper/league/" + S.sl.lid).catch(() => null);
    if (!lg) { S.sl.lid = null; break; }
    const season = Number(lg.season) || 0;
    if (S.sl.done.includes(S.sl.lid)) { S.sl.lid = lg.previous_league_id && lg.previous_league_id !== "0" ? lg.previous_league_id : null; continue; }
    const weeks = await Promise.all(Array.from({length: 19}, (_, w) => api("/api/sleeper/league/" + S.sl.lid + "/transactions/" + w).catch(() => [])));
    const rosters = await api("/api/sleeper/league/" + S.sl.lid + "/rosters").catch(() => []), users = await api("/api/sleeper/league/" + S.sl.lid + "/users").catch(() => []);
    const uById = {}; (users || []).forEach(u => uById[u.user_id] = u);
    const tname = rid => { const ro = (rosters || []).find(r => r.roster_id === rid) || {}, u = uById[ro.owner_id] || {}; const cur = L.detail.teams.find(t => t.id === String(rid)); return {name: (u.metadata && u.metadata.team_name) || u.display_name || (cur && cur.name) || "Team " + rid, logo: u.avatar ? "https://sleepercdn.com/avatars/thumbs/" + u.avatar : (cur && cur.logo) || ""}; };
    weeks.flat().filter(x => x && x.type === "trade" && x.status === "complete").forEach(x => {
      if (S.trades.some(t => t.id === String(x.transaction_id))) return;
      S.trades.push({id: String(x.transaction_id), t: Number(x.status_updated || x.created || 0), sides: (x.roster_ids || []).map(rid => Object.assign({id: String(rid)}, tname(rid), {
        players: Object.entries(x.adds || {}).filter(([, r]) => r === rid).map(([pid]) => { const p = players[pid] || [pid, "", ""]; return {id: pid, name: p[0], pos: p[1], team: p[2]}; }),
        picks: (x.draft_picks || []).filter(pk => pk.owner_id === rid).map(pk => ({season: Number(pk.season), round: pk.round, slot: 0, overall: 0, from: tname(pk.roster_id).name}))
      }))});
    });
    S.sl.done.push(S.sl.lid);
    S.sl.lid = lg.previous_league_id && lg.previous_league_id !== "0" ? lg.previous_league_id : null;
    S.total = S.sl.lid ? null : S.trades.length;
    if (S.onProgress) S.onProgress();
    if (until !== "all" && season <= until) break;
  }
  if (!S.sl.lid) S.next = null;
  S.loading = false;
}

// What a traded pick is worth today: the player it became, or the market price of that pick.
async function ltBoards(L, S, seasons){
  if (L.meta.platform !== "flea") return;
  const need = [...new Set(seasons)].filter(y => y && y <= new Date().getFullYear() && !(y in S.boards));
  await Promise.all(need.map(async y => {
    try { const b = await draftBoard(L, y); const m = {byTeam: {}}; b.forEach(s => { if (!s.player) return; const x = Object.assign({}, s.player, {round: s.round, slot: s.slot}); m[s.overall] = x; const k = s.team.id + ":" + s.round; (m.byTeam[k] = m.byTeam[k] || []).push(x); }); S.boards[y] = m; }
    catch(e){ S.boards[y] = {}; }
  }));
}
function ltValuer(L, S, V, flea, prem, nTeams){
  const pv = p => { const k = L.meta.platform === "sleeper" ? String(p.id) : flea ? "f" + p.id : sleeperKey(L, p); return ((V[k] || [0])[0] || 0) * (p.pos === "QB" ? prem : 1); };
  const pickSeasons = Object.keys(V).filter(k => /^pick:\d{4} 1st$/.test(k)).map(k => Number(k.slice(5, 9))).sort();
  const pk = (x, owner) => {
    const bd = S.boards[x.season];
    // Older picks often have no slot; if the team that got it made exactly one pick in that round, that's the player.
    const byTeam = !x.overall && bd && owner && bd.byTeam && bd.byTeam[owner + ":" + x.round];
    const drafted = (x.overall && bd && bd[x.overall]) || (byTeam && byTeam.length === 1 ? byTeam[0] : null);
    if (drafted && !x.overall) return {v: pv(drafted), label: x.season + " " + drafted.round + "." + String(drafted.slot).padStart(2, "0") + " → " + drafted.name, drafted};
    if (drafted) { const v = pv(drafted); return {v, label: x.season + " " + x.round + "." + String(x.slot).padStart(2, "0") + " → " + drafted.name, drafted}; }
    const yr = pickSeasons.length ? Math.min(Math.max(x.season, pickSeasons[0]), pickSeasons[pickSeasons.length - 1]) : x.season;
    const rd = Math.min(4, x.round || 4), tier = x.slot && nTeams ? (x.slot <= nTeams / 3 ? " (Early)" : x.slot <= nTeams * 2 / 3 ? " (Mid)" : " (Late)") : "";
    let v = ((V["pick:" + yr + " " + ORD[rd] + tier] || V["pick:" + yr + " " + ORD[rd]] || [0])[0]) || 0;
    if ((x.round || 0) > 4) v *= Math.pow(0.6, x.round - 4);
    return {v, label: x.season + " " + (x.slot ? x.round + "." + String(x.slot).padStart(2, "0") : ORDN(x.round) + " round") + (x.from ? " (" + x.from + ")" : "")};
  };
  return {pv, pk};
}
const trEff = vals => vals.slice().sort((a, b) => b - a).reduce((s, v, i) => s + v * Math.max(0.4, 1 - 0.15 * i), 0);
function ltGrade(t, val){
  const sides = t.sides.map(s => {
    const items = s.players.map(p => ({name: p.name, pos: p.pos, team: p.team, v: val.pv(p), p})).concat(s.picks.map(x => { const r = val.pk(x, s.id); return {name: r.label, pos: "PICK", v: r.v}; })).sort((a, b) => b.v - a.v);
    return {s, items, raw: items.reduce((a, b) => a + b.v, 0), eff: trEff(items.map(i => i.v))};
  });
  const n = sides.length;
  sides.forEach(sd => {
    const given = n === 2 ? sides.find(x => x !== sd) : null;
    const gEff = given ? given.eff : sides.filter(x => x !== sd).reduce((a, b) => a + b.eff, 0) / Math.max(1, n - 1);
    sd.gaveRaw = given ? given.raw : sides.filter(x => x !== sd).reduce((a, b) => a + b.raw, 0) / Math.max(1, n - 1);
    // Small trades can't be a fleecing: shrink the gap when little value changed hands.
    const m = Math.max(0.25, Math.min(1, Math.max(sd.eff, gEff) / 3000));
    sd.ratio = Math.exp(Math.log((sd.eff + 300) / (gEff + 300)) * m);
    sd.letter = trLetter(sd.ratio); sd.net = sd.raw - sd.gaveRaw;
  });
  if (sides.every(sd => sd.raw < 250)) { sides.forEach(sd => sd.letter = "–"); return {t, sides, verdict: "Both sides have faded", gap: 1, top: null, tone: "", faded: true}; }
  const best = sides.slice().sort((a, b) => b.ratio - a.ratio)[0], gap = best.ratio;
  const top = sides.flatMap(sd => sd.items.map(i => Object.assign({side: sd}, i))).sort((a, b) => b.v - a.v)[0];
  const swing = Math.max(0, best.net);
  const lvl = gap < 1.06 ? 0 : gap < 1.3 || swing < 1200 ? 1 : gap < 1.6 || swing < 2500 ? 2 : 3;
  const verdict = [ "Fair trade", best.s.name + " wins", best.s.name + " won big", "Fleeced: " + best.s.name + " robbed " + (n === 2 ? sides.find(x => x !== best).s.name : "the others")][lvl];
  return {t, sides, verdict, gap, swing, top, tone: ["", "", "mid", "bad"][lvl]};
}

/* paste a trade email to grade it */
function parseTradeText(text, d, me){
  const lines = String(text || "").split(/\n/).map(x => x.replace(/^[\s*•\-]+/, "").trim()).filter(x => / gets:/.test(x));
  const sides = lines.map(x => { const i = x.indexOf(" gets:"); return {team: x.slice(0, i).trim(), items: x.slice(i + 6).split(/[;,]\s*/).map(s => s.trim()).filter(Boolean)}; });
  const nm = s => norm(String(s).replace(/[’]/g, "'"));
  const findTeam = name => d.teams.find(t => nm(t.name) === nm(name)) || d.teams.find(t => nm(t.name).startsWith(nm(name).slice(0, 8)));
  const res = sides.map(s => ({s, t: findTeam(s.team)}));
  if (res.length !== 2) return {error: res.length > 2 ? "Only two-team trades can be graded." : "Paste the lines that say “Team gets: …” from the trade email."};
  if (res.some(r => !r.t)) return {error: "Couldn’t match a team name: " + res.filter(r => !r.t).map(r => r.s.team).join(", ")};
  const mine = res.find(r => r.t === me); if (!mine) return {error: "This trade doesn’t include your team."};
  const other = res.find(r => r !== mine);
  return {other: other.t, myGets: mine.s.items, theyGet: other.s.items};
}
function matchItems(items, roster, picks){
  const ids = [], miss = [];
  items.forEach(it => {
    const pk = it.match(/^(\d{4})\s+(\d)(?:st|nd|rd|th)\s+round/i);
    if (pk) {
      const orig = (it.match(/\(([^)]+)\)/) || [])[1];
      const cands = picks.filter(p => p.id.split(":")[1] === pk[1] && String(p.round) === pk[2]);
      const hit = (orig && cands.find(p => norm(p.name).includes(norm(orig.replace(/\.\.$/, ""))))) || cands[0];
      if (hit) ids.push(hit.id); else miss.push(it);
      return;
    }
    const m = it.replace(/\s+(jr|sr|ii|iii|iv)\.?$/i, "").match(/^([A-Za-z])\.?\s+(.+)$/);
    const last = m ? norm(m[2]) : norm(it), first = m ? m[1].toLowerCase() : null;
    const hit = roster.find(p => { const parts = String(p.name).replace(/\s+(Jr\.?|Sr\.?|II|III|IV)$/i, "").split(" "); return norm(parts.slice(1).join(" ")) === last && (!first || parts[0].toLowerCase().startsWith(first)); }) || roster.find(p => norm(p.name) === norm(it));
    if (hit) ids.push(hit.id); else miss.push(it);
  });
  return {ids, miss};
}

const ed = {sub: "week", league: null};
function edgeReady(){ return leagues.map((L, i) => ({L, i})).filter(x => x.L.detail && x.L.detail.teams.find(t => t.mine)); }
function ensureSidIndex(){
  if (!sidIndex && players) { sidIndex = {}; for (const id in players) { const q = players[id]; const k = norm(q[0]) + "|" + q[1]; if (!sidIndex[k]) sidIndex[k] = id; } }
}
function sleeperKey(L, p){
  if (L.meta.platform === "sleeper") return String(p.id);
  ensureSidIndex();

}
function scoringCol(L){ return L.meta.platform === "sleeper" ? ({ppr:0, half:1, std:2}[L.detail.scoring] ?? 0) : 0; }
let projMap = null, projP = null;
function getProj(){
  if (!projP) projP = (async () => { const st = await getState(); try { projMap = await api("/api/proj?season=" + (st.league_season || st.season) + "&week=" + (st.display_week || st.week)); } catch(e){ projMap = {}; } return projMap; })();

function projFor(L, p){

function edgeSlots(L){
  const d = L.detail;
  return leagueSlots(L).concat(d.kdst || (d.slots || []).filter(x => x === "K" || x === "DEF"));
}
const slotOk = (slot, pos) => (FLEX[slot] || [slot]).includes(pos) || (slot === "DEF" && pos === "D/ST") || (slot === "D/ST" && pos === "DEF");
function gameState(team){ const g = team && nflGames[tnorm(team)]; return g ? g.state : (gamesAt ? "bye" : null); }
const isLocked = p => { const s = gameState(p.team); return s === "in" || s === "post"; };
function optimize(roster, slots, pj){
  const open = slots.slice(), list = [];
  roster.filter(p => p.slot === "start" && isLocked(p)).forEach(p => {
    let i = open.findIndex(s => s === p.pos || (s === "DEF" && p.pos === "D/ST"));
    if (i < 0) i = open.findIndex(s => slotOk(s, p.pos));
    if (i >= 0) { list.push({slot: open[i], p, v: pj(p), locked: true}); open.splice(i, 1); }
  });
  const pool = roster.filter(p => p.slot !== "ir" && !isLocked(p) && !OUTISH_C.test(String(p.inj || ""))).map(p => ({p, v: pj(p)})).sort((a, b) => b.v - a.v);
  const used = new Set();
  const order = open.filter(s => !FLEX[s]).concat(open.filter(s => FLEX[s]));
  for (const slot of order) {
    const pick = pool.find(x => !used.has(x.p) && slotOk(slot, x.p.pos));
    if (pick) used.add(pick.p);
    list.push({slot, p: pick ? pick.p : null, v: pick ? pick.v : 0});
  }
  return {list, total: list.reduce((s, x) => s + x.v, 0)};
}
function impliedTotal(team){
  const t = tnorm(team), g = nflGames[t]; if (!g || g.ou == null) return null;
  const m = String(g.line || "").match(/^([A-Z]{2,3})\s*(-?[\d.]+)/);
  let s = 0, fav = null; if (m) { fav = tnorm(m[1]); s = Math.abs(Number(m[2])) || 0; }
  return g.ou / 2 + (fav ? (fav === t ? s / 2 : -s / 2) : 0);
}
function envChips(team){
  const t = tnorm(team), g = nflGames[t]; if (!g) return gamesAt ? '<span class="chip">Bye</span>' : "";

  return out.join("");
}

const WEAK = {QB:15, RB:10, WR:10, TE:7, FLEX:9, SUPER_FLEX:15, REC_FLEX:9, WRRB_FLEX:9};
async function faPool(L, pos){
  const d = L.detail;
  if (L.meta.platform === "flea") {
    const r = await api(fq("FetchPlayerListing", {league_id: L.meta.id, "filter.free_agent_only": "true", sort: "SORT_PROJECTIONS", "filter.position.eligibility": pos}));
    return (r.players || []).map(x => {
      const p = x.proPlayer || {}, inj = p.injury || null, rg = (x.requestedGames || [])[0] || {};
      return {id: String(p.id), name: p.nameFull, pos: p.position, team: p.proTeamAbbreviation, img: p.headshotUrl || "",
        inj: inj ? (inj.typeAbbreviaition || inj.typeAbbreviation || inj.typeFull) : null, injPart: inj ? (inj.description || inj.typeFull) : null,
        proj: val(x.viewingProjectedPoints) ?? val(rg.pointsProjected), avg: val(x.seasonAverage), tot: val(x.seasonTotal), ...fleaExtras(x, p, L.meta.id)};
    });
  }
  const taken = new Set(); d.teams.forEach(t => t.roster.forEach(p => taken.add(String(p.id))));
  const out = [];
  for (const id in players) { const q = players[id]; if (q[1] !== pos || taken.has(id) || !q[2]) continue; const r = projMap && projMap[id]; if (!r) continue;
    out.push({id, name: q[0], pos: q[1], team: q[2], inj: q[3], injPart: q[4], proj: r[scoringCol(L)]}); }
  return out.sort((a, b) => (b.proj || 0) - (a.proj || 0)).slice(0, 25);
}
function rosteredSet(L){
  const s = new Set(); L.detail.teams.forEach(t => t.roster.forEach(p => { s.add(norm(p.name) + "|" + (p.pos || "")); if (L.meta.platform === "sleeper") s.add("id:" + p.id); })); return s;
}
async function edgeWaivers(L, el){
  const d = L.detail, me = d.teams.find(t => t.mine);
  const st = await getState();
  await Promise.all([getPlayers(), getProj(), getSeasonStats(L.meta.season || st.league_season), gamesAt ? null : loadScoreboard(), rosterFor(L, me)]);
  ensureSidIndex();
  const pj = p => { const v = projFor(L, p); return v == null ? 0 : v; };
  const opt = optimize(me.roster, edgeSlots(L), pj);
  const weakSlots = opt.list.filter(x => WEAK[x.slot] != null && (!x.p || x.v < WEAK[x.slot]));
  const need = [...new Set(weakSlots.flatMap(x => FLEX[x.slot] || [x.slot]))];
  let h = "";
  const bidC = [];
  // 1. upgrades for weak spots
  h += '<h3 style="margin-top:6px">Upgrades for your weak spots</h3>';
  if (!weakSlots.length) h += '<div class="card"><p class="small" style="margin:0">Every starting spot projects above a typical starter this week. Use your bench spots on the stashes below.</p></div>';
  else {
    const pools = {}; await Promise.all(need.map(async pos => { try { pools[pos] = await faPool(L, pos); } catch(e){ pools[pos] = []; } }));
    const used = new Set(), cards = [];
    for (const x of weakSlots.sort((a, b) => a.v - b.v)) {

/* ---------- Edge: League outlook + intel ---------- */
async function getSchedule(L){
  const d = L.detail; if (d.sched) return d.sched;
  const st = await getState(), cw = d.week || st.display_week || st.week;
  let po = {teams: null, start: null};
  if (L.meta.platform === "sleeper") po = {teams: d.playoffTeams, start: d.playoffStart};
  else { try { po = await api("/api/flea-playoffs?league_id=" + L.meta.id); } catch(e){} }
  po.teams = po.teams || (d.teams.length >= 12 ? 6 : 4); po.start = po.start || 15;
  const ws = []; for (let w = cw; w < po.start; w++) ws.push(w);
  const weeks = await Promise.all(ws.map(async w => {
    try {
      if (L.meta.platform === "flea") {
        const b = await api(fq("FetchLeagueScoreboard", {league_id: L.meta.id, scoring_period: w}));
        return {w, games: (b.games || []).map(g => [String((g.away || {}).id), String((g.home || {}).id), val((g.awayScore || {}).projected), val((g.homeScore || {}).projected)])};
      }
      const m = await api("/api/sleeper/league/" + L.meta.id + "/matchups/" + w), grp = {};
      (m || []).forEach(x => { if (x.matchup_id) (grp[x.matchup_id] = grp[x.matchup_id] || []).push(String(x.roster_id)); });
      return {w, games: Object.values(grp).filter(x => x.length === 2).map(x => [x[0], x[1], null, null])};
    } catch(e){ return {w, games: []}; }
  }));
  d.sched = {weeks, po, cw};
  return d.sched;
}
function simulate(d, sched, boostId, boost, n){
  n = n || 3000;
  const T = d.teams, N = T.length, idx = {}; T.forEach((t, i) => idx[t.id] = i);
  const gp = t => Math.max(1, (t.w || 0) + (t.l || 0) + (t.t || 0));
  const pnow = {}; (sched.weeks[0] ? sched.weeks[0].games : []).forEach(g => { if (g[2]) pnow[g[0]] = g[2]; if (g[3]) pnow[g[1]] = g[3]; });
  const mean = T.map(t => { const a = (t.pf || 0) / gp(t), p = pnow[t.id]; return (p ? 0.5 * a + 0.5 * p : a) + (t.id === boostId ? boost : 0); });
  const P = Math.min(sched.po.teams, N), divs = {}; T.forEach((t, i) => { if (t.div != null) (divs[t.div] = divs[t.div] || []).push(i); });

  const make = new Array(N).fill(0), wins = new Array(N).fill(0), slot = new Array(N).fill(0), seed = new Array(N).fill(0);
  const rn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  for (let s = 0; s < n; s++) {
    const W = T.map(t => (t.w || 0) + (t.t || 0) / 2), PF = T.map(t => t.pf || 0);
    for (const wk of sched.weeks) for (const g of wk.games) {
      const a = idx[g[0]], b = idx[g[1]]; if (a == null || b == null) continue;
      const sa = mean[a] + 24 * rn(), sb = mean[b] + 24 * rn();
      PF[a] += sa; PF[b] += sb; if (sa > sb) W[a]++; else W[b]++;
    }
    const order = T.map((_, i) => i).sort((x, y) => (W[y] - W[x]) || (PF[y] - PF[x]));
    let seeds;
    if (useDivs) { const winners = Object.values(divs).map(m => m.slice().sort((x, y) => order.indexOf(x) - order.indexOf(y))[0]).sort((x, y) => order.indexOf(x) - order.indexOf(y)); seeds = winners.concat(order.filter(i => !winners.includes(i)).slice(0, P - winners.length)); }
    else seeds = order.slice(0, P);
    seeds.forEach((i, k) => { make[i]++; seed[i] += k + 1; });
    order.slice().reverse().forEach((i, k) => slot[i] += k + 1);
    order.forEach(i => wins[i] += W[i]);
  }
  return T.map((t, i) => ({t, odds: make[i] / n, wins: wins[i] / n, slot: slot[i] / n, seed: make[i] ? seed[i] / make[i] : null, mean: mean[i]}));
}

let allowedP = null;
async function allowedTable(season, upto){
  if (!allowedP) allowedP = (async () => {
    const weeks = []; for (let w = Math.max(1, upto - 8); w < upto; w++) weeks.push(w);
    const res = await Promise.all(weeks.map(w => api("/api/allowed?season=" + season + "&week=" + w).catch(() => null)));
    const sum = {}, n = {};
    res.forEach(r => { if (!r) return; for (const t in r.teams) for (const pos in r.teams[t]) { const k = t + "|" + pos; sum[k] = (sum[k] || [0, 0, 0]).map((x, i) => x + r.teams[t][pos][i]); n[k] = (n[k] || 0) + 1; } });
    const avg = {}; for (const k in sum) avg[k] = sum[k].map(x => x / n[k]);
    return avg;
  })();
  return allowedP;
}

// How a player's production holds up with age, relative to now (1.0 = same).
function ageFactor(pos, age){
  if (!age) return 0.95;
  if (pos === "RB") return age <= 24 ? 1.05 : age <= 25 ? 1.0 : age <= 26 ? 0.95 : age <= 27 ? 0.88 : age <= 28 ? 0.78 : age <= 29 ? 0.68 : 0.55;
  if (pos === "WR") return age <= 23 ? 1.1 : age <= 25 ? 1.05 : age <= 28 ? 1.0 : age <= 29 ? 0.95 : age <= 30 ? 0.88 : age <= 31 ? 0.8 : 0.7;
  if (pos === "TE") return age <= 24 ? 1.1 : age <= 26 ? 1.05 : age <= 29 ? 1.0 : age <= 30 ? 0.93 : age <= 31 ? 0.85 : 0.75;
  if (pos === "QB") return age <= 24 ? 1.08 : age <= 32 ? 1.0 : age <= 34 ? 0.94 : age <= 36 ? 0.86 : age <= 38 ? 0.76 : 0.65;
  return 0.9;
}
async function keepersFor(L, me){
  if (L.meta.platform === "sleeper") return {max: L.detail.maxKeepers || null, kept: new Set((me.keepers || []).map(String))};
  if (L.meta.platform !== "flea") return {max: L.detail.maxKeepers || null, kept: new Set(me.roster.filter(p => p.keeper).map(p => String(p.id)))};
  try { const r = await api("/api/flea-keepers?league_id=" + L.meta.id + "&team_id=" + me.id); return {max: r.max, kept: new Set((r.kept || []).map(String))}; }
  catch(e){ return {max: null, kept: new Set()}; }
}
function keeperScores(L, roster, V, vkey, prem){
  return roster.map(p => {
    const r = V[vkey(p)] || [], age = r[6], dyn = (r[0] || 0), red = (r[7] || 0);
    const qb = p.pos === "QB" ? prem : 1;
    // Next-season basis: blend this-season and dynasty value; backups and injured players have no this-season value, so use dynasty.
    const basis = red > 0 ? 0.5 * red + 0.5 * dyn : dyn;
    const y1 = basis * ageFactor(p.pos, age ? age + 1 : null) * qb, y2 = basis * ageFactor(p.pos, age ? age + 2 : null) * qb;
    const score = p.pos === "K" || p.pos === "D/ST" || p.pos === "DEF" ? 0 : 0.5 * dyn * qb + 0.3 * y1 + 0.2 * y2;
    return {p, age, dyn: dyn * qb, red: red * qb, basis: basis * qb, y1, y2, score, trend: r[3] || 0};
  }).sort((a, b) => b.score - a.score);
}
function keeperWhy(x, rank, N){
  const p = x.p, a = x.age;
  if (p.pos === "K" || p.pos === "D/ST" || p.pos === "DEF") return "Kickers and defenses are easy to replace each year, so a keeper spot is better used on a player.";
  if (x.dyn < 300) return "Very little trade value (" + fmtV(x.dyn) + "). A rookie pick or free agent can fill this spot.";
  const bits = [];
  if (p.pos === "QB" && x.qbBoost) bits.push("QBs are scarce in your league, every starting QB is rostered");
  if (a) {
    if (p.pos === "RB" && a >= 27) bits.push("RB turning " + Math.ceil(a + 1) + " next year, when production usually drops");
    else if (a <= 24) bits.push("only " + a + ", with his best years ahead");
    else if ((p.pos === "WR" && a >= 30) || (p.pos === "QB" && a >= 35) || (p.pos === "TE" && a >= 31)) bits.push("age " + a + ", likely past his peak by next season");
  }
  if (x.trend >= 500) bits.push("value up " + fmtV(x.trend) + " in 30 days");
  else if (x.trend <= -500) bits.push("value down " + fmtV(-x.trend) + " in 30 days");
  if (x.y2 < x.basis * 0.8 && x.basis > 1000) bits.push("projected to lose about " + Math.round((1 - x.y2 / x.basis) * 100) + "% of his value over two seasons");
  if (!bits.length) bits.push(rank <= N ? "solid value for the next two seasons" : "low value for a keeper spot");
  const s = bits.join("; ");
  return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}
