    '<label class="toggle"><input type="checkbox" id="alBrief"' + (prefs.brief ? " checked" : "") + "> Sunday pregame briefing at 11 AM ET: start/sit calls, risky starters and the best pickup</label>" +
    '<div class="seg" role="group" aria-label="Free agent positions"><button type="button" data-fp="ALL" aria-pressed="' + (prefs.faPos === "ALL") + '">All positions</button><button type="button" data-fp="QB" aria-pressed="' + (prefs.faPos === "QB") + '">QBs only</button></div></div>';
  h += '<div class="btnrow"><button class="btn ghost" id="alTest">Send a test alert</button><button class="btn ghost" id="alOff">Turn off</button></div>';
  if (alertState.msg) h += '<p class="small" style="margin:8px 0 0">' + esc(alertState.msg) + "</p>";
  h += briefCard(!!alertState.sub) + hooksCard() + calCard();
  h += '<h3>Recent alerts</h3><div id="alList"><p class="spin">Loading…</p></div>';
  v.innerHTML = h;
  wireHooks(v); wireCopy(v); wireBrief(v);
  const savePrefs = async p => { saveAlertPrefs(p); alertState.msg = ""; try { await syncAlerts(sub); } catch(e){ alertState.msg = e.message; } render(); };
  v.querySelector("#alMine").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {mine:e.target.checked})));
  v.querySelector("#alFa").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {fa:e.target.checked})));
  v.querySelector("#alLeague").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {league:e.target.checked})));
  v.querySelector("#alNews").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {news:e.target.checked})));
  v.querySelector("#alBrief").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {brief:e.target.checked})));
  v.querySelector("#alPreview").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {preview:e.target.checked})));
  v.querySelectorAll("[data-fp]").forEach(b => b.addEventListener("click", () => savePrefs(Object.assign(alertPrefs(), {faPos:b.dataset.fp}))));
  v.querySelector("#alTest").addEventListener("click", async e => {
    e.target.disabled = true; e.target.textContent = "Sending…";
    try { await syncAlerts(sub); await post("/api/push/test", {endpoint: sub.endpoint}); alertState.msg = "Test sent. It should show up on this phone in a few seconds."; }
    catch(err){ alertState.msg = err.message; }
    render();
  });
  v.querySelector("#alOff").addEventListener("click", async () => {
    try { await post("/api/push/unsubscribe", {endpoint: sub.endpoint}); } catch(e){}
    try { await sub.unsubscribe(); } catch(e){}
    alertState.msg = ""; render();
  });
  try {
    const r = await api("/api/push/alerts?e=" + encodeURIComponent(sub.endpoint));
    const list = r.alerts || [], el = $("#alList"); if (!el) return;
    el.innerHTML = list.length ? '<div class="news card" style="padding:0">' + list.map(a => (a.url ? '<a class="alitem" href="' + esc(a.url) + '" target="_blank" rel="noopener">' : '<div class="alitem">') + "<b>" + esc(a.title) + "</b><span" + (a.full ? ' class="alfull"' : "") + ">" + esc(a.full || a.body) + "</span><small>" + fmtWhen(a.t) + (a.url ? " · Read the story" : "") + "</small>" + (a.url ? "</a>" : "</div>")).join("") + "</div>" : '<p class="muted small">Nothing yet. You’ll see every alert here too.</p>';
  } catch(e){ const el = $("#alList"); if (el) el.innerHTML = '<div class="err">Couldn’t load your alerts: ' + esc(e.message) + "</div>"; }
}
if (pushOK) navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.open === "alerts") setTab("alerts"); });

/* ---------- install as an app ---------- */
let installEvt = null;
const isInstalled = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch(e){ return false; } };
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if (cur.tab === "leagues" && cur.league == null) render(); });
window.addEventListener("appinstalled", () => { installEvt = null; render(); });
function installCard(){
  if (isInstalled() || !installEvt) return "";
  return '<div class="card install"><img src="/icon-192.png" alt=""><div><b>Get the Snap Count app</b><span>Its own icon, full screen, and alerts.</span></div><button class="btn" id="installBtn">Install</button></div>';
}
function wireInstall(v){
  const b = v.querySelector("#installBtn"); if (!b) return;
  b.addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch(e){} installEvt = null; render(); });
}
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));

/* ---------- boot ---------- */
let pendingJoin = null;
try {
  const j = new URLSearchParams(location.search).get("join");
  const m = j && j.match(/^(flea|espn|mfl):(\d{3,12})$/);
  if (m) {
    pendingJoin = m[1] + ":" + m[2];
    if (m[1] === "flea" && !accts.flea.some(a => a.type === "league" && a.value === m[2])) accts.flea.push({type:"league", value:m[2]});
    if (m[1] !== "flea" && !accts[m[1]].some(a => a.id === m[2])) accts[m[1]].push({id:m[2]});
    saveAccts(accts);
    history.replaceState(null, "", location.pathname);
  }
} catch(e){}
accts.flea.forEach(a => { if (a.type === "league") a.team = fleaTeamFor(a.value); });
if (location.hash === "#alerts") { cur.tab = "alerts"; try { history.replaceState(null, "", location.pathname); } catch(e){} try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch(e){} }
let goCoach = false;
try { const go = new URLSearchParams(location.search).get("go"); if (["news", "trade", "edge", "alerts"].includes(go)) cur.tab = go; if (go === "coach") goCoach = true; if (go) history.replaceState(null, "", location.pathname); } catch(e){}
document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === cur.tab));
document.addEventListener("visibilitychange", () => { if (!document.hidden) try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch(e){} });
render();
async function refreshLive(){
  if (document.hidden || !$("#sheet").hidden || document.activeElement && document.activeElement.tagName === "SELECT") return;
  await loadScoreboard();
  if (Date.now() - injAt > 5 * 60000) { await loadInjuries(); if (cur.tab === "leagues" && (cur.sub || "team") !== "fa" && $("#sheet").hidden) render(); }
  if (!anyLive() || cur.tab !== "leagues") return;
  const targets = cur.league != null ? [leagues[cur.league]] : leagues;
  await Promise.all(targets.filter(Boolean).map(async L => {
    try {
      const keep = L.detail && L.detail.teams.find(t => t.mine || t.id === cur.team);
      const fresh = await detailFor(L.meta);
      if (keep) { const nt = fresh.teams.find(t => t.id === keep.id); if (nt && L.meta.platform === "flea") await fleaTeamRoster(L, nt); }
      L.detail = fresh;
    } catch(e){}
  }));
  if (cur.tab === "leagues" && (cur.sub || "team") !== "fa") render();
}
setInterval(refreshLive, 60000);
$("#coachFab").addEventListener("click", openCoach);
if (goCoach) { const t = setInterval(() => { if (leagues.some(L => L.detail)) { clearInterval(t); openCoach(); } }, 400); setTimeout(() => clearInterval(t), 30000); }
if (hasAccts()) loadAll(); else getState().then(st => $("#wk").textContent = "Week " + (st.display_week || st.week)).catch(() => {});
</script>
</body>
</html>
