<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Snap Count</title>
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column, sticky team bar, cards only for leagues and matchups */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#14202b; --muted:#5d6872; --line:#dde1dc;
  --accent:#d99a00; --accent-ink:#14202b; --field:#2f6b4f;
  --ok:#2f6b4f; --warn:#b87400; --bad:#b3261e;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10181f; --surface:#18232d; --ink:#e9ece8; --muted:#97a3ad; --line:#2a3743;
  --accent:#f0b429; --accent-ink:#10181f; --field:#5fb28a;
  --ok:#5fb28a; --warn:#f0b429; --bad:#ff7a6e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;border-bottom:3px solid var(--ink)}
.brand{font:700 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;display:flex;align-items:baseline;gap:8px}
.brand span{background:var(--accent);color:var(--accent-ink);padding:0 6px;border-radius:2px}
.wk{white-space:nowrap;font:600 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:10px 14px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.icon{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-weight:600;font-size:14px}
nav.tabs{display:flex;gap:4px;margin:14px 0 6px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 7px;font:600 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
h2{font:700 22px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px;text-wrap:balance}
h3{font:600 15px/1 var(--display);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 0 6px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.league{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.league .row1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.league .name{font:700 20px/1.1 var(--display);text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.badge{font:600 12px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:4px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.score{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-variant-numeric:tabular-nums}
.score .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .p{font:700 22px/1.1 var(--display);text-align:right}
.score .me{font-weight:700}
.lead{color:var(--ok)}
.muted{color:var(--muted)}
.small{font-size:14px}
.plist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.plist li{border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.prow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;width:100%;background:none;border:0;text-align:left;padding:10px 12px}
.pos{font:700 15px/1 var(--display);letter-spacing:.06em;text-align:center;padding:5px 0;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.pname{min-width:0}
.pname b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname small{color:var(--muted);font-size:13px}
.pts{font:700 19px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.inj{display:inline-block;font:700 12px/1 var(--display);letter-spacing:.06em;padding:3px 5px;border-radius:3px;margin-left:6px;vertical-align:1px;color:#14202b;background:var(--warn)}
.inj.bad{background:var(--bad);color:#fff}
.inj.ok{background:var(--ok)}
form.add{display:flex;flex-direction:column;gap:10px}
label{font-weight:600;font-size:14px}
input,select{font:inherit;width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acct{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.acct:first-child{border-top:0}
.err{border-left:4px solid var(--bad);background:var(--surface);padding:10px 12px;border-radius:4px;font-size:14px}
.news a{color:var(--ink);text-decoration:none;display:block;padding:12px;border-top:1px solid var(--line)}
.news a:first-child{border-top:0}
.news a b{display:block;line-height:1.3}
.news a small{color:var(--muted)}
.news a:hover b{text-decoration:underline}
.mine{background:color-mix(in srgb,var(--accent) 18%,transparent);border-radius:3px;padding:0 3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:13px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.free{border-color:var(--ok);color:var(--ok);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.back{background:none;border:0;padding:6px 0;font:600 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.spin{color:var(--muted);padding:18px 0;font-style:italic}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 10px}
.toggle input{width:auto}
.seg.sub{margin-top:4px}
.posf{margin:12px 0 0}
.chip{background:none;font:inherit;font-size:13px}
button.chip{cursor:pointer;padding:5px 11px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.live{color:#fff;background:var(--bad);font:700 11px/1 var(--display);letter-spacing:.08em;padding:2px 4px;border-radius:3px}
.avg{display:flex;flex-direction:column;align-items:flex-end;font:600 16px/1 var(--display);color:var(--muted)}
.avg small{font:600 10px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase}
.statrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:14px}
.statrow div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.statrow small{display:block;color:var(--muted);font-size:12px}
.statrow b{font:700 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.hright{display:flex;align-items:center;gap:10px}
.bell{background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.bell[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ticks{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.alstat{display:flex;align-items:center;gap:8px}
.alstat .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.stackc{display:flex;flex-direction:column;gap:2px}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.alitem{display:flex;flex-direction:column;gap:2px;padding:12px;border-top:1px solid var(--line)}
.alitem:first-child{border-top:0}
.alitem span{font-size:14px}
.alitem small{color:var(--muted);font-size:12px}
footer{margin-top:28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 class="brand">Snap <span>Count</span></h1>
    <div class="hright"><div class="wk" id="wk"></div><button class="bell" id="bellBtn" aria-label="Alerts" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15L6 17Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="leagues" aria-selected="true">My Leagues</button>
    <button role="tab" data-tab="news" aria-selected="false">Headlines</button>
    <button role="tab" data-tab="trending" aria-selected="false">Trending</button>
    <button role="tab" data-tab="accounts" aria-selected="false">Accounts</button>
  </nav>
  <main id="view"></main>
  <footer>Live data from Sleeper and Fleaflicker. Headlines from ESPN and Google News, linked to the original articles.</footer>
</div>
<div id="sheet" class="sheet" hidden><div class="panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (n == null || isNaN(n)) ? "–" : Number(n).toFixed(2);
const norm = s => String(s || "").toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b/g, "").replace(/[^a-z]/g, "");

/* ---------- storage ---------- */
const KEY = "snapcount.v1";
function loadAccts(){ try { return JSON.parse(localStorage.getItem(KEY)) || {sleeper:[], flea:[]}; } catch(e){ return {sleeper:[], flea:[]}; } }
function saveAccts(a){ try { localStorage.setItem(KEY, JSON.stringify(a)); } catch(e){} }
let accts = loadAccts();

/* ---------- api ---------- */
async function api(path){
  const r = await fetch(path);
  if (!r.ok) { let t = ""; try { t = (await r.json()).error; } catch(e){} throw new Error(t || ("Request failed (" + r.status + ")")); }
  return r.json();
}
let nflState = null, players = null, playersP = null;
async function getState(){ if (!nflState) nflState = await api("/api/sleeper/state/nfl"); return nflState; }
function getPlayers(){ if (!playersP) playersP = api("/api/players").then(p => (players = p)); return playersP; }

/* ---------- injury ---------- */
function injChip(code){
  if (!code) return "";
  const c = String(code).toUpperCase();
  const map = {QUESTIONABLE:"Q", DOUBTFUL:"D", OUT:"O", "INJURED RESERVE":"IR", SUSPENDED:"SUS", SUS:"SUS", PUP:"PUP", NA:"NA", COV:"COV"};
  const s = map[c] || c.slice(0,3);
  const cls = (s === "Q" || s === "P") ? "" : "bad";
  return '<span class="inj ' + cls + '" title="' + esc(code) + '">' + esc(s) + "</span>";
}

/* ---------- Sleeper ---------- */
async function sleeperLeagues(username){
  const [st, user] = await Promise.all([getState(), api("/api/sleeper/user/" + encodeURIComponent(username))]);
  if (!user || !user.user_id) throw new Error('No Sleeper user named "' + username + '"');
  const season = st.league_season || st.season;
  const lgs = await api("/api/sleeper/user/" + user.user_id + "/leagues/nfl/" + season) || [];
  return lgs.map(l => ({platform:"sleeper", id:l.league_id, name:l.name, season, uid:user.user_id, acct:username}));
}
async function sleeperDetail(L){
  const st = await getState();
  const week = Math.max(1, st.display_week || st.week || 1);
  const [users, rosters, mus, lg] = await Promise.all([
    api("/api/sleeper/league/" + L.id + "/users"),
    api("/api/sleeper/league/" + L.id + "/rosters"),
    api("/api/sleeper/league/" + L.id + "/matchups/" + week).catch(() => []),
    api("/api/sleeper/league/" + L.id).catch(() => ({}))
  ]);
  await Promise.all([getPlayers(), getSeasonStats(L.season)]);
  const rec = ((lg && lg.scoring_settings) || {}).rec;
  const scoring = rec >= 1 ? "ppr" : rec >= 0.5 ? "half" : rec === 0 ? "std" : "ppr";
  const uById = {}; (users || []).forEach(u => uById[u.user_id] = u);
  const ptsByRoster = {}; (mus || []).forEach(m => ptsByRoster[m.roster_id] = m);
  const teams = (rosters || []).map(r => {
    const u = uById[r.owner_id] || {};
    const s = r.settings || {};
    const m = ptsByRoster[r.roster_id] || {};
    const starters = new Set((r.starters || []).filter(x => x && x !== "0"));
    const reserve = new Set(r.reserve || []);
    const pp = m.players_points || {};
    const roster = (r.players || []).map(pid => {
      const p = players[pid] || [pid, "", "", null, null];
      return {id:pid, name:p[0], pos:p[1] || (/^[A-Z]{2,3}$/.test(pid) ? "DEF" : ""), team:p[2], inj:p[3], injPart:p[4],
        slot: starters.has(pid) ? "start" : reserve.has(pid) ? "ir" : "bench", pts: pp[pid]};
    });
    return {id:String(r.roster_id), name:(u.metadata && u.metadata.team_name) || u.display_name || ("Team " + r.roster_id),
      owner:u.display_name || "", w:s.wins||0, l:s.losses||0, t:s.ties||0,
      pf:(s.fpts||0) + (s.fpts_decimal||0)/100, roster, mine: r.owner_id === L.uid || (r.co_owners||[]).includes(L.uid),
      matchup:m.matchup_id, wk:m.points};
  });
  const groups = {}; teams.forEach(t => { if (t.matchup) (groups[t.matchup] = groups[t.matchup] || []).push(t); });
  const games = Object.values(groups).filter(g => g.length === 2).map(g => ({a:{id:g[0].id, pts:g[0].wk}, b:{id:g[1].id, pts:g[1].wk}}));
  return {week, teams, games, starterSplit:true, scoring};
}

/* ---------- Fleaflicker ---------- */
const fq = (ep, params) => "/api/flea/" + ep + "?" + new URLSearchParams(Object.assign({sport:"NFL"}, params)).toString();
async function fleaLeagues(acct){
  if (acct.type === "league") {
    const st = await api(fq("FetchLeagueStandings", {league_id:acct.value}));
    const name = (st.league && st.league.name) || ("Fleaflicker league " + acct.value);
    return [{platform:"flea", id:String(acct.value), name, myTeam:acct.team || fleaTeamFor(acct.value), acct:acct.value, acctObj:acct}];
  }
  const r = await api(fq("FetchUserLeagues", {email:acct.value}));
  const lgs = r.leagues || [];
  if (!lgs.length) throw new Error("No Fleaflicker leagues found for " + acct.value);
  return lgs.map(l => ({platform:"flea", id:String(l.id), name:l.name, myTeam: l.ownedTeam ? String(l.ownedTeam.id) : fleaTeamFor(String(l.id)), acct:acct.value}));
}
const val = x => (x && typeof x === "object") ? (x.value != null ? Number(x.value) : null) : (x == null ? null : Number(x));
async function fleaDetail(L){
  const [stand, board, ros] = await Promise.all([
    api(fq("FetchLeagueStandings", {league_id:L.id})),
    api(fq("FetchLeagueScoreboard", {league_id:L.id})),
    api(fq("FetchLeagueRosters", {league_id:L.id}))
  ]);
  const week = (board.schedulePeriod && (board.schedulePeriod.ordinal || board.schedulePeriod.value)) || null;
  const tinfo = {};
  (stand.divisions || []).forEach(d => (d.teams || []).forEach(t => {
    const rec = t.recordOverall || {};
    tinfo[t.id] = {name:t.name, owner:((t.owners||[])[0]||{}).displayName || "", w:rec.wins||0, l:rec.losses||0, t:rec.ties||0, pf:val(t.pointsFor)};
  }));
  const teams = (ros.rosters || []).map(r => {
    const t = r.team || {}; const i = tinfo[t.id] || {};
    const roster = (r.players || []).map(lp => {
      const p = lp.proPlayer || {}; const inj = p.injury || null;
      return {id:String(p.id), name:p.nameFull, pos:p.position, team:p.proTeamAbbreviation,
        inj: inj ? (inj.typeAbbreviaition || inj.typeAbbreviation || inj.typeFull) : null,
        injPart: inj ? (inj.description || inj.typeFull) : null, slot:"bench", pts:null};
    });
    return {id:String(t.id), name:t.name || i.name, owner:i.owner || (((t.owners||[])[0]||{}).displayName) || "",
      w:i.w||0, l:i.l||0, t:i.t||0, pf:i.pf, roster, mine: L.myTeam ? String(t.id) === L.myTeam : false};
  });
  Object.keys(tinfo).forEach(id => { if (!teams.find(t => t.id === String(id))) teams.push(Object.assign({id:String(id), roster:[], mine: L.myTeam === String(id)}, tinfo[id])); });
  const games = (board.games || []).map(g => {
    const hs = g.homeScore && g.homeScore.score, as = g.awayScore && g.awayScore.score;
    return {a:{id:String((g.away||{}).id), pts: as ? val(as) : val((g.away||{}).pointsFor)},
            b:{id:String((g.home||{}).id), pts: hs ? val(hs) : val((g.home||{}).pointsFor)},
            live: !!g.isInProgress, final: !!g.isFinalScore};
  }).filter(g => g.a.id !== "undefined" && g.b.id !== "undefined");
  return {week, teams, games, starterSplit:false};
}

/* ---------- league cache ---------- */
let leagues = [];      // [{meta, detail, error}]
let leaguesLoaded = false, leaguesErr = [];
async function loadAll(){
  leagues = []; leaguesErr = []; leaguesLoaded = false; render();
  const jobs = [];
  accts.sleeper.forEach(u => jobs.push(sleeperLeagues(u).catch(e => { leaguesErr.push("Sleeper " + u + ": " + e.message); return []; })));
  accts.flea.forEach(a => jobs.push(fleaLeagues(a).catch(e => { leaguesErr.push("Fleaflicker " + a.value + ": " + e.message); return []; })));
  const metas = (await Promise.all(jobs.concat([loadScoreboard().then(() => [])]))).flat();
  leagues = metas.map(m => ({meta:m, detail:null, error:null}));
  leaguesLoaded = true; render();
  await Promise.all(leagues.map(async L => {
    try { L.detail = L.meta.platform === "sleeper" ? await sleeperDetail(L.meta) : await fleaDetail(L.meta); }
    catch(e){ L.error = e.message; }
    if (cur.tab === "leagues") render();
  }));
  syncAlerts().catch(() => {});
  const st = await getState().catch(() => null);
  if (st) $("#wk").textContent = "Week " + (st.display_week || st.week);
}

/* ---------- views ---------- */
const cur = {tab:"leagues", league:null, newsMine:false};
function setTab(t){ cur.tab = t; cur.league = null; document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t)); render(); window.scrollTo(0,0); }
$("#bellBtn").addEventListener("click", () => setTab(cur.tab === "alerts" ? "leagues" : "alerts"));
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });

function render(){
  const v = $("#view");
  $("#bellBtn").setAttribute("aria-pressed", cur.tab === "alerts");
  if (cur.tab === "alerts") return renderAlerts(v);
  if (cur.tab === "accounts") return renderAccounts(v);
  if (cur.tab === "news") return renderNews(v);
  if (cur.tab === "trending") return renderTrending(v);
  if (cur.league != null) return renderLeague(v, leagues[cur.league]);
  return renderLeagues(v);
}
function hasAccts(){ return accts.sleeper.length + accts.flea.length > 0; }

function emptyState(v){
  v.innerHTML = '<h2>Your leagues, one screen</h2><p class="muted">Add a Sleeper username or a Fleaflicker email or league ID. Your rosters, scores and injury flags load straight from the league sites.</p>' + addForm();
  wireAdd(v);
}
function renderLeagues(v){
  if (!hasAccts()) return emptyState(v);
  let h = "";
  leaguesErr.forEach(e => h += '<div class="err">' + esc(e) + "</div>");
  if (!leaguesLoaded) { v.innerHTML = h + '<p class="spin">Loading your leagues…</p>'; return; }
  if (!leagues.length) { v.innerHTML = h + '<p class="muted">No leagues found for this season.</p>'; return; }
  h += '<div class="stack" style="margin-top:12px">';
  leagues.forEach((L, i) => {
    const m = L.meta, d = L.detail;
    h += '<button class="card league" data-l="' + i + '"><div class="row1"><span class="name">' + esc(m.name) + '</span><span class="badge">' + (m.platform === "sleeper" ? "Sleeper" : "Fleaflicker") + "</span></div>";
    if (L.error) h += '<span class="small" style="color:var(--bad)">' + esc(L.error) + "</span>";
    else if (!d) h += '<span class="small muted">Loading scores…</span>';
    else {

/* ---------- NFL games (live status for every player) ---------- */
const TEAM_ALIAS = {WSH:"WAS", JAC:"JAX", LA:"LAR", OAK:"LV", SD:"LAC"};
const tnorm = t => { t = String(t || "").toUpperCase(); return TEAM_ALIAS[t] || t; };
let nflGames = {}, gamesAt = 0;
async function loadScoreboard(){
  try {
    const r = await api("/api/scoreboard");
    const map = {};
    (r.games || []).forEach(g => { map[tnorm(g.away)] = g; map[tnorm(g.home)] = g; });
    nflGames = map; gamesAt = Date.now();
  } catch(e){}
}
const anyLive = () => Object.values(nflGames).some(g => g.state === "in");
function gameLine(team){
  if (!team) return '<span class="muted">Free agent</span>';
  const t = tnorm(team), g = nflGames[t];
  if (!gamesAt) return esc(t);
  if (!g) return esc(t) + ' · <span class="muted">Bye</span>';
  const opp = tnorm(g.away) === t ? "@" + tnorm(g.home) : "vs " + tnorm(g.away);
  if (g.state === "pre") return esc(t) + " " + esc(opp) + ' · <span class="muted">' + esc(g.detail) + "</span>";
  const sc = tnorm(g.away) + " " + g.awayScore + " – " + tnorm(g.home) + " " + g.homeScore;
  if (g.state === "in") return '<span class="live">LIVE</span> ' + esc(sc) + " · " + esc(g.detail);
  return esc(sc) + ' · <span class="muted">Final</span>';
}

/* ---------- season stats (Sleeper) ---------- */
let sstats = null, sstatsP = null;
function getSeasonStats(season){ if (!sstatsP) sstatsP = api("/api/sstats?season=" + season).then(s => (sstats = s)).catch(() => (sstats = {})); return sstatsP; }
const SCORE_IDX = {ppr:0, half:1, std:2};
function seasonPts(pid, fmtKey){ const s = sstats && sstats[pid]; if (!s) return null; return {pts:s[SCORE_IDX[fmtKey] || 0], gp:s[3]}; }

/* ---------- Fleaflicker: live lineup for one team ---------- */
async function fleaTeamRoster(L, team){
  try {
    const r = await api(fq("FetchRoster", {league_id:L.meta.id, team_id:team.id}));
    const out = [];
    (r.groups || []).forEach(g => (g.slots || []).forEach(s => {
      const lp = s.leaguePlayer; if (!lp || !lp.proPlayer) return;
      const p = lp.proPlayer, inj = p.injury || null, grp = String(g.group || "").toUpperCase();
      const rg = (lp.requestedGames || [])[0] || {};
      const pts = val(lp.viewingActualPoints) ?? val(rg.pointsActual);
      out.push({id:String(p.id), name:p.nameFull, pos:p.position, team:p.proTeamAbbreviation,
        inj: inj ? (inj.typeAbbreviaition || inj.typeAbbreviation || inj.typeFull) : null,
        injPart: inj ? (inj.description || inj.typeFull) : null,
        slot: grp === "START" ? "start" : (grp === "INJURED" || grp === "IR") ? "ir" : "bench",
        pts: pts, avg: val(lp.seasonAverage), tot: val(lp.seasonTotal)});
    }));
    if (out.length) { team.roster = out; team.live = true; }
  } catch(e){ team.liveErr = e.message; }
}

/* ---------- free agents ---------- */
async function loadFreeAgents(L, pos){
  const el = () => $("#fa");
  const token = (cur.faToken = Math.random());
  try {
    let list = [];
    if (L.meta.platform === "sleeper") {
      const d = L.detail;
      await Promise.all([getPlayers(), getSeasonStats(L.meta.season)]);
      const taken = new Set(); d.teams.forEach(t => t.roster.forEach(p => taken.add(p.id)));
      for (const id in players) {
        if (taken.has(id)) continue;
        const p = players[id]; if (pos !== "ALL" && p[1] !== pos) continue;
        if (!p[2] && p[1] !== "DEF") continue;
        const s = seasonPts(id, d.scoring); if (!s || !s.pts) continue;
        list.push({id, name:p[0], pos:p[1], team:p[2], inj:p[3], injPart:p[4], tot:s.pts, avg:s.gp ? s.pts / s.gp : null, gp:s.gp});
      }
      list.sort((a,b) => b.tot - a.tot); list = list.slice(0, 40);
    } else {
      const params = {league_id:L.meta.id, "filter.free_agent_only":"true", sort:"SORT_SEASON_TOTAL"};
      if (pos !== "ALL") params["filter.position.eligibility"] = pos === "DEF" ? "D/ST" : pos;
      const r = await api(fq("FetchPlayerListing", params));
      list = (r.players || []).map(x => {
        const p = x.proPlayer || {}, inj = p.injury || null;
        return {id:String(p.id), name:p.nameFull, pos:p.position, team:p.proTeamAbbreviation,
          inj: inj ? (inj.typeAbbreviaition || inj.typeAbbreviation || inj.typeFull) : null, injPart: inj ? (inj.description || inj.typeFull) : null,
          tot: val(x.seasonTotal), avg: val(x.seasonAverage)};
      });
    }
    if (token !== cur.faToken || !el()) return;
    if (!list.length) { el().innerHTML = '<p class="muted">No free agents found' + (pos !== "ALL" ? " at " + pos : "") + ".</p>"; return; }
    list.forEach(p => p.extra = p.avg != null ? '<small class="muted"> · ' + fmt(p.avg) + " per game</small>" : "");
    el().innerHTML = '<p class="small muted" style="margin:10px 0 6px">Ranked by season points' + (L.meta.platform === "sleeper" ? " (" + ({ppr:"PPR", half:"half PPR", std:"standard"}[L.detail.scoring] || "PPR") + ")" : "") + '</p><ul class="plist">' + list.map(p => playerRow(p, fmt(p.tot))).join("") + "</ul>";
    wireRows(el());
  } catch(e){ if (el()) el().innerHTML = '<div class="err">Couldn’t load free agents: ' + esc(e.message) + "</div>"; }
}
function wireBack(v){ v.querySelector("#back").addEventListener("click", () => { cur.league = null; cur.sub = "team"; render(); }); }
function rememberFleaTeam(m, team){
  try { const s = JSON.parse(localStorage.getItem(KEY + ".fleaTeams") || "{}"); s[m.id] = team; localStorage.setItem(KEY + ".fleaTeams", JSON.stringify(s)); } catch(e){}

function ago(d){
  const t = new Date(d).getTime(); if (!t) return "";
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 60) return m + "m ago"; if (m < 1440) return Math.round(m/60) + "h ago"; return Math.round(m/1440) + "d ago";
}

/* ---------- headlines ---------- */
let headlines = null;
async function renderNews(v){
  v.innerHTML = '<h2>NFL headlines</h2><label class="toggle"><input type="checkbox" id="mineOnly"' + (cur.newsMine ? " checked" : "") + '> Only stories about my players</label><div id="hl"><p class="spin">Loading headlines…</p></div>';
  v.querySelector("#mineOnly").addEventListener("change", e => { cur.newsMine = e.target.checked; drawNews(); });
  try { if (!headlines) headlines = await api("/api/headlines"); drawNews(); }
  catch(e){ $("#hl").innerHTML = '<div class="err">Couldn’t load headlines: ' + esc(e.message) + "</div>"; }
}
function drawNews(){
  const el = $("#hl"); if (!el || !headlines) return;
  const mine = myPlayers();
  const rx = mine.length ? new RegExp("\\b(" + mine.map(n => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + ")\\b", "gi") : null;
  let items = (headlines.items || []).map(a => {
    const text = a.title + " " + (a.desc || "") + " " + (a.athletes || []).join(" ");
    const hit = rx ? (text.match(rx) || []) : [];
    if (rx) rx.lastIndex = 0;
    return Object.assign({hit:[...new Set(hit)]}, a);
  });
  if (cur.newsMine) items = items.filter(a => a.hit.length);
  if (!items.length) { el.innerHTML = '<p class="muted">' + (cur.newsMine ? (mine.length ? "None of today’s top stories mention your players." : "Load your leagues first so we know who your players are.") : "No headlines right now.") + "</p>"; return; }
  el.innerHTML = '<div class="news card" style="padding:0">' + items.map(a => '<a href="' + esc(a.link) + '" target="_blank" rel="noopener"><b>' + esc(a.title) + "</b>" + (a.desc ? '<span class="small muted" style="display:block;margin:2px 0">' + esc(a.desc) + "</span>" : "") + "<small>ESPN" + (a.date ? " · " + ago(a.date) : "") + (a.hit.length ? ' · <span class="mine">' + esc(a.hit.join(", ")) + "</span>" : "") + "</small></a>").join("") + "</div>";
}

  let h = "<h2>Accounts</h2>";
  const list = accts.sleeper.map((u,i) => ({label:u, plat:"Sleeper", k:"s", i})).concat(accts.flea.map((a,i) => ({label:(a.type === "league" ? "League " : "") + a.value, plat:"Fleaflicker", k:"f", i})));
  if (list.length) h += '<div class="card">' + list.map(a => '<div class="acct"><span><b>' + esc(a.label) + '</b> <span class="badge">' + a.plat + '</span></span><button class="icon" data-rm="' + a.k + a.i + '">Remove</button></div>').join("") + "</div>";
  h += "<h3>Add another</h3>" + addForm();
  h += '<p class="small muted">Accounts are saved only in this browser. Nothing is sent anywhere except the league sites themselves.</p>';
  v.innerHTML = h;
  v.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.rm[0], i = +b.dataset.rm.slice(1);
    if (k === "s") accts.sleeper.splice(i,1); else accts.flea.splice(i,1);
    saveAccts(accts); loadAll(); render();
  }));
  wireAdd(v);
}

/* ---------- push alerts ---------- */
const pushOK = "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
async function post(path, body){
  const r = await fetch(path, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok) throw new Error(j.error || ("Request failed (" + r.status + ")"));
  return j;
}
function alertPrefs(){ try { return Object.assign({mine:true, fa:true, faPos:"ALL"}, JSON.parse(localStorage.getItem(KEY + ".alerts") || "{}")); } catch(e){ return {mine:true, fa:true, faPos:"ALL"}; } }
function saveAlertPrefs(p){ try { localStorage.setItem(KEY + ".alerts", JSON.stringify(p)); } catch(e){} }
function b64uBytes(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function getSub(){
  if (!pushOK) return null;
  try { const reg = await navigator.serviceWorker.getRegistration("/"); return reg ? await reg.pushManager.getSubscription() : null; } catch(e){ return null; }
}
function watchList(){
  const ids = new Set(), names = new Set();
  leagues.forEach(L => {
    const d = L.detail; if (!d) return;
    const me = d.teams.find(t => t.mine); if (!me) return;
    me.roster.forEach(p => { if (L.meta.platform === "sleeper") ids.add(String(p.id)); else if (p.name) names.add(norm(p.name) + "|" + (p.pos || "")); });
  });
  return {ids:[...ids], names:[...names], leagues: leagues.map(L => ({p:L.meta.platform, id:L.meta.id, name:L.meta.name}))};
}
let alertState = {sub:null, watching:null, msg:"", busy:false, list:null};
async function syncAlerts(sub){
  sub = sub || await getSub(); if (!sub) return null;
  const r = await post("/api/push/subscribe", Object.assign({sub: sub.toJSON(), prefs: alertPrefs()}, watchList()));
  alertState.watching = r;
  return r;
}
async function enableAlerts(){
  const perm = await Notification.requestPermission();
  if (perm !== "granted") throw new Error("Notifications are blocked for this site. Allow them in your browser's site settings for this page, then try again.");
  const reg = await navigator.serviceWorker.register("/sw.js");
  await navigator.serviceWorker.ready;
  const {key} = await api("/api/push/key");
  let sub = await reg.pushManager.getSubscription();
  let lastKey = null; try { lastKey = localStorage.getItem(KEY + ".vapid"); } catch(e){}
  if (sub && lastKey && lastKey !== key) { await sub.unsubscribe(); sub = null; }
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uBytes(key)});
  try { localStorage.setItem(KEY + ".vapid", key); } catch(e){}
  await syncAlerts(sub);
  return sub;
}
function fmtWhen(t){ const d = new Date(t); return d.toLocaleDateString([], {weekday:"short"}) + " " + d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}); }

async function renderAlerts(v){
  const prefs = alertPrefs();
  let h = "<h2>Alerts</h2>";
  if (!pushOK) {
    v.innerHTML = h + '<div class="card"><p style="margin:0">This browser can’t receive alerts.</p><p class="small muted" style="margin:8px 0 0">On iPhone, tap Share, then Add to Home Screen, and open Snap Count from your home screen. On Android, use Chrome.</p></div>';
    return;
  }
  const sub = alertState.sub = await getSub();
  if (cur.tab !== "alerts") return;
  if (!sub) {
    h += '<div class="card alertpitch"><p style="margin:0 0 10px"><b>Get a notification on this phone when:</b></p><ul class="ticks"><li>A player on your roster is downgraded, ruled out, placed on IR, comes off the injury report, or gets traded</li><li>A starter is ruled out and his backup is a free agent in one of your leagues</li><li>A free agent’s projected points jump, especially at QB</li></ul>' +
      '<button class="btn" id="alOn" style="width:100%;margin-top:6px">Turn on alerts</button>' +
      (hasAccts() ? "" : '<p class="small muted" style="margin:10px 0 0">Add your leagues under Accounts first so we know who your players are.</p>') + "</div>";
    if (alertState.msg) h += '<div class="err" style="margin-top:10px">' + esc(alertState.msg) + "</div>";
    v.innerHTML = h;
    v.querySelector("#alOn").addEventListener("click", async e => {
      e.target.disabled = true; e.target.textContent = "Turning on…"; alertState.msg = "";
      try { await enableAlerts(); } catch(err){ alertState.msg = err.message; }
      render();
    });
    return;
  }
  const w = watchList();
  const nMine = w.ids.length + w.names.length;
  h += '<div class="card"><div class="alstat"><span class="dot"></span><b>Alerts are on for this phone</b></div><p class="small muted" style="margin:6px 0 0">' +
    (nMine ? "Watching " + nMine + " of your players across " + w.leagues.length + " league" + (w.leagues.length === 1 ? "" : "s") + "." : "Your leagues are still loading.") +
    " QBs are checked every minute, other positions every 3 minutes.</p></div>";
  h += "<h3>What to send</h3>" + '<div class="card stackc">' +
    '<label class="toggle"><input type="checkbox" id="alMine"' + (prefs.mine ? " checked" : "") + "> My players: injuries, status changes and trades</label>" +
    '<label class="toggle"><input type="checkbox" id="alFa"' + (prefs.fa ? " checked" : "") + "> Free agents: new starters and projection jumps</label>" +
    '<div class="seg" role="group" aria-label="Free agent positions"><button type="button" data-fp="ALL" aria-pressed="' + (prefs.faPos === "ALL") + '">All positions</button><button type="button" data-fp="QB" aria-pressed="' + (prefs.faPos === "QB") + '">QBs only</button></div></div>';
  h += '<div class="btnrow"><button class="btn ghost" id="alTest">Send a test alert</button><button class="btn ghost" id="alOff">Turn off</button></div>';
  if (alertState.msg) h += '<p class="small" style="margin:8px 0 0">' + esc(alertState.msg) + "</p>";
  h += '<h3>Recent alerts</h3><div id="alList"><p class="spin">Loading…</p></div>';
  v.innerHTML = h;
  const savePrefs = async p => { saveAlertPrefs(p); alertState.msg = ""; try { await syncAlerts(sub); } catch(e){ alertState.msg = e.message; } render(); };
  v.querySelector("#alMine").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {mine:e.target.checked})));
  v.querySelector("#alFa").addEventListener("change", e => savePrefs(Object.assign(alertPrefs(), {fa:e.target.checked})));
  v.querySelectorAll("[data-fp]").forEach(b => b.addEventListener("click", () => savePrefs(Object.assign(alertPrefs(), {faPos:b.dataset.fp}))));
  v.querySelector("#alTest").addEventListener("click", async e => {
    e.target.disabled = true; e.target.textContent = "Sending…";
    try { await syncAlerts(sub); await post("/api/push/test", {endpoint: sub.endpoint}); alertState.msg = "Test sent. It should show up on this phone in a few seconds."; }
    catch(err){ alertState.msg = err.message; }
    render();
  });
  v.querySelector("#alOff").addEventListener("click", async () => {
    try { await post("/api/push/unsubscribe", {endpoint: sub.endpoint}); } catch(e){}
    try { await sub.unsubscribe(); } catch(e){}
    alertState.msg = ""; render();
  });
  try {
    const r = await api("/api/push/alerts?e=" + encodeURIComponent(sub.endpoint));
    const list = r.alerts || [], el = $("#alList"); if (!el) return;
    el.innerHTML = list.length ? '<div class="news card" style="padding:0">' + list.map(a => '<div class="alitem"><b>' + esc(a.title) + "</b><span>" + esc(a.body) + "</span><small>" + fmtWhen(a.t) + "</small></div>").join("") + "</div>" : '<p class="muted small">Nothing yet. You’ll see every alert here too.</p>';
  } catch(e){ const el = $("#alList"); if (el) el.innerHTML = '<div class="err">Couldn’t load your alerts: ' + esc(e.message) + "</div>"; }
}
if (pushOK) navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.open === "alerts") setTab("alerts"); });

/* ---------- boot ---------- */
accts.flea.forEach(a => { if (a.type === "league") a.team = fleaTeamFor(a.value); });
if (location.hash === "#alerts") { cur.tab = "alerts"; try { history.replaceState(null, "", location.pathname); } catch(e){} }
render();
async function refreshLive(){
  if (document.hidden || !$("#sheet").hidden || document.activeElement && document.activeElement.tagName === "SELECT") return;
  await loadScoreboard();
  if (!anyLive() || cur.tab !== "leagues") return;
  const targets = cur.league != null ? [leagues[cur.league]] : leagues;
  await Promise.all(targets.filter(Boolean).map(async L => {
    try {
      const keep = L.detail && L.detail.teams.find(t => t.mine || t.id === cur.team);
      const fresh = L.meta.platform === "sleeper" ? await sleeperDetail(L.meta) : await fleaDetail(L.meta);
      if (keep) { const nt = fresh.teams.find(t => t.id === keep.id); if (nt && L.meta.platform === "flea") await fleaTeamRoster(L, nt); }
      L.detail = fresh;
    } catch(e){}
  }));
  if (cur.tab === "leagues" && (cur.sub || "team") !== "fa") render();
}
setInterval(refreshLive, 60000);
if (hasAccts()) loadAll(); else getState().then(st => $("#wk").textContent = "Week " + (st.display_week || st.week)).catch(() => {});
</script>
