  const aiRows = Object.entries(j.ai || {}).map(([k, n]) => { const [, mode, via] = k.split("|"); return {mode, via, n}; }).sort((a, b) => b.n - a.n);
  const MODE = {coach: "Coach questions", brief: "Morning briefings", recap: "Weekly recaps", roast: "Roasts", draft: "Draft write-ups", matchups: "Matchup recaps", negotiate: "Trade negotiation practice", pitch: "Trade pitches", auto: "Automatic (pregame briefings, previews)"};
  h += '<h3>AI use today</h3><div class="card">' + (aiRows.length ? aiRows.map(r => '<div class="acct"><span>' + esc(MODE[r.mode] || r.mode) + ' <span class="small muted">' + (r.via === "gemini" ? "Gemini (free key)" : "Cloudflare allowance") + '</span></span><b>' + r.n + "</b></div>").join("") : '<p class="muted small" style="margin:0">Nothing yet today (counting starts now).</p>') + '<p class="small muted" style="margin:8px 0 0">Gemini handles AI first; the Cloudflare allowance (resets 7 PM Eastern) is only the backup.</p></div>';
  h += '<h3>Daily check</h3>';
  if (!hh || !hh.at) h += '<p class="muted small">The first check runs at 9:17 AM Eastern.</p>';
  else h += '<div class="card"><p class="small muted" style="margin:0 0 8px">Last run ' + esc(new Date(hh.at).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"})) + '</p>' + hh.res.map(r => '<div class="acct"><span>' + (r.ok ? "✓ " : "✗ ") + esc(r.name) + (r.note ? ' <span class="small muted">' + esc(r.note) + '</span>' : "") + '</span><span class="small muted">' + (r.ms / 1000).toFixed(1) + 's</span></div>').join("") + '</div>';
  h += '<button class="btn ghost" id="hcRun" style="margin-top:10px">Run the check now</button>';
  body.innerHTML = h;
  body.querySelector("#hcRun").addEventListener("click", async e => { e.target.disabled = true; e.target.textContent = "Checking…"; try { await api("/api/health?run=1"); } catch(x){} openUsage(); });
}

/* ---------- commissioner: dues, rules, awards ---------- */
async function openComm(L, startTab){
  const body = openSheetShell("Dues, rules and awards");
  const d = L.detail, me = d.teams.find(t => t.mine), base = "/api/comm?p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id);
  const T = id => (d.teams.find(t => String(t.id) === String(id)) || {name: "?"}).name;
  let c, tab = startTab || "dues", msg = "", gm = null;
  const load = async () => { c = await api(base + "&dev=" + devId()); };
  const act = async (action, extra) => { try { c = await post2(base, Object.assign({action, dev: devId(), team: me.id, name: me.name}, extra || {})); msg = ""; } catch(e){ msg = e.message; } draw(); };
  try { await load(); } catch(e){ body.innerHTML = '<div class="err">' + esc(e.message) + "</div>"; return; }
  const draw = () => {
    let h = '<div class="seg">' + [["dues", "Dues"], ["rules", "Rules"], ["awards", "Awards"], ["groupme", "GroupMe"]].map(([k, l]) => '<button aria-pressed="' + (tab === k) + '" data-ct="' + k + '">' + l + '</button>').join("") + '</div>';
    if (msg) h += '<div class="err">' + esc(msg) + '</div>';
    h += '<p class="small muted" style="margin:10px 0">' + (c.isComm ? "You’re the commissioner here." : c.ownerName ? "Commissioner: " + esc(c.ownerName) + "." : "No commissioner yet.") + '</p>';
    if (tab === "dues") {
      const paid = d.teams.filter(t => c.dues.paid[t.id]).length;
      if (!c.dues.amount && !c.isComm) h += '<p class="muted">The commissioner hasn’t set dues yet.</p>';
      else {
        h += c.dues.amount ? '<div class="usestats"><div><b>$' + c.dues.amount + '</b><span>per team</span></div><div><b>' + paid + "/" + d.teams.length + '</b><span>paid</span></div><div><b>$' + (paid * c.dues.amount) + '</b><span>collected of $' + (d.teams.length * c.dues.amount) + '</span></div></div>' : "";
        if (c.dues.note) h += '<p class="small">' + esc(c.dues.note) + '</p>';
        h += '<div class="card">' + d.teams.map(t => '<label class="acct duesrow"><span>' + esc(t.name) + (t.mine ? ' <span class="badge">You</span>' : "") + '</span>' + (c.isComm ? '<input type="checkbox" data-paid="' + esc(t.id) + '"' + (c.dues.paid[t.id] ? " checked" : "") + '>' : '<span class="small ' + (c.dues.paid[t.id] ? "" : "muted") + '">' + (c.dues.paid[t.id] ? "Paid" : "Not yet") + '</span>') + '</label>').join("") + '</div>';
      }
      if (c.isComm) h += '<h3>Set dues</h3><div class="card stackc" style="gap:8px"><input type="number" min="0" inputmode="numeric" id="cmAmt" placeholder="Amount per team" value="' + (c.dues.amount || "") + '"><input id="cmNote" maxlength="200" placeholder="How to pay (Venmo, due date…)" value="' + esc(c.dues.note || "") + '"><button class="btn" id="cmDues">Save dues</button></div>';
    } else if (tab === "rules") {
      if (c.isComm) h += '<textarea id="cmRules" rows="14" style="width:100%" placeholder="Payouts, trade rules, tiebreakers, keeper rules, punishments for last place…">' + esc(c.rules || "") + '</textarea><button class="btn" id="cmRulesSave" style="margin-top:8px">Save rules</button>';
      else h += c.rules ? '<div class="card rulestext">' + esc(c.rules).replace(/\n/g, "<br>") + '</div>' : '<p class="muted">No league rules posted yet.</p>';
    } else if (tab === "groupme") {
      if (!c.isComm) h += '<p class="muted">The commissioner connects the league’s GroupMe here. Once it’s on, the Chat tab shows the group live.</p>';
      else if (!gm) h += '<p class="spin">Checking GroupMe…</p>';
      else if (gm.connected) h += '<div class="card"><p style="margin:0 0 8px"><b>✓ GroupMe is connected.</b></p><p class="small muted" style="margin:0">Messages show up in the Chat tab, and the Snap Count bot posts trade market updates there. To switch groups, disconnect and set it up again.</p></div><button class="icon" id="gmOff" style="margin-top:12px">Disconnect GroupMe</button>';
      else h += '<div class="gmsteps"><div class="card"><b>1. Copy this address</b><p class="small muted">GroupMe sends the group’s messages here.</p>' + (gm.callback ? '<div class="copyrow"><input readonly id="gmCb" value="' + esc(gm.callback) + '" aria-label="Callback address"><button class="btn ghost" id="gmCopy">Copy</button></div>' : '<button class="btn" id="gmStart">Make my address</button>') + '</div>'
        + '<div class="card"><b>2. Create the bot on GroupMe</b><p class="small">Open <a href="https://dev.groupme.com/bots/new" target="_blank" rel="noopener">dev.groupme.com/bots/new</a> and sign in with your GroupMe account. Pick your league’s group, name it <b>Snap Count</b>, paste the address into <b>Callback URL</b> and leave the rest blank. Press Submit.</p></div>'
        + '<div class="card stackc" style="gap:8px"><b>3. Paste the Bot ID</b><p class="small muted" style="margin:0">It’s on the bot list right after you create it.</p><input id="gmBot" placeholder="Bot ID" autocomplete="off" autocapitalize="off" spellcheck="false"' + (gm.callback ? "" : " disabled") + '><button class="btn" id="gmSave"' + (gm.callback ? "" : " disabled") + '>Connect and say hello</button></div></div>';
    } else {
      const A = c.awards, votes = Object.values(A.votes), mine = (A.votes[me.id] || {}).picks || {};
      if (A.cats.length) {
        h += '<p class="small muted">' + (A.open ? "Voting is open. " + votes.length + " of " + d.teams.length + " teams have voted. You can’t vote for yourself." : "Voting is closed.") + '</p>';
        A.cats.forEach(cat => {
          const tally = {}; votes.forEach(v => { const x = v.picks[cat.id]; if (x) tally[x] = (tally[x] || 0) + 1; });
          const lead = Object.entries(tally).sort((a, b) => b[1] - a[1]);
          h += '<div class="card" style="margin-bottom:10px"><b>' + esc(cat.name) + '</b>' + (A.open ? '<select data-vote="' + cat.id + '" style="width:100%;margin-top:8px"><option value="">Pick a team</option>' + d.teams.filter(t => !t.mine).map(t => '<option value="' + esc(t.id) + '"' + (mine[cat.id] === String(t.id) ? " selected" : "") + '>' + esc(t.name) + '</option>').join("") + '</select>' : "")
            + (lead.length && (!A.open || c.isComm) ? '<p class="small" style="margin:8px 0 0">' + lead.slice(0, 3).map(([t, n], i) => (i ? "" : "🏆 ") + esc(T(t)) + " (" + n + ")").join(" · ") + '</p>' : "") + '</div>';
        });
        if (A.open) h += '<button class="btn" id="cmVote">Save my votes</button>';
      } else if (!c.isComm) h += '<p class="muted">The commissioner hasn’t set up awards yet.</p>';
      if (c.isComm) h += '<h3>Award categories</h3><textarea id="cmCats" rows="5" style="width:100%" placeholder="One per line: Best trade, Worst trade, Biggest choke, Waiver hero">' + esc(A.cats.map(x => x.name).join("\n")) + '</textarea><div class="sendrow"><button class="btn ghost" id="cmCatsSave">Save categories</button><button class="btn" id="cmOpen">' + (A.open ? "Close voting" : "Open voting") + '</button></div>';
    }
    if (!c.ownerName) h += '<div class="card install" style="margin-top:14px"><div><b>Run this league?</b><span>The commissioner sets dues, posts rules and opens award voting. Everyone else can see them and vote.</span></div><button class="btn" id="cmClaim">I’m the commissioner</button></div>';
    else if (c.isComm) h += '<p style="margin-top:18px"><button class="icon" id="cmRelease">Hand off commissioner</button></p>';
    body.innerHTML = h;
    const on = (sel, ev, fn) => { const el = body.querySelector(sel); if (el) el.addEventListener(ev, fn); };
    body.querySelectorAll("[data-ct]").forEach(b => b.addEventListener("click", () => { tab = b.dataset.ct; msg = ""; draw(); }));
    body.querySelectorAll("[data-paid]").forEach(b => b.addEventListener("change", () => act("paid", {who: b.dataset.paid, paid: b.checked})));
    on("#cmDues", "click", () => act("dues", {amount: body.querySelector("#cmAmt").value, note: body.querySelector("#cmNote").value}));
    on("#cmRulesSave", "click", () => act("rules", {rules: body.querySelector("#cmRules").value}));
    const cats = () => body.querySelector("#cmCats").value.split("\n").map(x => x.trim()).filter(Boolean);
    on("#cmCatsSave", "click", () => act("awards", {cats: cats()}));
    on("#cmOpen", "click", () => act("awards", {cats: cats(), open: !c.awards.open}));
    on("#cmVote", "click", () => { const picks = {}; body.querySelectorAll("[data-vote]").forEach(s => { if (s.value) picks[s.dataset.vote] = s.value; }); act("vote", {picks}); });
    on("#cmClaim", "click", () => act("claim"));
    const gq = "/api/chat/setup?p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id);
    const gmCall = async (action, extra) => { try { const r = await post(gq, Object.assign({dev: devId(), action}, extra || {})); msg = ""; return r; } catch(e){ msg = e.message; draw(); return null; } };
    on("#gmStart", "click", async () => { const r = await gmCall("start"); if (r) { gm.callback = r.callback; draw(); } });
    on("#gmCopy", "click", async () => { const i = body.querySelector("#gmCb"); try { await navigator.clipboard.writeText(i.value); body.querySelector("#gmCopy").textContent = "Copied"; } catch(e){ i.select(); } });
    on("#gmSave", "click", async () => { const b = body.querySelector("#gmSave"); b.disabled = true; b.textContent = "Connecting…"; const r = await gmCall("bot", {bot: body.querySelector("#gmBot").value.trim()}); if (r) { gm = {connected: true}; gmState[L.meta.platform + ":" + L.meta.id] = true; draw(); } });
    on("#gmOff", "click", async () => { const r = await gmCall("off"); if (r) { gm = {connected: false}; gmState[L.meta.platform + ":" + L.meta.id] = false; const r2 = await gmCall("start"); gm.callback = r2 && r2.callback; draw(); } });
    if (tab === "groupme" && c.isComm && !gm) api("/api/chat?p=" + L.meta.platform + "&lid=" + encodeURIComponent(L.meta.id) + "&dev=" + devId()).then(r => { gm = {connected: r.connected, callback: r.callback}; draw(); }).catch(e => { msg = e.message; gm = {connected: false}; draw(); });
    on("#cmRelease", "click", () => act("release"));
  };
  draw();
}

/* ---------- first-run walkthrough: four short cards, once per device ---------- */
const TOUR = [
  ["ic-home", "Your leagues", "Every league on one screen. Tap a league for your lineup, matchups, standings, the draft room and league tools."],
  ["ic-swap", "Trade", "Build any trade and get a grade with your league’s scoring. Post players to the trade market so leaguemates can see what you’re shopping."],
  ["ic-spark", "Coach", "Ask anything about your team, a trade or a waiver add, by typing or with the mic. It already knows your roster and league rules."],
  ["ic-bell", "Alerts", "Turn on alerts for injuries on your team, players you start, trade market posts, and a morning briefing on game days."]
];
function maybeTour(){
  try { if (localStorage.getItem(KEY + ".tour") || !$("#sheet").hidden) return; } catch(e){ return; }
  openTour();
}
function openTour(){
  const body = openSheetShell("Welcome to Snap Count");
  let i = 0;
  const done = () => { try { localStorage.setItem(KEY + ".tour", "1"); } catch(e){} };
  const draw = () => {
    const [ic, t, d] = TOUR[i];
    body.innerHTML = '<div class="tourcard"><span class="tourico" aria-hidden="true"><i class="' + ic + '"></i></span><h3>' + esc(t) + '</h3><p>' + esc(d) + '</p></div>'
      + '<div class="tourdots" aria-hidden="true">' + TOUR.map((_, k) => '<span' + (k === i ? ' class="on"' : '') + '></span>').join("") + '</div>'
      + '<div class="sendrow"><button class="btn ghost" id="tourSkip">' + (i ? "Back" : "Skip") + '</button><button class="btn" id="tourNext">' + (i === TOUR.length - 1 ? (pushOK ? "Turn on alerts" : "Start") : "Next") + '</button></div>';
    body.querySelector("#tourSkip").addEventListener("click", () => { if (i) { i--; draw(); } else { done(); closeSheet(); } });
    body.querySelector("#tourNext").addEventListener("click", () => { if (i < TOUR.length - 1) { i++; draw(); return; } done(); closeSheet(); if (pushOK) setTab("alerts"); });
  };
  draw();
}

/* ---------- boot ---------- */
let pendingJoin = null;
try {
  const j = new URLSearchParams(location.search).get("join");
  const m = j && j.match(/^(flea|espn|mfl):(\d{3,12})$/);
  if (m) {
    pendingJoin = m[1] + ":" + m[2];
    if (m[1] === "flea" && !accts.flea.some(a => a.type === "league" && a.value === m[2])) accts.flea.push({type:"league", value:m[2]});
    if (m[1] !== "flea" && !accts[m[1]].some(a => a.id === m[2])) accts[m[1]].push({id:m[2]});
    saveAccts(accts);
    history.replaceState(null, "", location.pathname);
  }
} catch(e){}
accts.flea.forEach(a => { if (a.type === "league") a.team = fleaTeamFor(a.value); });
if (location.hash === "#alerts") { cur.tab = "alerts"; try { history.replaceState(null, "", location.pathname); } catch(e){} try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch(e){} }
/* ---------- keep screens clean: long explanations fold into "How this works" ---------- */
(() => {
  const fold = root => {
    root.querySelectorAll("p.muted, p.small.muted").forEach(p => {
      if (p.dataset.kept || p.closest("details,.cmsg,.err,.clog,form,.bug,.vtop")) return;
      const t = p.textContent.trim();
      const prev = p.previousElementSibling;
      if (t.length < 110 || p.querySelector("a,button,input,select") || (prev && prev.tagName === "H2" && !leagues.length)) { p.dataset.kept = 1; return; }
      p.dataset.kept = 1;
      const prev2 = p.previousElementSibling;
      if (prev2 && prev2.tagName === "DETAILS" && prev2.classList.contains("howto")) { prev2.appendChild(p); return; }
      const d = document.createElement("details"); d.className = "howto";
      d.innerHTML = "<summary>How this works</summary>";
      p.replaceWith(d); d.appendChild(p);
    });
  };
  const obs = new MutationObserver(muts => { for (const m of muts) for (const n of m.addedNodes) if (n.nodeType === 1) fold(n.parentNode || n); });
  ["#view", "#sheetPanel"].forEach(sel => { const el = $(sel); if (el) obs.observe(el, {childList: true, subtree: true}); });
})();

let goCoach = false;
setTimeout(dailyPing, 4000);
syncStartup().catch(() => {});
if (readCalcLink()) cur.tab = "calc";
try { const go = new URLSearchParams(location.search).get("go"); if (["news", "trade", "edge", "alerts", "calc"].includes(go)) cur.tab = go; if (go === "coach") goCoach = true; if (go) history.replaceState(null, "", location.pathname); } catch(e){}
document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === navTab(cur.tab)));
document.addEventListener("visibilitychange", () => { if (!document.hidden) try { navigator.clearAppBadge && navigator.clearAppBadge(); } catch(e){} });
// Installed apps can sit open in the background for days. When you come back to it, check for a new version and
// reload into it, unless you're in the middle of typing something.
const BUILD = "__BUILD__";
let lastVerCheck = Date.now();
async function checkVersion(){
  if (Date.now() - lastVerCheck < 60000) return; lastVerCheck = Date.now();
  try {
    const j = await (await fetch("/api/version", {cache: "no-store"})).json();
    if (!j.build || j.build === BUILD) return;
    const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.value;
    if (typing || !$("#sheet").hidden) { const b = $("#updBar"); if (b) b.hidden = false; return; }
    location.reload();
  } catch(e){}
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkVersion(); });
setInterval(() => { if (!document.hidden) checkVersion(); }, 15 * 60000);
render();
async function refreshLive(){
  if (document.hidden || !$("#sheet").hidden || document.activeElement && document.activeElement.tagName === "SELECT") return;
  await loadScoreboard();
  if (Date.now() - injAt > 5 * 60000) { await loadInjuries(); if (cur.tab === "leagues" && (cur.sub || "team") !== "fa" && $("#sheet").hidden) render(); }
  if (!anyLive() || cur.tab !== "leagues") return;
  const targets = cur.league != null ? [leagues[cur.league]] : leagues;
  await Promise.all(targets.filter(Boolean).map(async L => {
    try {
      const keep = L.detail && L.detail.teams.find(t => t.mine || t.id === cur.team);
      const fresh = await detailFor(L.meta);
      if (keep) { const nt = fresh.teams.find(t => t.id === keep.id); if (nt && L.meta.platform === "flea") await fleaTeamRoster(L, nt); }
      L.detail = fresh;
    } catch(e){}
  }));
  if (cur.tab === "leagues" && (cur.sub || "team") !== "fa") render();
}
setInterval(refreshLive, 60000);
$("#coachFab").addEventListener("click", openCoach);
if (goCoach) { const t = setInterval(() => { if (leagues.some(L => L.detail)) { clearInterval(t); openCoach(); } }, 400); setTimeout(() => clearInterval(t), 30000); }
if (hasAccts()) loadAll(); else getState().then(st => $("#wk").textContent = "Week " + (st.display_week || st.week)).catch(() => {});
</script>
